# Contract property -> column, for the pairs tools/gen_docs.py cannot infer (D20). Hand-written.
#
# Keys are resource names exactly as contracts/docs/DATA_OWNERSHIP.md section 2 writes them; under
# each, a contract property (top level, or nested as `items[].field`). Each entry has:
#   columns:  [table.column, ...]  the columns that store it (required unless computed)
#   computed: how it is derived    not stored as such; the repository works it out
#   note:     anything else the repository must know
#   path:     the operation the property comes from, when it isn't one of the resource's own
#             paths (a check-in request writing the encounter)
# gen_docs.py stops if a resource, property, path, table or column named here does not exist,
# so this file cannot drift silently. Same-named properties (camelCase of a column) need no
# entry.

"Patient (demographics, contacts)":
  genderIdentity:
    columns: [patient.ext_gender_identity_system, patient.ext_gender_identity_code,
              patient.ext_gender_identity_display, patient.ext_gender_identity_text]
    note: >-
      shown at registration only where the practice's setting registration.show_sogi_fields
      is true (A49)
  sexualOrientation:
    columns: [patient.ext_sexual_orientation_system, patient.ext_sexual_orientation_code,
              patient.ext_sexual_orientation_display, patient.ext_sexual_orientation_text]
    note: >-
      shown at registration only where the practice's setting registration.show_sogi_fields
      is true (A49)
  occupation:
    columns: [patient.ext_occupation_system, patient.ext_occupation_code,
              patient.ext_occupation_display, patient.ext_occupation_text]
  industry:
    columns: [patient.ext_industry_system, patient.ext_industry_code,
              patient.ext_industry_display, patient.ext_industry_text]
  tribalAffiliation:
    columns: [patient.ext_tribal_affiliation_system, patient.ext_tribal_affiliation_code,
              patient.ext_tribal_affiliation_display, patient.ext_tribal_affiliation_text]
  employer:
    columns: [employer.name, employer.phone, employer.address_lines, employer.address_city,
              employer.address_state, employer.address_postal_code, employer.address_country]
    note: one admin row with patient_id (D38); clearing the employer deletes the row
  mrn:
    columns: [identifier.value, identifier.system, identifier.patient_id, identifier.type_code]
    note: >-
      an identifier row with type_code MR, its system and value from admin.next_mrn() (the
      practice's mrn_counter, D41), written in the registration transaction
  name:
    columns: [human_name.family, human_name.given, human_name.prefix, human_name.suffix,
              human_name.use]
    note: the human_name row with use official; prefix and suffix are one-element lists
  preferredName:
    columns: [human_name.text, human_name.use]
    note: a human_name row with use nickname, its text the name (D57)
  previousNames:
    columns: [human_name.family, human_name.given, human_name.prefix, human_name.suffix,
              human_name.use]
    note: >-
      human_name rows with use old or maiden (D57). The contract has no use, so new ones are
      written as old; both are read back and searched
  phones:
    columns: [contact_point.value, contact_point.system, contact_point.use]
    note: >-
      one contact_point row per number; number is value, in E.164. system is sms when
      textMessages is true, otherwise phone (both are searched as phones)
  emails:
    columns: [contact_point.value, contact_point.system, contact_point.use]
    note: one contact_point row per address, system email; address is value
  address:
    columns: [address.line, address.city, address.state, address.postal_code, address.country,
              address.use]
    note: lines is line, postalCode is postal_code, use home
  birthSex:
    columns: [patient.ext_birthsex]
  maritalStatus:
    columns: [patient.marital_status_code]
    note: v3 MaritalStatus; the system is fixed
  preferredLanguage:
    columns: [patient_communication.language_code, patient_communication.preferred]
    note: >-
      the patient_communication row with preferred true; a BCP 47 tag (system
      urn:ietf:bcp:47)
  race:
    columns: [patient_race_ethnicity.kind, patient_race_ethnicity.level,
              patient_race_ethnicity.code, patient.ext_race_text]
    note: >-
      patient_race_ethnicity rows with kind race: ombCategories at level ombCategory, detailed
      at level detailed; text in ext_race_text
  ethnicity:
    columns: [patient_race_ethnicity.kind, patient_race_ethnicity.level,
              patient_race_ethnicity.code, patient.ext_ethnicity_text]
    note: as race, with kind ethnicity and text in ext_ethnicity_text
  identifiers:
    columns: [identifier.type_code, identifier.system, identifier.value,
              identifier.assigner_display, identifier.supporting_document_id]
    note: the patient's identifier rows, as "Patient identifiers"; never the MRN (D41)
  restricted:
    computed: true when patient.meta_security holds R or V (SECURITY_MODEL 5.2)
    columns: [patient.meta_security]
  mergedIntoId:
    computed: the other_patient_id of the patient's patient_link row with type replaced-by
    columns: [patient_link.other_patient_id, patient_link.type]
  preferredPharmacy:
    columns: [patient_pharmacy.pharmacy_id, patient_pharmacy.is_default, pharmacy.name,
              pharmacy.address_line, pharmacy.city, pharmacy.state, pharmacy.postal_code]
    note: the patient_pharmacy row with is_default true, and its pharmacy (D50)
  duplicateCheck:
    computed: >-
      a request flag, not stored: default refuses with 409 possible-duplicate when the
      duplicate check finds similar patients; override registers anyway
  duplicateOverrideReason:
    columns: [audit_event.reason]
    note: not stored on the patient; written as the reason of the registration's audit row

"Patient identifiers (MRN, driver's license)":
  type:
    columns: [identifier.type_code]
    note: v2-0203 (type_system fixed); DL or PI here, MR only from the counter (D41)
  assigner:
    columns: [identifier.assigner_display]
  documentId:
    columns: [identifier.supporting_document_id]
    note: >-
      the scanned document behind the identifier, e.g. a driver's license image filed with
      category identity (D56); the same patient's document

"Related persons, emergency contacts":
  name:
    columns: [human_name.family, human_name.given, human_name.prefix, human_name.suffix,
              human_name.use]
    note: the related person's human_name row with use official
  relationships:
    columns: [related_person_relationship.code_system, related_person_relationship.code_code,
              related_person_relationship.code_display, related_person_relationship.code_text]
    note: one related_person_relationship row per CodedValue
  phones:
    columns: [contact_point.value, contact_point.system, contact_point.use]
    note: >-
      one contact_point row per number; number is value, in E.164. system is sms when
      textMessages is true, otherwise phone (both are searched as phones)
  emails:
    columns: [contact_point.value, contact_point.system, contact_point.use]
    note: one contact_point row per address, system email; address is value
  address:
    columns: [address.line, address.city, address.state, address.postal_code, address.country,
              address.use]
    note: lines is line, postalCode is postal_code
  employer:
    columns: [employer.name, employer.phone, employer.address_lines, employer.address_city,
              employer.address_state, employer.address_postal_code, employer.address_country]
    note: one admin row with related_person_id (D38); clearing the employer deletes the row

"Preferred pharmacy":
  name:
    columns: [pharmacy.name]
    note: the patient_pharmacy row with is_default true, and its pharmacy (D50)
  ncpdpId:
    columns: [pharmacy.ncpdp_id]
  phone:
    columns: [pharmacy.phone]
  city:
    columns: [pharmacy.city]
  state:
    columns: [pharmacy.state]

"Coverage (insurance)":
  memberId:
    columns: [identifier.value, identifier.coverage_id, identifier.type_code]
    note: an identifier row of the coverage with type_code MB
  relationshipToSubscriber:
    columns: [coverage.relationship_code]
  patientId:
    columns: [coverage.beneficiary_patient_id]
  payerId:
    columns: [coverage_payor.payer_id]
    note: the coverage's coverage_payor row, pointing at the payer directory (admin.payer)
  payerName:
    computed: the name of that payer, read with it
    columns: [payer.name]
  groupNumber:
    columns: [coverage_class.value, coverage_class.type]
    note: the coverage_class row with type group
  groupName:
    columns: [coverage_class.name, coverage_class.type]
    note: the name of the same group row; a group needs its number, so a name alone isn't stored
  planName:
    columns: [coverage_class.value, coverage_class.name, coverage_class.type]
    note: >-
      a coverage_class row with type plan; the contract has no plan ID and FHIR requires a
      value, so value and name are both the plan name
  startDate:
    columns: [coverage.period_start]
  endDate:
    columns: [coverage.period_end]
    note: setting it ends the coverage (D45)
  cardImages:
    columns: [coverage_card_image.side, coverage_card_image.binary_object_id,
              coverage_card_image.created_at]
    note: one row per side; fileId is binary_object_id, addedAt is created_at

"Consents":
  signedFormFileId:
    columns: [consent.source_attachment_binary_object_id]
  kind:
    columns: [consent.ext_kind]
  decision:
    columns: [consent.provision_type]
  signatureMethod:
    columns: [consent.ext_signature_method]
  signedAt:
    columns: [consent.date_time]
  policyVersion:
    columns: [consent.ext_policy_version]
    note: the consent requirement's version the patient saw (D59)
  grantorRelatedPersonId:
    columns: [consent.ext_grantor_related_person_id]
    note: a related person of the same patient (same-patient key)

"Duplicates, merges":
  undoneAt:
    columns: [patient_merge.unmerged_at]

"Appointment":
  sameDayAddOn:
    columns: [appointment.ext_same_day_add_on]
  visitStatus:
    computed: >-
      the latest visit_flow_event step of the appointment recorded after its last undone
      check-in (the recorded time of the Provenance that set the check-in encounter to
      entered-in-error, D55); with no step after it, the appointment is booked again and has no
      visit status
    columns: [visit_flow_event.step, visit_flow_event.occurred_at]

"Encounter":
  selfPay:
    path: /appointments/{appointmentId}/check-in
    columns: [encounter.ext_self_pay]
    note: set at check-in on the encounter it creates; no insurance claim for a self-pay visit
  startedAt:
    columns: [encounter.period_start]
  participants[].role:
    columns: [encounter_participant.type_code]

"Note (draft, versions, signed)":
  sections[].text:
    columns: [composition_section.text_div]

"Co-signature rules":
  superviseeProviderId:
    columns: [cosign_rule.supervisee_practitioner_id]

"Facilities, locations":
  timeZone:
    columns: [facility.timezone]
  facilityId:
    columns: [location.part_of_location_id, facility.location_id]
    note: a location's facility is the one whose location_id is this location's parent

"Providers":
  facilityIds:
    columns: [practitioner_role_location.location_id, facility.location_id]
    note: the facilities whose location_id is one of the provider's role locations
