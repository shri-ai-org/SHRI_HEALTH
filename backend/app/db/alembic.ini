[alembic]
# Paths are anchored on this file, so `alembic -c app/db/alembic.ini ...` works from backend/
# (CI, Thulasi's snippet on issue #13) as well as from app/db/.
script_location = %(here)s/alembic
# URL comes from the core setting MIGRATION_DATABASE_URL (shri_migrator); see alembic/env.py
prepend_sys_path = %(here)s/../..

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
