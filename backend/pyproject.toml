[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Dependency ranges below are inputs only. What gets installed is the hashed lock:
# requirements.lock (the API image) and requirements-dev.lock (CI and laptops). See README.md.
[project]
name = "shri-health-api"
version = "0.1.0"
description = "Shri Health API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "httpx>=0.28",
    # Database layer (backend/app/db/, Anand; agreed with Thulasi 2026-10-24):
    "psycopg[binary]>=3.2",   # sync driver for Alembic migrations and the schema tests
    "alembic>=1.14",          # migrations
    "pgvector>=0.3",          # Vector column type (admin.knowledge_chunk embeddings)
    "fhir.resources>=8.0",    # FHIR R4B models used to validate the read-only /fhir output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["app"]
pythonpath = ["."]  # the app is not installed as a package; dependencies come from the lock files
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a PostgreSQL database (set TEST_DATABASE_URL); skipped otherwise",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
