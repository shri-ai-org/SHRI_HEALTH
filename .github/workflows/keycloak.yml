# Keycloak image and staff realm check (D75, issue #55; SECURITY_MODEL §2.1): build
# infra/keycloak/Dockerfile, which verifies the pinned Keycloak and Temurin checksums while it
# builds, then start it in dev mode with the staff realm imported and check the realm's settings.
# Runs only when infra/keycloak/ or this workflow changes, to save Free-plan minutes. Every Action is
# pinned by commit SHA.
name: keycloak

on:
  pull_request:
    paths: ["infra/keycloak/**", ".github/workflows/keycloak.yml"]
  push:
    branches: [main]
    paths: ["infra/keycloak/**", ".github/workflows/keycloak.yml"]

permissions:
  contents: read

concurrency:
  group: keycloak-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build (checksums verified inside)
        run: docker build -t shri-health/keycloak:ci infra/keycloak

      - name: Runs as an unprivileged user
        run: |
          user="$(docker image inspect shri-health/keycloak:ci --format '{{.Config.User}}')"
          test -n "$user" && test "$user" != "0" && test "$user" != "root" \
            || { echo "::error::the image runs as '$user'"; exit 1; }
          docker run --rm shri-health/keycloak:ci --version

      # The staff realm file's security settings (SECURITY_MODEL §2.1, #35, ADR-0006).
      - name: Staff realm file
        run: python3 infra/keycloak/tests/check_realm.py

      # The patient realm file (ADR-0013 §1-§4): no self-registration, the code on every sign-in
      # and after a reset, and a service account limited to managing users.
      - name: Patient realm file
        run: python3 infra/keycloak/tests/check_patient_realm.py

      - name: Starts, imports the staff realm and reports ready
        run: |
          for name in KC_ADMIN_PASSWORD SHRI_WEB_CLIENT_SECRET SHRI_PORTAL_CLIENT_SECRET \
                      SHRI_PORTAL_ADMIN_CLIENT_SECRET; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          docker run -d --name kc -p 127.0.0.1:8080:8080 -p 127.0.0.1:9000:9000 \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KC_ADMIN_PASSWORD" \
            -e KC_HTTP_RELATIVE_PATH=/kc -e KC_HTTP_HOST=0.0.0.0 -e KC_HEALTH_ENABLED=true \
            -e SHRI_WEB_CLIENT_SECRET -e SHRI_PORTAL_CLIENT_SECRET -e SHRI_PORTAL_ADMIN_CLIENT_SECRET \
            shri-health/keycloak:ci start-dev --import-realm
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/kc/realms/shri-staff/.well-known/openid-configuration >/dev/null \
              && curl -sf http://127.0.0.1:8080/kc/realms/shri-patients/.well-known/openid-configuration >/dev/null \
              && curl -sf http://127.0.0.1:9000/kc/health/ready >/dev/null; then
              docker logs kc 2>&1 | grep -E "started in|imported" || true
              exit 0
            fi
            sleep 2
          done
          docker logs kc
          echo "::error::Keycloak did not import the realm and report ready within 3 minutes"
          exit 1

      # Reads the same settings back from Keycloak, so one it drops or renames on import is caught.
      - name: Staff realm as imported
        env:
          KC_URL: http://127.0.0.1:8080/kc
          KC_ADMIN: admin
        run: python3 infra/keycloak/tests/check_realm.py --live
