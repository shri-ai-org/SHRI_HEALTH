# Backend checks: ruff, mypy and pytest on Python 3.13, against the same PostgreSQL 18 + pgvector
# image as local development (infra/compose/postgres; D31). Runs only when the backend, the database
# image, this workflow or the role matrix the permission tests read (SECURITY_MODEL §4.3/§4.4)
# changes, to save Free-plan minutes. Every Action is pinned by commit SHA.
name: backend

on:
  pull_request:
    paths: ["backend/**", "infra/compose/postgres/**", ".github/workflows/backend.yml",
            "contracts/docs/SECURITY_MODEL.md", "contracts/scripts/role_matrix.py", ".github/licences/**"]
  push:
    branches: [main]
    paths: ["backend/**", "infra/compose/postgres/**", ".github/workflows/backend.yml",
            "contracts/docs/SECURITY_MODEL.md", "contracts/scripts/role_matrix.py", ".github/licences/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the database image
        run: docker build -t shri-health/postgres:ci infra/compose/postgres

      - name: Start the database (throwaway passwords, generated per run)
        run: |
          for name in PG SHRI_MIGRATOR SHRI_APP SHRI_FHIR_READER SHRI_INTEGRATION SHRI_REPORTING; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "${name}_PASSWORD=$value" >> "$GITHUB_ENV"
            export "${name}_PASSWORD=$value"
          done
          docker run -d --name db -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=shri_health -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e SHRI_MIGRATOR_PASSWORD -e SHRI_APP_PASSWORD -e SHRI_FHIR_READER_PASSWORD \
            -e SHRI_INTEGRATION_PASSWORD -e SHRI_REPORTING_PASSWORD \
            -v "$PWD/infra/compose/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
            shri-health/postgres:ci
          for _ in $(seq 1 60); do
            if docker exec db pg_isready -U postgres -d shri_health -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs db
          exit 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install (hashed lock only)
        working-directory: backend
        run: pip install --require-hashes --no-deps -r requirements-dev.lock

      # D75: every installed distribution's licence must be on the allowlist (issue #55). The dev
      # lock is a superset of requirements.lock, so this covers the API image too.
      - name: Licences (D75)
        working-directory: backend
        run: python ../.github/licences/check_python.py

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Migrate
        working-directory: backend
        run: |
          # The image allows SCRAM password logins only, even inside the container, so psql needs
          # the superuser password. Passed by name (-e PGPASSWORD), never on the command line.
          export PGPASSWORD="$PG_PASSWORD"
          docker exec -i -e PGPASSWORD db psql -v ON_ERROR_STOP=1 -U postgres -d shri_health < app/db/sql/00_extensions.sql
          export MIGRATION_DATABASE_URL="postgresql+psycopg://shri_migrator:${SHRI_MIGRATOR_PASSWORD}@127.0.0.1:5432/shri_health"
          alembic -c app/db/alembic.ini upgrade head
          alembic -c app/db/alembic.ini check

      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_IMAGE: shri
        run: |
          export TEST_DATABASE_URL="postgresql+asyncpg://postgres:${PG_PASSWORD}@127.0.0.1:5432/shri_health"
          pytest -p no:cacheprovider -rs

      # Q31: the API image carries the release version and the commit it was built from, stamped
      # here and never typed by hand. The check runs inside the container: the stamp is what CI
      # passed in, and the public /health still names no build.
      - name: Build the API image (stamped)
        working-directory: backend
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          BUILD_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          docker build --build-arg BUILD_VERSION="$BUILD_VERSION" --build-arg BUILD_COMMIT="$BUILD_COMMIT" \
            -t shri-health/api:ci .

      - name: Check the stamp and that /health names no build
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          stamp="$(docker run --rm shri-health/api:ci python -c \
            'from app.core.config import Settings; s = Settings(); print(s.build_version, s.build_commit_short)')"
          test "$stamp" = "$BUILD_VERSION ${BUILD_COMMIT:0:12}" || { echo "::error::stamp is '$stamp'"; exit 1; }
          docker run -d --name api -p 127.0.0.1:8000:8000 shri-health/api:ci
          for _ in $(seq 1 30); do
            body="$(curl -sf http://127.0.0.1:8000/health)" && break
            sleep 1
          done
          docker logs api
          test "$body" = '{"status":"ok"}' || { echo "::error::/health returned '$body'"; exit 1; }
