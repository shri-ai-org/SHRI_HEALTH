# Backend checks: ruff, mypy and pytest on Python 3.13, against the same PostgreSQL 18 + pgvector
# image as local development (infra/compose/postgres; D31). Runs only when the backend, the database
# image or this workflow changes, to save Free-plan minutes. Every Action is pinned by commit SHA.
name: backend

on:
  pull_request:
    paths: ["backend/**", "infra/compose/postgres/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "infra/compose/postgres/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the database image
        run: docker build -t shri-health/postgres:ci infra/compose/postgres

      - name: Start the database (throwaway passwords, generated per run)
        run: |
          for name in PG SHRI_MIGRATOR SHRI_APP SHRI_FHIR_READER SHRI_INTEGRATION SHRI_REPORTING; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "${name}_PASSWORD=$value" >> "$GITHUB_ENV"
            export "${name}_PASSWORD=$value"
          done
          docker run -d --name db -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=shri_health -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e SHRI_MIGRATOR_PASSWORD -e SHRI_APP_PASSWORD -e SHRI_FHIR_READER_PASSWORD \
            -e SHRI_INTEGRATION_PASSWORD -e SHRI_REPORTING_PASSWORD \
            -v "$PWD/infra/compose/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
            shri-health/postgres:ci
          for _ in $(seq 1 60); do
            if docker exec db pg_isready -U postgres -d shri_health -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs db
          exit 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_IMAGE: shri
        run: |
          export TEST_DATABASE_URL="postgresql+asyncpg://postgres:${PG_PASSWORD}@127.0.0.1:5432/shri_health"
          pytest -p no:cacheprovider -rs
