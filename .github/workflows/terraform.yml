# OpenTofu checks (D75: OpenTofu, MPL-2.0, replaces Terraform): fmt, validate and the mock-provider
# tests in infra/terraform/tests/. No cloud credentials: nothing here plans against or changes a
# real account. Runs only when infra/terraform/
# or this workflow changes, to save Free-plan minutes. Every Action is pinned by commit SHA, and
# OpenTofu itself by version and SHA-256 (checked against OpenTofu's GPG-signed SHA256SUMS, key
# E3E6E43D84CB852EADB0051D0C0AF313E5FD9F80).
name: terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOFU_VERSION: "1.13.1"
  TOFU_SHA256: "8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -sSfLO "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/${zip}"
          echo "${TOFU_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" tofu
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Format
        run: tofu fmt -check -recursive -diff

      # Providers only from the committed lock file's hashes; no backend, so no state is read.
      - name: Init
        run: tofu init -backend=false -lockfile=readonly

      - name: Validate
        run: tofu validate

      - name: Tests (mock AWS provider)
        run: tofu test
