# Secret scan with gitleaks on every pull request and every push to main. The binary is downloaded
# from the gitleaks release and checked against its published SHA-256, so no third-party Action runs.
#
# What is scanned: every commit reachable from the checked-out HEAD. On a pull request that's the
# merge commit, so the PR's own commits plus main's whole history; on main, main's history. Other
# branches are not scanned, so one branch can never turn every other PR red (#12, after #61 and
# #103). A branch's own commits are still scanned in its PR before they can reach main.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # linux_x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history behind HEAD
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history
        run: |
          # --log-opts replaces gitleaks' default `--all` (every fetched branch) with HEAD only.
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --log-opts="--full-history HEAD" .
