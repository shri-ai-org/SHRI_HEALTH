# Docs link check: every relative link and anchor in the repository's Markdown outside contracts/
# resolves. contracts/ has its own (part of npm test in the contracts workflow). Runs on every pull
# request and every merge to main. The
# checker (contracts/scripts/check-links.mjs) uses Node's standard library only: no npm install.
# Every Action is pinned by commit SHA.
name: docs

on:
  pull_request:
    # Every pull request runs, drafts included (D106's CI-minutes rules withdrawn, 19 Nov 2026).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per pull request. Outside a PR (a merge to main) each commit has its own group, so a
  # newer merge never cancels or drops an earlier run.
  group: docs-${{ github.event.pull_request.number || github.sha }}
  # Cancel superseded PR runs only; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: contracts/.nvmrc  # Node 24 LTS, as the contracts workflow

      - name: Links in the Markdown outside contracts/
        run: node contracts/scripts/check-links.mjs $(git ls-files '*.md' | grep -v '^contracts/')
