# Frontend checks: eslint, TypeScript, vitest, the generated API client and a production build, on
# Node 24, from frontend/package-lock.json. Runs only when the frontend, the bundled contract the
# client is generated from, or this workflow changes, to save Free-plan minutes. Every Action is
# pinned by commit SHA.
name: frontend

on:
  pull_request:
    paths: ["frontend/**", "contracts/openapi/dist/**", ".github/workflows/frontend.yml",
            ".github/licences/**"]
  push:
    branches: [main]
    paths: ["frontend/**", "contracts/openapi/dist/**", ".github/workflows/frontend.yml",
            ".github/licences/**"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the client check compares the PR with its base

      # The frontend is on main (#19), so a missing lock file is an error, never a green skip:
      # without it, npm ci cannot install the reviewed, pinned versions (issue #25).
      - name: Lock file present
        working-directory: .
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            echo "::error file=frontend/package-lock.json::frontend/package-lock.json is missing. Install only pinned, reviewed versions: restore the lock file."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: frontend/.nvmrc  # Node 24 LTS
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Exact versions from the lock file. --ignore-scripts: no install scripts run (also set in
      # frontend/.npmrc), so @scarf/scarf and similar never execute.
      - name: Install pinned packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      # D75: every installed package's licence must be on the allowlist (issue #55). Standard
      # library only; reads the lockfile, and package.json where the lockfile has no licence.
      - name: Licences (D75)
        run: node ../.github/licences/check-npm.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The client in src/api/generated/ is never edited by hand (CLAUDE.md): regenerating it from
      # the committed contract bundle must give exactly the committed files.
      # - A PR that changes frontend/ fails on any difference (a hand edit, or a stale client).
      # - A contract-only PR, and main, only warn: contract PRs can't edit frontend/, so the client
      #   is regenerated in Minalini's follow-up PR after the contract merges (Vimal, #36).
      # Skipped only while there is no orval config and no generated code (before #29); generated
      # code without the config always fails.
      - name: Generated client matches the contract
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f orval.config.ts ]; then
            if [ -n "$(find src/api/generated -name '*.ts' 2>/dev/null)" ]; then
              echo "::error file=frontend/orval.config.ts::src/api/generated/ has code but orval.config.ts is missing, so it cannot be checked."
              exit 1
            fi
            echo "::notice::No generated API client yet (frontend/orval.config.ts); nothing to compare."
            exit 0
          fi
          npm run generate
          changes="$(git status --porcelain --untracked-files=all -- src/api/generated)"
          if [ -z "$changes" ]; then
            exit 0
          fi
          echo "$changes"
          if [ "$EVENT" = "pull_request" ] && [ -n "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- .)" ]; then
            echo "::error::src/api/generated/ differs from what the contract generates. Run 'npm run generate' in frontend/ and commit the result; never edit it by hand."
            exit 1
          fi
          echo "::warning::The contract changed and src/api/generated/ is not regenerated yet. Minalini regenerates it in a follow-up PR ('npm run generate' in frontend/)."

      - name: Build
        run: npm run build
