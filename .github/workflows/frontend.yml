# Frontend checks: eslint, TypeScript and vitest on Node 24, from frontend/package-lock.json.
# Runs only when the frontend or this workflow changes, to save Free-plan minutes. Every Action is
# pinned by commit SHA.
name: frontend

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; every commit on main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The frontend is on main (#19), so a missing lock file is an error, never a green skip:
      # without it, npm ci cannot install the reviewed, pinned versions (issue #25).
      - name: Lock file present
        working-directory: .
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            echo "::error file=frontend/package-lock.json::frontend/package-lock.json is missing. Install only pinned, reviewed versions: restore the lock file."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: frontend/.nvmrc  # Node 24 LTS
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Exact versions from the lock file. --ignore-scripts: no install scripts run (also set in
      # frontend/.npmrc), so @scarf/scarf and similar never execute.
      - name: Install pinned packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test
