title: PartialDate
description: >-
  A date that may be known only to the year or month: `YYYY`, `YYYY-MM` or `YYYY-MM-DD`
  (API_STANDARDS §6.1). Used for history entries such as surgery dates.
type: string
pattern: '^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$'
maxLength: 10
examples:
  - '2011-05'
