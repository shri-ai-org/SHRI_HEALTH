title: OperationKind
description: 'What kind of long-running work an operation tracks (API_STANDARDS §13). An extensible enum: the list grows
  with new batches, so clients must treat a kind they do not know as generic long-running work and show the raw value
  (API_STANDARDS §6.5).'
type: string
maxLength: 64
# x-extensible-enum (API_STANDARDS §6.5, CONTRACT_GOVERNANCE §4.1): adding a kind is not a breaking change; removing one is.
x-extensible-enum:
  - ai.transcription
  - ai.note-draft
  - ai.chart-summary
  - eligibility.check
  - encounter.after-visit-summary
  - export
  - ccda.import
  - ccda.export
  - onboarding.import
  - medication-history.fetch
  - file.scan
