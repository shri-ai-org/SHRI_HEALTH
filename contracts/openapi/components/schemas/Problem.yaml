title: Problem
description: >-
  Problem Details (RFC 9457) with our extension members, returned as `application/problem+json` for every
  4xx and 5xx response (API_STANDARDS §9, ADR-0003). `detail` never contains PHI or submitted values;
  `instance` is the request path only, never the query string.
type: object
required: [type, title, status, code, requestId]
properties:
  type:
    description: >-
      Absolute URI for the problem type: `tag:<COMPANY_DOMAIN>,2026:problem/<code>` (API_STANDARDS §0, §9.1).
      Until the domain is decided, the placeholder `company-domain.invalid` is used.
    type: string
    format: uri
    maxLength: 255
    x-phi: none
  title:
    description: Fixed English text for the `code`.
    type: string
    maxLength: 200
    x-phi: none
  status:
    description: The HTTP status code.
    type: integer
    format: int32
    minimum: 400
    maximum: 599
    x-phi: none
  detail:
    description: Human-readable explanation. Never contains PHI or request values.
    type: string
    maxLength: 1000
    x-phi: none
  instance:
    description: The request path only (may contain opaque IDs), never the query string.
    type: string
    format: uri-reference
    maxLength: 2048
    x-phi: internal-id
  code:
    $ref: './ProblemCode.yaml'
    x-phi: none
  requestId:
    $ref: './Id.yaml'
    description: Same value as the `X-Request-ID` response header.
    x-phi: none
  errors:
    description: Field errors; present for `validation-failed` and `business-rule-violation`.
    type: array
    maxItems: 100
    items:
      $ref: './FieldError.yaml'
    x-phi: none
  currentState:
    description: Current state, for `invalid-state-transition`.
    type: string
    maxLength: 64
    x-phi: none
  candidateIds:
    description: IDs of possibly matching patients, for `possible-duplicate` (IDs only, minimum necessary).
    type: array
    maxItems: 20
    items:
      $ref: './Id.yaml'
    x-phi: internal-id
  mergedIntoId:
    $ref: './Id.yaml'
    description: The surviving patient, for `patient-merged`.
    x-phi: internal-id
  patientId:
    $ref: './Id.yaml'
    description: The restricted patient, for `break-glass-required`.
    x-phi: internal-id
  feature:
    description: The AI feature that is switched off, for `feature-disabled`.
    type: string
    maxLength: 64
    x-phi: none
  consentType:
    description: The missing consent, for `consent-required`.
    type: string
    maxLength: 64
    x-phi: none
  fileId:
    $ref: './Id.yaml'
    description: The file that is not ready, for `file-not-ready`.
    x-phi: internal-id
  maxBytes:
    description: The size limit, for `payload-too-large`.
    type: integer
    format: int64
    minimum: 0
    maximum: 10737418240
    x-phi: none
