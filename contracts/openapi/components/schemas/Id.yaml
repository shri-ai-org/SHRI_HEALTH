title: Id
description: >-
  Opaque resource ID: a lowercase UUID (RFC 9562), generated by the server. Clients must not parse it
  or infer order or time from it (API_STANDARDS §5, ADR-0009).
type: string
format: uuid
pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
maxLength: 36
examples:
  - 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
