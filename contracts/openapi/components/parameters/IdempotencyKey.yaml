name: Idempotency-Key
in: header
description: >-
  Required: a client-generated UUID, one per user action, reused on retry. Sent bare or quoted. Same key
  and body replays the stored response; same key, different body gives `422 idempotency-key-reused`;
  same key still running gives `409 idempotency-request-in-progress`; missing gives
  `400 idempotency-key-missing` (API_STANDARDS §10, ADR-0007).
required: true
schema:
  type: string
  pattern: '^"?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"?$'
  maxLength: 38
