name: Idempotency-Key
in: header
description: Optional on this creating request, so a screen can retry safely after a network error (API_STANDARDS §10).
required: false
schema:
  type: string
  pattern: '^"?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"?$'
  maxLength: 38
