description: >-
  503. The database is unavailable or overloaded, or the service is in maintenance; nothing was written. Retry after `Retry-After` seconds. A partner outage never causes this: partner messages wait in the outbox (ARCHITECTURE_CONTEXT §5, §8). Code: `service-unavailable`.
headers:
  X-Request-ID:
    $ref: '../headers/XRequestId.yaml'
  Cache-Control:
    $ref: '../headers/CacheControl.yaml'
  Retry-After:
    $ref: '../headers/RetryAfter.yaml'
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      service-unavailable:
        $ref: '../examples/ProblemServiceUnavailable.yaml'
