description: >-
  422. A body field or a path, query or header parameter is invalid or cannot be parsed (`validation-failed`; each field error names the body pointer or the parameter), a business rule rejects the request (`business-rule-violation`), the `Idempotency-Key` was reused with a different body (`idempotency-key-reused`), or a referenced file is not ready (`file-not-ready`). API_STANDARDS §9.3.
headers:
  X-Request-ID:
    $ref: '../headers/XRequestId.yaml'
  Cache-Control:
    $ref: '../headers/CacheControl.yaml'
  RateLimit:
    $ref: '../headers/RateLimit.yaml'
  RateLimit-Policy:
    $ref: '../headers/RateLimitPolicy.yaml'
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      validation-failed:
        $ref: '../examples/ProblemValidationFailed.yaml'
      invalid-parameter:
        $ref: '../examples/ProblemInvalidParameter.yaml'
      business-rule-violation:
        $ref: '../examples/ProblemBusinessRuleViolation.yaml'
      file-not-ready:
        $ref: '../examples/ProblemFileNotReady.yaml'
      idempotency-key-reused:
        $ref: '../examples/ProblemIdempotencyKeyReused.yaml'
