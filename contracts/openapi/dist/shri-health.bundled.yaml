openapi: 3.1.2
info:
  title: Shri Health API
  version: 1.0.0-draft.1
  summary: REST API for the Shri Health ambulatory EMR and practice-management system.
  description: |
    Contract for every endpoint the Shri Health screens and partners call. Written before the code and the
    source of truth for it (ADR-0002). Stage 3 contains the shared components only; endpoints arrive in
    Stage 4, module by module.

    Rules every endpoint follows are in `contracts/docs/API_STANDARDS.md`; security rules in
    `contracts/docs/SECURITY_MODEL.md`; the vendor extensions `x-owner`, `x-permission`, `x-audit` and
    `x-phi` in `contracts/docs/EXTENSIONS.md`.

    All examples are synthetic. Never put real patient data in this contract.
servers:
  - url: /api/v1
    description: Versioned API, same relative path in every environment (local, staging, production). Every path uses this server unless its path item overrides `servers`.
    x-internal: false
  - url: /
    description: 'Routes outside `/api/v1`, same in every environment (local, staging, production): `/health` and `/hooks/{partner}`, public through Nginx (API_STANDARDS §2). Only path items that override `servers` with this entry use it. `/ready` is internal and not in the contract.'
    x-internal: false
security:
  - sessionCookie: []
tags:
  - name: platform
    description: Session, current user, users and roles, operations, event stream, audit, break-glass, integration admin, health check.
    x-owner: thulasi
  - name: partner-callbacks
    description: Signature-checked partner callbacks under `/hooks/{partner}`, outside `/api/v1`. Excluded from the generated browser client.
    x-owner: thulasi
  - name: files
    description: Upload and download links through the file service.
    x-owner: anand
  - name: practice-setup
    description: Facilities, locations, providers, appointment types, schedules, fee schedules, payers, lab accounts, note templates.
    x-owner: anand
  - name: onboarding
    description: Bulk import for a new clinic.
    x-owner: anand
  - name: patients
    description: Patients, identifiers, related persons, coverage, consents, duplicates and merges.
    x-owner: vimal
  - name: scheduling
    description: Slots, appointments, check-in, visit status, status board.
    x-owner: vimal
  - name: eligibility
    description: Insurance eligibility checks (X12 270/271 through the clearinghouse).
    x-owner: vimal
  - name: encounters
    description: Encounters, vitals, diagnoses, notes, favorites, after-visit summary, co-signature rules.
    x-owner: vimal
  - name: history
    description: Problem list, allergies, family, social and surgical history.
    x-owner: vimal
  - name: ai
    description: Encounter audio, transcriptions, AI note drafts, chart summaries, AI decisions and settings.
    x-owner: vimal
  - name: medications
    description: Medication list, prescriptions, safety checks, refill and change requests, pharmacies.
    x-owner: thulasi
  - name: orders
    description: Lab compendium, orders, results, unmatched results.
    x-owner: thulasi
  - name: billing
    description: Superbills, claims, payments, remittances, billing reports.
    x-owner: anand
  - name: documents
    description: Documents, outbound faxes, fax inbox.
    x-owner: anand
  - name: ccda
    description: C-CDA import and export.
    x-owner: anand
  - name: inbox
    description: Inbox items and staff messages.
    x-owner: anand
  - name: exports
    description: Permission-controlled exports.
    x-owner: anand
  - name: communications
    description: Message templates, communication preferences and history.
    x-owner: minalini
  - name: dashboards
    description: Operations dashboard.
    x-owner: minalini
paths:
  /patients/search:
    post:
      operationId: searchPatients
      summary: Search patients
      description: 'Finds patients by name, date of birth, phone or identifier (inventory #28). Criteria go in the body, never in the URL (D13, ADR-0005). Phone is an exact match on the full number. Restricted patients appear with summary fields only and `restricted: true`. At most 50 per page.'
      tags:
        - patients
      x-owner: vimal
      x-permission: patients:search
      x-audit:
        action: R
        category: phi-read
        patient: result
      x-storage: clinical
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSearchRequest'
            examples:
              name-and-birth-date:
                summary: Family name and date of birth
                value:
                  criteria:
                    family: Kuhlman72
                    birthDate: '1984-07-19'
                  limit: 25
              phone:
                summary: Exact phone number
                value:
                  criteria:
                    phone: '+16175550123'
      responses:
        '200':
          description: One page of matching patients.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummaryList'
              examples:
                one-match:
                  summary: One match
                  value:
                    items:
                      - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                        name:
                          given:
                            - Ramona980
                          family: Kuhlman72
                        birthDate: '1984-07-19'
                        gender: female
                        mrn: TEST-000123
                        phoneLast4: '0123'
                        restricted: false
                        active: true
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 400. `malformed-request` (the body is not parseable JSON); `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `patients:search`); `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: '422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (fewer criteria than the minimum: one exact identifier or at least two criteria).'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /patients:
    post:
      operationId: registerPatient
      summary: Register a patient
      description: 'Registers a patient (inventory #29). The server assigns the MRN (D41). A duplicate check runs first: similar name with the same date of birth or phone gives `409 possible-duplicate` with candidate IDs only; resend with `duplicateCheck: override` and a reason to proceed. Patient, names, contact points and identifiers commit in one transaction with the audit event (ADR-0011).'
      tags:
        - patients
      x-owner: vimal
      x-permission: patients:create
      x-audit:
        action: C
        category: phi-write
        patient: result
      x-idempotency: supported
      x-storage: clinical
      x-events:
        - patient.created
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
            examples:
              from-license-scan:
                summary: Registration after a driver's license scan
                value:
                  name:
                    given:
                      - Ramona980
                    family: Kuhlman72
                  birthDate: '1984-07-19'
                  gender: female
                  birthSex: F
                  preferredLanguage: en
                  phones:
                    - number: '+16175550123'
                      use: mobile
                      textMessages: true
                  emails:
                    - address: ramona980.kuhlman72@example.com
                      use: home
                  address:
                    lines:
                      - 100 Test Lane
                    city: Springfield
                    state: IL
                    postalCode: '62701'
                    country: US
                  identifiers:
                    - type: DL
                      system: urn:oid:2.16.840.1.113883.4.3.17
                      value: TEST-DL-4471
                      assigner: IL
      responses:
        '201':
          description: Created. The new patient.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                registered:
                  summary: Registered patient
                  value:
                    id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    mrn: TEST-000123
                    name:
                      given:
                        - Ramona980
                      family: Kuhlman72
                    birthDate: '1984-07-19'
                    gender: female
                    birthSex: F
                    race:
                      ombCategories:
                        - 2106-3
                    ethnicity:
                      ombCategories:
                        - 2186-5
                    preferredLanguage: en
                    phones:
                      - number: '+16175550123'
                        use: mobile
                        textMessages: true
                    emails:
                      - address: ramona980.kuhlman72@example.com
                        use: home
                    address:
                      lines:
                        - 100 Test Lane
                      city: Springfield
                      state: IL
                      postalCode: '62701'
                      country: US
                    identifiers:
                      - id: 8f9a0b1c-2d3e-4f4a-8b5c-6d7e8f9a0b1c
                        type: MR
                        value: TEST-000123
                        use: official
                        createdAt: '2026-11-03T14:30:00Z'
                    restricted: false
                    active: true
                    createdAt: '2026-11-03T14:30:00Z'
                    updatedAt: '2026-11-03T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `patients:create`); `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '409':
          $ref: '#/components/responses/Conflict'
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `possible-duplicate` (matching patients exist).
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (for example a birth date in the future, an MRN sent as an identifier, or `override` without a reason); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /patients/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        description: Patient ID.
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getPatient
      summary: Get a patient
      description: 'Returns demographics and identifiers (inventory #30). A restricted chart gives `403 break-glass-required` unless the user holds a break-glass grant or is on the patient''s care team (D37). A merged record is returned with `active: false` and `mergedIntoId`.'
      tags:
        - patients
      x-owner: vimal
      x-permission: patients:read
      x-audit:
        action: R
        category: phi-read
        patient: patientId
      x-storage: clinical
      x-release: P0
      responses:
        '200':
          description: The patient.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                patient:
                  summary: A patient
                  value:
                    id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    mrn: TEST-000123
                    name:
                      given:
                        - Ramona980
                      family: Kuhlman72
                    birthDate: '1984-07-19'
                    gender: female
                    birthSex: F
                    race:
