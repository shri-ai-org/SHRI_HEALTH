        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (`card` without `cardSessionId`, `cardSessionId` with another method, the card session belongs to another patient, its captured amount or currency differs from `amount`, or the appointment belongs to another patient (field code `invalid-reference`)); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
