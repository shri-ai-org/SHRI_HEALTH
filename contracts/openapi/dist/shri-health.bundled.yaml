      required:
        - status
      properties:
        status:
          type: string
          enum:
            - arrived
            - roomed
            - with-provider
            - checked-out
            - noshow
          description: The step. `roomed` and `with-provider` change the encounter; the others change the appointment (DATA_OWNERSHIP §5.1).
          x-phi: none
        roomLocationId:
          $ref: '#/components/schemas/Id'
          description: The exam room. Required with `roomed`.
          x-phi: internal-id
    StatusBoardItem:
      description: One appointment on today's board. Shared hallway displays show `initials` and the time only (SECURITY_MODEL §8 rule 11).
      type: object
      required:
        - appointmentId
        - patient
        - initials
        - provider
        - startAt
        - status
      properties:
        appointmentId:
          $ref: '#/components/schemas/Id'
          description: Appointment.
          x-phi: internal-id
        patient:
          $ref: '#/components/schemas/SchedulingPatientRef'
          description: Patient, for staff screens.
          x-phi: identifier
        initials:
          type: string
          maxLength: 4
          description: Patient initials, for shared displays.
          x-phi: identifier
        provider:
          $ref: '#/components/schemas/SchedulingProviderRef'
          description: Provider.
          x-phi: none
        startAt:
          $ref: '#/components/schemas/Timestamp'
          description: Scheduled start (UTC).
          x-phi: identifier
        status:
          $ref: '#/components/schemas/AppointmentStatus'
          description: Appointment status.
          x-phi: none
        visitStatus:
          $ref: '#/components/schemas/VisitStatus'
          description: Latest visit step.
          x-phi: none
        visitStatusAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the latest step happened (for waiting times).
          x-phi: none
        roomName:
          type: string
          maxLength: 200
          description: Current room, once roomed.
          x-phi: none
    StatusBoardList:
      description: One page of the status board, by start time.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StatusBoardItem'
          description: The items on this page.
          x-phi: identifier
        nextCursor:
          $ref: '#/components/schemas/Cursor'
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
        date:
          $ref: '#/components/schemas/Date'
          description: The day shown, in the facility's time zone.
          x-phi: none
        timeZone:
          type: string
          maxLength: 64
          description: The facility's IANA time zone (D40).
          x-phi: none
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor` (API_STANDARDS §8.1).
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Required: a client-generated UUID, one per user action, reused on retry. Sent bare or quoted. Same key and body replays the stored response; same key, different body gives `422 idempotency-key-reused`; same key still running gives `409 idempotency-request-in-progress`; missing gives `400 idempotency-key-missing` (API_STANDARDS §10, ADR-0007).'
      required: true
      schema:
        type: string
        pattern: ^"?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"?$
        maxLength: 38
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      description: Optional on this creating request, so a screen can retry safely after a network error (API_STANDARDS §10).
      required: false
      schema:
        type: string
        pattern: ^"?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"?$
        maxLength: 38
    IfMatch:
      name: If-Match
      in: header
      description: The `ETag` of the version being edited. Required on every PATCH and PUT and on the listed actions. Missing gives `428 precondition-required`; a mismatch gives `412 precondition-failed` (API_STANDARDS §11, ADR-0008).
      required: true
      schema:
        type: string
        maxLength: 128
    Limit:
      name: limit
      in: query
      description: Page size. Default 25, maximum 100 (API_STANDARDS §8.1).
      required: false
      schema:
        $ref: '#/components/schemas/Limit'
    Traceparent:
      name: traceparent
      in: header
      description: Optional W3C Trace Context, propagated (API_STANDARDS §18).
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        maxLength: 55
    XRequestId:
      name: X-Request-ID
      in: header
      description: Optional client request ID. Accepted only if it is a valid UUID; otherwise the server generates one (API_STANDARDS §18).
      required: false
      schema:
        $ref: '#/components/schemas/Id'
  headers:
    CacheControl:
      description: Every `/api/v1` response is `no-store`, so PHI never sits in browser or proxy caches (API_STANDARDS §7.2).
      schema:
        type: string
        const: no-store
    Deprecation:
      description: When this endpoint was or will be deprecated (RFC 9745), as a structured date, e.g. `@1798761600` (API_STANDARDS §2, ADR-0010).
      schema:
        type: string
        pattern: ^@-?\d{1,15}$
        maxLength: 17
    ETag:
      description: Strong, opaque version tag of the returned resource. Send it back in `If-Match` to edit (API_STANDARDS §11, ADR-0008).
      schema:
        type: string
        pattern: ^"[^"]{1,126}"$
        maxLength: 128
    IdempotentReplayed:
      description: Present and `true` when this response is a replay of a stored response for the same `Idempotency-Key` (API_STANDARDS §10, ADR-0007).
      schema:
        type: string
        enum:
          - 'true'
    Link:
      description: Link to the change note for a deprecated endpoint, `rel="deprecation"` (API_STANDARDS §2).
      schema:
        type: string
        maxLength: 1024
    Location:
      description: URL of the created resource (`201`) or of the operation tracking the work (`202`).
      schema:
        type: string
        format: uri-reference
        maxLength: 2048
    RateLimit:
      description: Remaining quota, per IETF draft-ietf-httpapi-ratelimit-headers-11 (a draft, not an RFC), e.g. `"default";r=50;t=30` (API_STANDARDS §17).
      schema:
        type: string
        maxLength: 256
    RateLimitPolicy:
      description: Quota policies, per IETF draft-ietf-httpapi-ratelimit-headers-11, e.g. `"default";q=100;w=60` (API_STANDARDS §17).
      schema:
        type: string
        maxLength: 256
    RetryAfter:
      description: Seconds to wait before retrying or polling again (RFC 9110). Sent with `202`, `429` and `503`.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400
    Sunset:
      description: When this endpoint will stop responding (RFC 8594), as an HTTP date. Never earlier than `Deprecation` (API_STANDARDS §2).
      schema:
        type: string
        maxLength: 64
    Traceparent:
      description: W3C Trace Context for OpenTelemetry; propagated (API_STANDARDS §18).
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        maxLength: 55
    XRequestId:
      description: Request ID, always returned and repeated in Problem `requestId`. A client-sent value is accepted only if it is a valid UUID; otherwise the server generates one (API_STANDARDS §18; Thulasi T20).
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    Accepted:
      description: 202. The work was accepted and runs in the background. `Location` points to the operation; poll it after `Retry-After` seconds, or listen for `operation.completed` on the event stream (API_STANDARDS §13).
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
          examples:
            queued:
              $ref: '#/components/examples/OperationQueued'
    BadRequest:
      description: '400. The request body is not parseable JSON (`malformed-request`), the cursor is expired or tampered with (`invalid-cursor`), or a required `Idempotency-Key` is missing (`idempotency-key-missing`). An invalid or unparseable parameter is not a 400: it is `422 validation-failed` naming the parameter (API_STANDARDS §9.3).'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformed-request:
              $ref: '#/components/examples/ProblemMalformedRequest'
            invalid-cursor:
              $ref: '#/components/examples/ProblemInvalidCursor'
            idempotency-key-missing:
              $ref: '#/components/examples/ProblemIdempotencyKeyMissing'
    Conflict:
      description: '409. Conflicts with the current state. Codes: `invalid-state-transition`, `record-locked`, `booking-conflict`, `possible-duplicate`, `patient-merged`, `idempotency-request-in-progress`, `feature-disabled`, `consent-required`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid-state-transition:
              $ref: '#/components/examples/ProblemInvalidStateTransition'
            record-locked:
              $ref: '#/components/examples/ProblemRecordLocked'
            conflict-possible-duplicate:
              $ref: '#/components/examples/ProblemConflictPossibleDuplicate'
            booking-conflict:
              $ref: '#/components/examples/ProblemBookingConflict'
            patient-merged:
              $ref: '#/components/examples/ProblemPatientMerged'
            idempotency-request-in-progress:
              $ref: '#/components/examples/ProblemIdempotencyRequestInProgress'
    Forbidden:
      description: '403. The role lacks the endpoint''s permission (checked before any lookup), the CSRF or Origin check failed, or the chart is restricted. Codes: `permission-denied`, `csrf-check-failed`, `break-glass-required`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            permission-denied:
              $ref: '#/components/examples/ProblemPermissionDenied'
            break-glass-required:
              $ref: '#/components/examples/ProblemBreakGlassRequired'
    InternalError:
      description: '500. Unexpected error. Details are only in server logs, without PHI. Code: `internal-error`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal-error:
              $ref: '#/components/examples/ProblemInternalError'
    NotFound:
      description: '404. Does not exist, or belongs to another clinic or a facility the user is not assigned to; these cases are indistinguishable (API_STANDARDS §12). Code: `not-found`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              $ref: '#/components/examples/ProblemNotFound'
    PreconditionFailed:
      description: '412. `If-Match` does not match the current version; the `ETag` header carries the current version so the client can re-read. Code: `precondition-failed`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            precondition-failed:
              $ref: '#/components/examples/ProblemPreconditionFailed'
    PreconditionRequired:
      description: '428. `If-Match` is required on this request. Code: `precondition-required`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            precondition-required:
              $ref: '#/components/examples/ProblemPreconditionRequired'
    ServiceUnavailable:
      description: '503. The database is unavailable or overloaded, or the service is in maintenance; nothing was written. Retry after `Retry-After` seconds. A partner outage never causes this: partner messages wait in the outbox (ARCHITECTURE_CONTEXT §5, §8). Code: `service-unavailable`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            service-unavailable:
              $ref: '#/components/examples/ProblemServiceUnavailable'
    TooManyRequests:
      description: '429. Rate limit reached; wait for `Retry-After` seconds. Code: `rate-limited`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate-limited:
              $ref: '#/components/examples/ProblemRateLimited'
    Unauthorized:
      description: '401. Not signed in, or the session ended. Codes: `unauthenticated`, `session-expired`.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              $ref: '#/components/examples/ProblemUnauthenticated'
    UnprocessableContent:
      description: 422. A body field or a path, query or header parameter is invalid or cannot be parsed (`validation-failed`; each field error names the body pointer or the parameter), a business rule rejects the request (`business-rule-violation`), the `Idempotency-Key` was reused with a different body (`idempotency-key-reused`), or a referenced file is not ready (`file-not-ready`). API_STANDARDS §9.3.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation-failed:
              $ref: '#/components/examples/ProblemValidationFailed'
            invalid-parameter:
              $ref: '#/components/examples/ProblemInvalidParameter'
            business-rule-violation:
              $ref: '#/components/examples/ProblemBusinessRuleViolation'
            file-not-ready:
              $ref: '#/components/examples/ProblemFileNotReady'
            idempotency-key-reused:
              $ref: '#/components/examples/ProblemIdempotencyKeyReused'
  securitySchemes:
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from `GET /auth/session`, required on every unsafe method together with an allowed `Origin` header. Rotates at login; compared in constant time. Failure gives `403 csrf-check-failed` (SECURITY_MODEL §2.2, ADR-0006).
    delegatedToken:
      type: http
      scheme: bearer
      description: 'AI gateway only. A per-task delegated token minted by the API when the user starts the AI task: at most 5 minutes, bound to user, clinic, patient and task, read permissions only, every use audited as `ai` (SECURITY_MODEL §2.4).'
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-shri_session
      description: Session cookie holding a 256-bit reference token; the server stores only its SHA-256 hash. HttpOnly, Secure, SameSite=Strict, Path=/. Set by `/auth/callback`; new session ID at every login (SECURITY_MODEL §2.1, ADR-0006).
  examples:
    OperationQueued:
      summary: Operation just accepted
      value:
        id: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
        kind: ai.note-draft
        status: queued
        createdAt: '2026-11-03T14:31:00Z'
        updatedAt: '2026-11-03T14:31:00Z'
    OperationSucceeded:
      summary: Operation finished, pointing to its result
      value:
        id: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
        kind: ai.note-draft
        status: succeeded
        createdAt: '2026-11-03T14:31:00Z'
        updatedAt: '2026-11-03T14:31:42Z'
        completedAt: '2026-11-03T14:31:42Z'
        result:
          type: note
          id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
    ProblemBookingConflict:
      summary: booking-conflict
      value:
        type: tag:company-domain.invalid,2026:problem/booking-conflict
        title: Booking conflict
        status: 409
        detail: The slot is taken or overlaps another appointment for this provider.
        instance: /api/v1/appointments
        code: booking-conflict
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
    ProblemBusinessRuleViolation:
      summary: business-rule-violation
      value:
        type: tag:company-domain.invalid,2026:problem/business-rule-violation
        title: Business rule violation
        status: 422
        detail: 1 field breaks a rule.
        instance: /api/v1/patients
        code: business-rule-violation
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
        errors:
          - in: body
            pointer: /birthDate
            code: out-of-range
    ProblemFileNotReady:
      summary: file-not-ready
      value:
        type: tag:company-domain.invalid,2026:problem/file-not-ready
        title: File not ready
        status: 422
        detail: The file is not scanned clean, has the wrong purpose, or belongs to another clinic.
        instance: /api/v1/patients/7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d/coverages/4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a/card-images
        code: file-not-ready
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
        fileId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
    ProblemIdempotencyKeyMissing:
      summary: idempotency-key-missing
      value:
        type: tag:company-domain.invalid,2026:problem/idempotency-key-missing
        title: Idempotency key missing
        status: 400
        detail: This request needs an Idempotency-Key header.
        instance: /api/v1/eligibility-checks
        code: idempotency-key-missing
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
    ProblemIdempotencyKeyReused:
      summary: idempotency-key-reused
      value:
        type: tag:company-domain.invalid,2026:problem/idempotency-key-reused
        title: Idempotency key reused
        status: 422
        detail: This Idempotency-Key was already used with a different request body.
        instance: /api/v1/eligibility-checks
        code: idempotency-key-reused
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
    ProblemIdempotencyRequestInProgress:
      summary: idempotency-request-in-progress
      value:
        type: tag:company-domain.invalid,2026:problem/idempotency-request-in-progress
        title: Request in progress
        status: 409
        detail: A request with this Idempotency-Key is still being processed.
        instance: /api/v1/eligibility-checks
        code: idempotency-request-in-progress
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
    ProblemInvalidCursor:
      summary: invalid-cursor
      value:
        type: tag:company-domain.invalid,2026:problem/invalid-cursor
        title: Invalid cursor
        status: 400
        detail: The cursor has expired or is not valid for this list. Start again from the first page.
        instance: /api/v1/patients/search
        code: invalid-cursor
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
    ProblemPatientMerged:
      summary: patient-merged
      value:
        type: tag:company-domain.invalid,2026:problem/patient-merged
        title: Patient merged
        status: 409
        detail: This patient record was merged into another record. Use the surviving record.
        instance: /api/v1/patients/7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        code: patient-merged
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
        mergedIntoId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
    ProblemBreakGlassRequired:
      summary: break-glass-required
      value:
        type: tag:company-domain.invalid,2026:problem/break-glass-required
        title: Restricted chart
        status: 403
        detail: This chart is restricted. State a reason to open it.
        instance: /api/v1/patients/7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        code: break-glass-required
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
        patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    ProblemConflictPossibleDuplicate:
      summary: possible-duplicate
      value:
        type: tag:company-domain.invalid,2026:problem/possible-duplicate
        title: Possible duplicate patient
        status: 409
        detail: Matching patients exist. Review them, or resend with an override reason.
        instance: /api/v1/patients
        code: possible-duplicate
        requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
        candidateIds:
          - 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    ProblemInternalError:
      summary: internal-error
      value:
        type: tag:company-domain.invalid,2026:problem/internal-error
        title: Internal error
        status: 500
        detail: Something went wrong. Quote the request ID if you report it.
