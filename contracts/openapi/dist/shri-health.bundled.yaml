    post:
      operationId: checkInAppointment
      summary: Check in
      description: 'Checks the patient in (inventory #56; DATA_OWNERSHIP §5.1). In **one database transaction** (ADR-0011, D16): the appointment becomes `checked-in`, the encounter is created through the encounter service with status `arrived`, the visit step is recorded, and a real-time eligibility check is queued for the primary coverage (D15). The status board updates within a second (`appointment.checked-in`). Same day only. Reaches the clearinghouse, so `Idempotency-Key` is required; a repeat with the same key replays the first result.'
