    parameters:
      - name: appointmentId
        in: path
        required: true
        description: Appointment ID.
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: rescheduleAppointment
      summary: Reschedule an appointment
      description: 'Moves a `booked` or `arrived` appointment (new inventory row #243; D61). In one transaction: the old appointment becomes `cancelled` with the given reason, a new one is booked under the same rules as `POST /appointments` (provider-day lock, overbooking only where the type allows it), and the new one carries `rescheduledFromId`, set by the server. A new date re-queues the eligibility check (D15). Returns the new appointment; the old one keeps its history.'
      tags:
        - scheduling
      x-owner: vimal
      x-permission: appointments:reschedule
      x-audit:
        action: E
        category: phi-write
        patient: result
