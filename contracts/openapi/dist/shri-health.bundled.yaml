          pattern: ^[A-Z]{2}$
          maxLength: 2
          x-phi: none
        postalCode:
          description: ZIP (`12345`) or ZIP+4 (`12345-6789`).
          type: string
          pattern: ^\d{5}(-\d{4})?$
