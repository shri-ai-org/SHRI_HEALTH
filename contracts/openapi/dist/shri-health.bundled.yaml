  securitySchemes:
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from `GET /auth/session`, required on every unsafe method together with an allowed `Origin` header. Rotates at login; compared in constant time. Failure gives `403 csrf-check-failed` (SECURITY_MODEL §2.2, ADR-0006).
    delegatedToken:
      type: http
      scheme: bearer
      description: 'AI gateway only. A per-task delegated token minted by the API when the user starts the AI task: at most 5 minutes, bound to user, clinic, patient and task, read permissions only, every use audited as `ai` (SECURITY_MODEL §2.4).'
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-shri_session
      description: Session cookie holding a 256-bit reference token; the server stores only its SHA-256 hash. HttpOnly, Secure, SameSite=Strict, Path=/. Set by `/auth/callback`; new session ID at every login (SECURITY_MODEL §2.1, ADR-0006).
