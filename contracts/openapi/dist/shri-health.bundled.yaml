  /eligibility-checks:
    post:
      operationId: runEligibilityCheck
      summary: Run an eligibility check
      description: 'Runs a check now (inventory #59; trigger `manual`). Saves a `pending` check and queues the 270 for the clearinghouse in the same transaction (`enqueue(db, "clearinghouse", "270", …)`); the 271 arrives through the webhook receiver. Returns `202` and an operation of kind `eligibility.check`, whose result is the check. Reaches a partner, so `Idempotency-Key` is required. Booking, the pre-visit batch and check-in start checks themselves (D15). The coverage and the appointment must be in this clinic and the user''s facilities; a restricted patient needs break-glass or care-team membership.'
      tags:
        - eligibility
      x-owner: vimal
      x-permission: eligibility-checks:create
      x-audit:
        action: C
        category: phi-write
        patient: result
      x-idempotency: required
      x-async: true
      x-storage: admin
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityCheckCreate'
            examples:
              now:
                summary: Check the primary coverage now
                value:
                  coverageId: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
                  appointmentId: 1e2f3a4b-5c6d-4e7f-9a8b-9c0d1e2f3a4b
      responses:
        '202':
          description: 202. Accepted; runs in the background. Poll `Location` after `Retry-After` seconds, or wait for `operation.completed` on the event stream (API_STANDARDS §13).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              examples:
                queued:
                  summary: Check queued
                  value:
                    id: 5f6a7b8c-9d0e-4f1a-8b2c-3d4e5f6a7b8c
                    kind: eligibility.check
                    status: queued
                    createdAt: '2026-11-03T14:52:00Z'
                    updatedAt: '2026-11-03T14:52:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 400. `malformed-request` (the body is not parseable JSON); `idempotency-key-missing` (the required Idempotency-Key header is missing).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `eligibility-checks:create`); `csrf-check-failed` (missing or wrong CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: '#/components/responses/NotFound'
          description: 404. `not-found` (the coverage or appointment is not in this clinic or the user's facilities).
        '409':
          $ref: '#/components/responses/Conflict'
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `patient-merged` (the patient was merged into another record).
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (the coverage is not active, or the appointment belongs to another patient (field code `invalid-reference`)); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
