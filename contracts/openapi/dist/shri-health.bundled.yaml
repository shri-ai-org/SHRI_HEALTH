              maxLength: 64
              x-phi: none
            id:
              $ref: '#/components/schemas/Id'
              x-phi: internal-id
          x-phi: internal-id
        error:
          $ref: '#/components/schemas/Problem'
          description: Why the operation failed, once `failed`.
          x-phi: none
    OperationKind:
      title: OperationKind
      description: What kind of long-running work an operation tracks (API_STANDARDS §13).
      type: string
      enum:
        - ai.transcription
        - ai.note-draft
        - ai.chart-summary
        - eligibility.check
        - encounter.after-visit-summary
        - export
        - ccda.import
        - ccda.export
        - onboarding.import
        - medication-history.fetch
        - file.scan
    OperationStatus:
      title: OperationStatus
      description: Progress of an operation; `succeeded`, `failed` and `cancelled` are final (API_STANDARDS §13).
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
    PartialDate:
      title: PartialDate
      description: 'A date that may be known only to the year or month: `YYYY`, `YYYY-MM` or `YYYY-MM-DD` (API_STANDARDS §6.1). Used for history entries such as surgery dates.'
      type: string
      pattern: ^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$
      maxLength: 10
      examples:
        - 2011-05
