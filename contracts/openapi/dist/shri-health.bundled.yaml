          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
    patch:
      operationId: updatePatient
      summary: Update a patient
      description: 'Edits demographics with JSON Merge Patch (inventory #31). Needs the current `ETag` in `If-Match`. A merged patient gives `409 patient-merged`.'
      tags:
        - patients
      x-owner: vimal
      x-permission: patients:update
      x-audit:
        action: U
        category: phi-write
        patient: patientId
      x-concurrency: if-match-required
      x-storage: clinical
      x-events:
        - patient.updated
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatientPatch'
            examples:
              new-phone:
                summary: Replace the phone numbers
                value:
                  phones:
                    - number: '+16175550188'
                      use: mobile
      responses:
        '200':
          description: The patient.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
