  /patients/{patientId}/payments:
    parameters:
      - name: patientId
        in: path
        required: true
        description: Patient ID.
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: recordPayment
      summary: Record a patient payment
      description: 'Records a copay or other patient payment and generates the receipt (inventory #198; D58). Cash, check and ACH are recorded directly; a card payment needs a completed card session (`POST /payments/card-session`), so card numbers never touch our servers. Moves money, so `Idempotency-Key` is required. Collected at check-in, so it works for a restricted patient like check-in does (SECURITY_MODEL §5.2). A card payment is recorded only when the card session is this patient''s and was captured for the same amount; a mismatch is `422 business-rule-violation`.'
      tags:
        - billing
      x-owner: anand
      x-permission: payments:create
      x-audit:
        action: C
        category: phi-write
        patient: patientId
      x-idempotency: required
      x-storage: admin
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            examples:
              copay-card:
                summary: Copay by card at check-in
                value:
                  amount:
                    value: '25.00'
                    currency: USD
                  method: card
                  appointmentId: 1e2f3a4b-5c6d-4e7f-9a8b-9c0d1e2f3a4b
                  cardSessionId: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f
              copay-cash:
                summary: Copay in cash
                value:
                  amount:
                    value: '25.00'
                    currency: USD
                  method: cash
                  appointmentId: 1e2f3a4b-5c6d-4e7f-9a8b-9c0d1e2f3a4b
      responses:
        '201':
          description: Created. The new payment.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                recorded:
                  summary: Recorded, with the receipt
                  value:
                    id: 3b4c5d6e-7f8a-4b9c-8d0e-1f2a3b4c5d6e
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    appointmentId: 1e2f3a4b-5c6d-4e7f-9a8b-9c0d1e2f3a4b
                    encounterId: 2f3a4b5c-6d7e-4f8a-8b9c-0d1e2f3a4b5c
                    amount:
                      value: '25.00'
                      currency: USD
                    method: card
                    processorReference: TEST-TXN-000455
                    receiptFileId: 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f
                    collectedAt: '2026-11-03T14:53:00Z'
                    collectedByUserId: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f
                    refund: false
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 400. `malformed-request` (the body is not parseable JSON); `idempotency-key-missing` (the required Idempotency-Key header is missing).
        '401':
          $ref: '#/components/responses/Unauthorized'
