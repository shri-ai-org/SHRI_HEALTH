                        - 2186-5
                    preferredLanguage: en
                    phones:
                      - number: '+16175550123'
                        use: mobile
                        textMessages: true
                    emails:
                      - address: ramona980.kuhlman72@example.com
                        use: home
                    address:
                      lines:
                        - 100 Test Lane
                      city: Springfield
                      state: IL
                      postalCode: '62701'
                      country: US
                    identifiers:
                      - id: 8f9a0b1c-2d3e-4f4a-8b5c-6d7e8f9a0b1c
                        type: MR
                        value: TEST-000123
                        use: official
                        createdAt: '2026-11-03T14:30:00Z'
                    restricted: false
                    active: true
                    createdAt: '2026-11-03T14:30:00Z'
                    updatedAt: '2026-11-03T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `patients:update`); `csrf-check-failed` (missing or wrong CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: '#/components/responses/NotFound'
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '409':
          $ref: '#/components/responses/Conflict'
          description: 409. `patient-merged` (the patient was merged into another record).
        '412':
