          description: Official name.
          x-phi: identifier
        birthDate:
          $ref: '#/components/schemas/Date'
          description: Date of birth.
          x-phi: identifier
        gender:
          $ref: '#/components/schemas/AdministrativeGender'
          description: Administrative gender.
          x-phi: clinical
        mrn:
          type: string
          maxLength: 40
          description: Medical record number.
          x-phi: identifier
        phoneLast4:
          type: string
          pattern: ^\d{4}$
