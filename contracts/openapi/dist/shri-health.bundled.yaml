          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `patients:read`); `break-glass-required` (the patient's chart is restricted and the user holds no break-glass grant and is not on the care team (D37)).
