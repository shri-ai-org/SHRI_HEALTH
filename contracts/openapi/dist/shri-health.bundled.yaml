openapi: 3.1.2
info:
  title: Shri Health API
  version: 1.0.0-draft.1
  summary: REST API for the Shri Health ambulatory EMR and practice-management system.
  description: |
    Contract for every endpoint the Shri Health screens and partners call. Written before the code and the
    source of truth for it (ADR-0002). Stage 3 contains the shared components only; endpoints arrive in
    Stage 4, module by module.

    Rules every endpoint follows are in `contracts/docs/API_STANDARDS.md`; security rules in
    `contracts/docs/SECURITY_MODEL.md`; the vendor extensions `x-owner`, `x-permission`, `x-audit` and
    `x-phi` in `contracts/docs/EXTENSIONS.md`.

    All examples are synthetic. Never put real patient data in this contract.
servers:
  - url: /api/v1
    description: Versioned API, same relative path in every environment (local, staging, production). Every path uses this server unless its path item overrides `servers`.
    x-internal: false
  - url: /
    description: 'Routes outside `/api/v1`, same in every environment (local, staging, production): `/health` and `/hooks/{partner}`, public through Nginx (API_STANDARDS §2). Only path items that override `servers` with this entry use it. `/ready` is internal and not in the contract.'
    x-internal: false
security:
  - sessionCookie: []
tags:
  - name: platform
    description: Session, current user, users and roles, operations, event stream, audit, break-glass, integration admin, health check.
    x-owner: thulasi
  - name: partner-callbacks
    description: Signature-checked partner callbacks under `/hooks/{partner}`, outside `/api/v1`. Excluded from the generated browser client.
    x-owner: thulasi
  - name: files
    description: Upload and download links through the file service.
    x-owner: anand
  - name: practice-setup
    description: Facilities, locations, providers, appointment types, schedules, fee schedules, payers, lab accounts, note templates.
    x-owner: anand
  - name: onboarding
    description: Bulk import for a new clinic.
    x-owner: anand
  - name: patients
    description: Patients, identifiers, related persons, coverage, consents, duplicates and merges.
    x-owner: vimal
  - name: scheduling
    description: Slots, appointments, check-in, visit status, status board.
    x-owner: vimal
  - name: eligibility
    description: Insurance eligibility checks (X12 270/271 through the clearinghouse).
    x-owner: vimal
  - name: encounters
    description: Encounters, vitals, diagnoses, notes, favorites, after-visit summary, co-signature rules.
    x-owner: vimal
  - name: history
    description: Problem list, allergies, family, social and surgical history.
    x-owner: vimal
  - name: ai
    description: Encounter audio, transcriptions, AI note drafts, chart summaries, AI decisions and settings.
    x-owner: vimal
  - name: medications
    description: Medication list, prescriptions, safety checks, refill and change requests, pharmacies.
    x-owner: thulasi
  - name: orders
    description: Lab compendium, orders, results, unmatched results.
    x-owner: thulasi
  - name: billing
    description: Superbills, claims, payments, remittances, billing reports.
    x-owner: anand
  - name: documents
    description: Documents, outbound faxes, fax inbox.
    x-owner: anand
  - name: ccda
    description: C-CDA import and export.
    x-owner: anand
  - name: inbox
    description: Inbox items and staff messages.
    x-owner: anand
  - name: exports
    description: Permission-controlled exports.
    x-owner: anand
  - name: communications
    description: Message templates, communication preferences and history.
    x-owner: minalini
  - name: dashboards
    description: Operations dashboard.
    x-owner: minalini
paths:
  /auth/login:
    get:
      operationId: startLogin
      summary: Start sign-in
      description: 'Sends the browser to Keycloak (authorization code with PKCE `S256`, `state` and `nonce`; inventory #1; SECURITY_MODEL §2.1). The PKCE verifier, `state` and `nonce` stay server-side, keyed by the short-lived `__Host-shri_login` cookie set here. Public: no session needed.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: public
      x-audit:
        action: E
        category: security
      x-storage: admin
      x-release: P0
      security: []
      responses:
        '302':
          description: 302. Redirect to Keycloak; sets the login-state cookie.
          headers:
            Location:
              description: Where the browser is sent next.
              schema:
                type: string
                format: uri
                maxLength: 2000
            Set-Cookie:
              description: '`__Host-shri_login`: `HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=600`; holds only a key to the server-side PKCE state.'
              schema:
                type: string
                maxLength: 1000
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: 503. `service-unavailable` (the identity provider is unavailable).
  /auth/callback:
    get:
      operationId: finishLogin
      summary: Finish sign-in
      description: 'Keycloak returns here (inventory #2; SECURITY_MODEL §2.1). The server checks `state` and `nonce`, exchanges the code, keeps Keycloak''s tokens server-side, creates a new session ID (never reusing one), sets the session cookie and sends the browser back to the app. Public: no session yet. Audited as a login.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: public
      x-audit:
        action: E
        category: security
      x-storage: admin
      x-release: P0
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Keycloak.
          schema:
            type: string
            maxLength: 2000
        - name: state
          in: query
          required: true
          description: The `state` from `/auth/login`; must match the login-state cookie.
          schema:
            type: string
            maxLength: 256
      responses:
        '302':
          description: 302. Signed in; redirect back to the app. Sets the session cookie and clears the login-state cookie.
          headers:
            Location:
              description: Where the browser is sent next.
              schema:
                type: string
                format: uri
                maxLength: 2000
            Set-Cookie:
              description: '`__Host-shri_session`: `HttpOnly; Secure; SameSite=Strict; Path=/`, a 256-bit reference token; the server stores only its hash (SECURITY_MODEL §2.1).'
              schema:
                type: string
                maxLength: 1000
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: 422. `validation-failed` (`code` or `state` missing or not matching the login-state cookie, the login state expired (10 minutes), or the nonce did not match).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: 503. `service-unavailable` (the identity provider is unavailable).
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Extend the session
      description: 'Extends the idle timer and returns the new session state (inventory #3; SECURITY_MODEL §2.1). A user action: the "Stay signed in" button calls it. It cannot move the 12-hour absolute limit.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: E
        category: security
      x-storage: admin
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Extended. The session state with the new `idleExpiresAt`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                extended:
                  summary: Extended
                  value:
                    user:
                      id: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f
                      displayName: Dev FD
                      roles:
                        - FD
                      facilityIds:
                        - 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                    organization:
                      id: 0a000000-0000-4000-8000-00000000000a
                      name: Test Clinic
                    csrfToken: TEST-csrf-placeholder
                    idleExpiresAt: '2026-11-03T15:00:00Z'
                    expiresAt: '2026-11-04T02:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `authenticated`); `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: 'Deletes the server-side session and revokes Keycloak''s refresh token (inventory #4; SECURITY_MODEL §2.1). The session cookie stops working on the next request.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: E
        category: security
      x-storage: admin
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: 204. Signed out; the session cookie is cleared.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `authenticated`); `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /auth/session:
    get:
      operationId: getSession
      summary: Get the session state
      description: 'Returns the signed-in user, their clinic, the CSRF token and the two expiry times (inventory #5; SECURITY_MODEL §2.1, §2.2; Thulasi T8). Reading it does not count as user activity. Screens call it after login and after any user request, and time the idle warning from `idleExpiresAt`.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: R
        category: none
      x-storage: admin
      x-release: P0
      responses:
        '200':
          description: The session state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                front-desk:
                  summary: A front-desk user
                  value:
                    user:
                      id: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f
                      displayName: Dev FD
                      roles:
                        - FD
                      facilityIds:
                        - 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                    organization:
                      id: 0a000000-0000-4000-8000-00000000000a
                      name: Test Clinic
                    csrfToken: TEST-csrf-placeholder
                    idleExpiresAt: '2026-11-03T14:45:00Z'
                    expiresAt: '2026-11-04T02:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the account is deactivated or has no clinic).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /me:
    get:
      operationId: getMe
      summary: Get the current user
      description: 'The current user, their clinic and their effective permissions, so screens show only what the role allows (inventory #6). The server still checks every action.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: R
        category: none
      x-storage: admin
      x-release: P0
      responses:
        '200':
          description: The current user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                front-desk:
                  summary: A front-desk user
                  value:
                    user:
                      id: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f
                      displayName: Dev FD
                      roles:
                        - FD
                      facilityIds:
                        - 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                    organization:
                      id: 0a000000-0000-4000-8000-00000000000a
                      name: Test Clinic
                    permissions:
                      - patients:search
                      - patients:read
                      - patients:create
                      - appointments:create
                      - appointments:check-in
                      - scheduling-reference:read
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the account is deactivated or has no clinic).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /events/stream:
    get:
      operationId: streamEvents
      summary: Live updates (Server-Sent Events)
      description: 'Opens a Server-Sent Events stream of the events this user may see (inventory #14; EVENTS.md §3, agreed T28). Each `data:` line is one `EventEnvelope` in JSON, with IDs and status only, never PHI; screens re-fetch details through the normal API. A comment line every 25 seconds keeps proxies open. Neither the stream nor its keep-alives reset the idle timer (T9). On reconnect the browser sends `Last-Event-ID` and the server replays from a 5-minute buffer, or sends `stream.reset` so the screen re-fetches. At most 5 open streams per user.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: R
        category: none
      x-storage: admin
      x-release: P0
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: ID of the last event received, to resume after a reconnect.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: The stream. Stays open; one `EventEnvelope` per `data:` line.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the account is deactivated or has no clinic).
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests, or more than 5 open streams for this user).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /patients/{patientId}/break-glass:
    parameters:
      - name: patientId
        in: path
        required: true
        description: Patient ID.
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: breakGlass
      summary: Open a restricted chart
      description: 'Grants this user access to a restricted patient''s chart for 4 hours, with a stated reason (inventory #19; SECURITY_MODEL §5.2, D37, D53). The grant is for this user and this patient only, never widens permissions, is audited as `security`, and raises `break-glass.granted`, which puts an inbox item in front of the privacy officer (never an email with PHI). Care-team members do not need it. `reasonText` is required for `other`.'
      tags:
        - platform
      x-owner: thulasi
      x-permission: patients:break-glass
      x-audit:
        action: E
        category: security
        patient: patientId
      x-idempotency: supported
      x-storage: audit
      x-events:
        - break-glass.granted
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakGlassRequest'
            examples:
              covering:
                summary: Covering clinician
                value:
                  reasonCode: continuity-of-care
              other:
                summary: Other, with the required note
                value:
                  reasonCode: other
                  reasonText: Reviewing the chart for a quality audit requested by the practice administrator.
      responses:
        '200':
          description: Access granted. The grant, with its expiry.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakGlassGrant'
              examples:
                granted:
                  summary: Granted for 4 hours
                  value:
                    id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    userId: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f
                    reasonCode: continuity-of-care
                    grantedAt: '2026-11-03T14:30:00Z'
                    expiresAt: '2026-11-03T18:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `patients:break-glass`); `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '404':
          $ref: '#/components/responses/NotFound'
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '409':
          $ref: '#/components/responses/Conflict'
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `invalid-state-transition` (the chart is not restricted, or this user already holds a current grant); `patient-merged` (the patient was merged into another record).
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (`reasonCode` is `other` without `reasonText`); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /files/upload-url:
    post:
      operationId: createUploadUrl
      summary: Request an upload link
      description: 'Step 1 of an upload (inventory #148; API_STANDARDS §15): creates a file record in state `pending-upload` and returns a pre-signed link into the quarantine bucket. The browser `PUT`s the bytes there (step 2), then calls `POST /files/{fileId}/complete` (step 3). Client file names are not stored. Returns `201` without a `Location`: a file has no single-read endpoint in the MVP.'
      tags:
        - files
      x-owner: anand
      x-permission: files:create
      x-audit:
        action: C
        category: phi-write
      x-idempotency: supported
      x-storage: files
      x-release: P0
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
            examples:
              card:
                summary: Insurance card photo
                value:
                  purpose: insurance-card
                  contentType: image/jpeg
                  sizeBytes: 348211
                  sha256: abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd
      responses:
        '201':
          description: Created. The upload link.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
              examples:
                ticket:
                  summary: Upload link
                  value:
                    fileId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                    uploadUrl: https://files.company-domain.invalid/quarantine/TEST-upload-1
                    uploadHeaders:
                      Content-Type: image/jpeg
                    expiresAt: '2026-11-03T14:45:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 403. `permission-denied` (the role lacks `files:create`); `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '409':
          $ref: '#/components/responses/Conflict'
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running).
        '422':
          $ref: '#/components/responses/UnprocessableContent'
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (the media type or size is not allowed for this purpose, or the purpose is server-generated (`receipt`, `after-visit-summary`)); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: '#/components/responses/InternalError'
          description: 500. `internal-error` (unexpected error).
  /files/{fileId}/complete:
    parameters:
      - name: fileId
        in: path
        required: true
        description: File ID.
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: completeUpload
      summary: Finish an upload
