components:
  schemas:
    Address:
      title: Address
      description: A U.S. postal address (API_STANDARDS §6.2). Street, city and ZIP code are identifiers under HIPAA; the state alone is not.
      type: object
      additionalProperties: false
      required:
        - lines
        - city
        - state
        - postalCode
        - country
      properties:
        lines:
          description: Street address lines.
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 100
          x-phi: identifier
        city:
          description: City.
          type: string
          maxLength: 60
          x-phi: identifier
        state:
          description: USPS two-letter state code.
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
          x-phi: none
        postalCode:
          description: ZIP (`12345`) or ZIP+4 (`12345-6789`).
          type: string
          pattern: ^\d{5}(-\d{4})?$
          maxLength: 10
          x-phi: identifier
        country:
          description: Country code. Only `US` in the MVP.
          type: string
          const: US
          x-phi: none
      examples:
        - lines:
            - 100 Test Lane
          city: Springfield
          state: IL
          postalCode: '62701'
          country: US
    CodeableConcept:
      title: CodeableConcept
      description: One or more codings for the same concept, plus optional free text, as in FHIR `CodeableConcept` (API_STANDARDS §6.4).
      type: object
      additionalProperties: false
      properties:
        codings:
          description: Codings for this concept, from one or more code systems.
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Coding'
          x-phi: clinical
        text:
          description: Free text describing the concept.
          type: string
          maxLength: 1000
          x-phi: clinical
    Coding:
      title: Coding
      description: A code from a code system, as in FHIR `Coding` (API_STANDARDS §6.4). `display` is optional and never relied on for logic. When used about a patient, the code is clinical data.
      type: object
      additionalProperties: false
      required:
        - system
        - code
      properties:
        system:
          description: Canonical URI of the code system, e.g. `http://hl7.org/fhir/sid/icd-10-cm`.
          type: string
          format: uri
          maxLength: 255
          x-phi: none
        code:
          description: The code within the system.
          type: string
          maxLength: 64
          x-phi: clinical
        display:
          description: Human-readable text for the code.
          type: string
          maxLength: 500
          x-phi: clinical
      examples:
        - system: http://hl7.org/fhir/sid/icd-10-cm
          code: E11.9
          display: Type 2 diabetes mellitus without complications
    Cursor:
      title: Cursor
      description: 'Opaque pagination cursor: "continue the list from here". URL-safe, at most 512 characters, valid for 24 hours, encrypted and authenticated by the middleware, and never contains readable PHI (API_STANDARDS §8.1, ADR-0004). An expired or tampered cursor gives `400 invalid-cursor`.'
      type: string
      pattern: ^[A-Za-z0-9_-]+$
      maxLength: 512
      examples:
        - c1Zm9vYmFy
    Date:
      title: Date
      description: A calendar date without time zone, `YYYY-MM-DD` (API_STANDARDS §6.1). Used for birth dates and service dates.
      type: string
      format: date
      maxLength: 10
      examples:
        - '1984-07-19'
    EmailAddress:
      title: EmailAddress
      description: An email address (API_STANDARDS §6.2). Examples use only `example.com`, `example.org` or `example.net`.
      type: string
      format: email
      maxLength: 254
      examples:
        - ramona980.kuhlman72@example.com
    EventEnvelope:
      title: EventEnvelope
      description: 'Envelope of every domain event and every Server-Sent Event `data` line, using CloudEvents 1.0 attribute names (EVENTS.md §2). Events are thin: `data` carries IDs, statuses and counts only, never PHI.'
      type: object
      required:
        - specversion
        - id
        - type
        - source
        - subject
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          description: CloudEvents version.
          type: string
          const: '1.0'
          x-phi: none
        id:
          $ref: '#/components/schemas/Id'
          description: Unique per event; consumers deduplicate on it.
          x-phi: none
        type:
          description: Event type from the catalog in EVENTS.md §4, e.g. `appointment.checked-in`.
          type: string
          pattern: ^[a-z][a-z-]*\.[a-z][a-z-]*$
          maxLength: 100
          x-phi: none
        source:
          description: Publishing module path, e.g. `/scheduling`.
          type: string
          pattern: ^/[a-z-]+$
          maxLength: 50
          x-phi: none
        subject:
          description: '`<resource>/<uuid>` of the record the event is about.'
          type: string
          maxLength: 120
          x-phi: internal-id
        time:
          $ref: '#/components/schemas/Timestamp'
          x-phi: none
        datacontenttype:
          description: Always `application/json`.
          type: string
          const: application/json
          x-phi: none
        data:
          description: IDs (`internal-id`), enum statuses and counts only. Each event type documents its members in EVENTS.md §4.
          type: object
          maxProperties: 20
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 120
              - type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
              - type: boolean
          x-phi: internal-id
    FieldError:
      title: FieldError
      description: One invalid field in a `validation-failed` or `business-rule-violation` problem (API_STANDARDS §9.1). Never echoes the submitted value.
      type: object
      additionalProperties: false
      required:
        - in
        - code
      properties:
        in:
          description: Where the field is.
          type: string
          enum:
            - body
            - query
            - path
            - header
          x-phi: none
        pointer:
          description: RFC 6901 JSON Pointer to the field, for `in = body`.
          type: string
          pattern: ^(/[^/]*)*$
          maxLength: 500
          x-phi: none
        name:
          description: Parameter or header name, for `in` other than `body`.
          type: string
          maxLength: 100
          x-phi: none
        code:
          $ref: '#/components/schemas/FieldErrorCode'
          x-phi: none
    FieldErrorCode:
      title: FieldErrorCode
      description: Why one field failed validation (API_STANDARDS §9.2).
      type: string
      enum:
        - required
        - unknown-field
        - invalid-format
        - invalid-type
        - too-short
        - too-long
        - out-of-range
        - not-allowed-value
        - invalid-reference
        - conflicting-fields
        - not-editable
    HumanName:
      title: HumanName
      description: A person's name, mirroring FHIR `HumanName` (API_STANDARDS §6.2). Always an identifier under HIPAA.
      type: object
      additionalProperties: false
      required:
        - family
      properties:
        given:
          description: Given names, in order.
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 100
          x-phi: identifier
        family:
          description: Family name.
          type: string
          maxLength: 100
          x-phi: identifier
        prefix:
          description: Prefix such as "Dr."
          type: string
          maxLength: 20
          x-phi: identifier
        suffix:
          description: Suffix such as "Jr."
          type: string
          maxLength: 20
          x-phi: identifier
      examples:
        - given:
            - Ramona980
          family: Kuhlman72
    Id:
      title: Id
      description: 'Opaque resource ID: a lowercase UUID (RFC 9562), generated by the server. Clients must not parse it or infer order or time from it (API_STANDARDS §5, ADR-0009).'
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      maxLength: 36
      examples:
        - 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    Limit:
      title: Limit
      description: Page size for a list or search. Default 25, maximum 100 (API_STANDARDS §8.1).
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 25
    ListEnvelope:
      title: ListEnvelope
      description: The shape of every list response (API_STANDARDS §8.1, ADR-0004). OpenAPI 3.1 has no generics, so each list schema copies this shape with its own item type, e.g. `PatientSummaryList`. No `nextCursor` means this is the last page. Total counts are not returned by default.
      type: object
      required:
        - items
      properties:
        items:
          description: The items on this page. Each module list schema replaces this with its own item type.
          type: array
          maxItems: 100
          items:
            type: object
          x-phi: none
        nextCursor:
          $ref: '#/components/schemas/Cursor'
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
    Money:
      title: Money
      description: An amount of money. `value` is a decimal string with exactly two fraction digits, so JavaScript never rounds it as a float. Field names follow FHIR `Money` (API_STANDARDS §6.3; agreed by Anand, D28, D40).
      type: object
      additionalProperties: false
      required:
        - value
        - currency
      properties:
        value:
          description: Decimal amount as a string, e.g. "125.00". Negative only where an endpoint documents it.
          type: string
          pattern: ^-?\d{1,9}\.\d{2}$
          maxLength: 13
          x-phi: financial
        currency:
          description: ISO 4217 currency code. Only USD in the MVP.
          type: string
          enum:
            - USD
          x-phi: none
      examples:
        - value: '25.00'
          currency: USD
    Operation:
      title: Operation
      description: Tracks long-running work started with a `202 Accepted` (API_STANDARDS §13). Carries IDs and status only, never PHI. Visible only to the user who created it, in the MVP. Kept for 7 days.
      type: object
      required:
        - id
        - kind
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
          x-phi: none
        kind:
          $ref: '#/components/schemas/OperationKind'
          x-phi: none
        status:
          $ref: '#/components/schemas/OperationStatus'
          x-phi: none
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          x-phi: none
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          x-phi: none
        completedAt:
          $ref: '#/components/schemas/Timestamp'
          x-phi: none
        result:
          description: Reference to the produced resource, once `succeeded`. Fetch it with its normal permission.
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              description: Resource type of the result, e.g. `note`, `chart-summary`, `eligibility-check`.
              type: string
              maxLength: 64
              x-phi: none
            id:
              $ref: '#/components/schemas/Id'
              x-phi: internal-id
          x-phi: internal-id
        error:
          $ref: '#/components/schemas/Problem'
          description: Why the operation failed, once `failed`.
          x-phi: none
    OperationKind:
      title: OperationKind
      description: What kind of long-running work an operation tracks (API_STANDARDS §13).
      type: string
      enum:
        - ai.transcription
        - ai.note-draft
        - ai.chart-summary
        - eligibility.check
        - encounter.after-visit-summary
        - export
        - ccda.import
        - ccda.export
        - onboarding.import
        - medication-history.fetch
    OperationStatus:
      title: OperationStatus
      description: Progress of an operation; `succeeded`, `failed` and `cancelled` are final (API_STANDARDS §13).
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
    PartialDate:
      title: PartialDate
      description: 'A date that may be known only to the year or month: `YYYY`, `YYYY-MM` or `YYYY-MM-DD` (API_STANDARDS §6.1). Used for history entries such as surgery dates.'
      type: string
      pattern: ^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$
      maxLength: 10
      examples:
        - 2011-05
    PhoneNumber:
      title: PhoneNumber
      description: 'A phone number in E.164 form. It is patient data: never put it in a URL; patient search by phone is an exact match on the full number in the body of `POST /patients/search` (API_STANDARDS §14.2).'
      type: string
      pattern: ^\+[1-9]\d{6,14}$
      maxLength: 16
      examples:
        - '+16175550123'
    Problem:
      title: Problem
      description: Problem Details (RFC 9457) with our extension members, returned as `application/problem+json` for every 4xx and 5xx response (API_STANDARDS §9, ADR-0003). `detail` never contains PHI or submitted values; `instance` is the request path only, never the query string.
      type: object
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          description: 'Absolute URI for the problem type: the base `tag:company-domain.invalid,2026:problem/` followed by the `code` (API_STANDARDS §0, §9.1). `company-domain.invalid` is a placeholder until the company domain is confirmed; the pattern changes with it.'
          type: string
          format: uri
          pattern: ^tag:company-domain\.invalid,2026:problem/[a-z][a-z-]*$
          maxLength: 255
          x-phi: none
        title:
          description: Fixed English text for the `code`.
          type: string
          maxLength: 200
          x-phi: none
        status:
          description: The HTTP status code.
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          x-phi: none
        detail:
          description: Human-readable explanation. Never contains PHI or request values.
          type: string
          maxLength: 1000
          x-phi: none
        instance:
          description: The request path only (may contain opaque IDs), never the query string.
          type: string
          format: uri-reference
          maxLength: 2048
          x-phi: internal-id
        code:
          $ref: '#/components/schemas/ProblemCode'
          x-phi: none
        requestId:
          $ref: '#/components/schemas/Id'
          description: Same value as the `X-Request-ID` response header.
          x-phi: none
        errors:
          description: Field errors; present for `validation-failed` and `business-rule-violation`.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldError'
          x-phi: none
        currentState:
          description: Current state, for `invalid-state-transition`.
          type: string
          maxLength: 64
          x-phi: none
        candidateIds:
          description: IDs of possibly matching patients, for `possible-duplicate` (IDs only, minimum necessary).
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Id'
          x-phi: internal-id
        mergedIntoId:
          $ref: '#/components/schemas/Id'
          description: The surviving patient, for `patient-merged`.
          x-phi: internal-id
        patientId:
          $ref: '#/components/schemas/Id'
          description: The restricted patient, for `break-glass-required`.
          x-phi: internal-id
        feature:
          description: The AI feature that is switched off, for `feature-disabled`.
          type: string
          maxLength: 64
          x-phi: none
        consentType:
          description: The missing consent, for `consent-required`.
          type: string
          maxLength: 64
          x-phi: none
        fileId:
          $ref: '#/components/schemas/Id'
          description: The file that is not ready, for `file-not-ready`.
          x-phi: internal-id
        maxBytes:
          description: The size limit, for `payload-too-large`.
          type: integer
          format: int64
          minimum: 0
          maximum: 10737418240
          x-phi: none
    ProblemCode:
      title: ProblemCode
      description: Stable machine key for an error (API_STANDARDS §9.3, ADR-0003). Clients switch on this value, never on `title` or `detail`. Codes are never renamed or reused; new codes may be added, so clients must handle unknown values. The last four are used only inside a failed operation (API_STANDARDS §13).
      type: string
      enum:
        - malformed-request
        - invalid-cursor
        - idempotency-key-missing
        - unauthenticated
        - session-expired
        - permission-denied
        - csrf-check-failed
        - break-glass-required
        - not-found
        - method-not-allowed
        - not-acceptable
        - invalid-state-transition
        - record-locked
        - booking-conflict
        - possible-duplicate
        - patient-merged
        - idempotency-request-in-progress
        - feature-disabled
        - consent-required
        - gone
        - precondition-failed
        - payload-too-large
        - unsupported-media-type
        - validation-failed
        - business-rule-violation
        - idempotency-key-reused
        - file-not-ready
        - precondition-required
        - rate-limited
        - internal-error
        - upstream-error
        - service-unavailable
        - upstream-timeout
        - ai-unavailable
        - ai-output-rejected
        - partner-rejected
        - partner-timeout
    Quantity:
      title: Quantity
      description: A measured amount with a UCUM unit code (system `http://unitsofmeasure.org`), e.g. a vital sign (API_STANDARDS §6.4).
      type: object
      additionalProperties: false
      required:
        - value
        - unit
      properties:
        value:
          description: The measured value.
          type: number
          minimum: -1000000
          maximum: 1000000
          x-phi: clinical
        unit:
          description: UCUM unit code, e.g. `mm[Hg]`, `[degF]`, `kg`.
          type: string
          maxLength: 32
          x-phi: none
      examples:
        - value: 98.6
          unit: '[degF]'
    SearchPaging:
      title: SearchPaging
      description: Paging members that every `POST …/search` body carries next to its `criteria`, because PHI searches never use query strings (API_STANDARDS §14, ADR-0005).
      type: object
      properties:
        limit:
          $ref: '#/components/schemas/Limit'
          x-phi: none
        cursor:
          $ref: '#/components/schemas/Cursor'
          x-phi: none
    Timestamp:
      title: Timestamp
      description: An instant, RFC 3339 `date-time`, always UTC with `Z` in responses, at most millisecond precision. Requests may send any offset; the server normalizes to UTC (API_STANDARDS §6.1).
      type: string
      format: date-time
      maxLength: 35
      examples:
        - '2026-11-03T14:30:00Z'
    PatientSearchRequest:
      description: Patient search. Give either one exact identifier (`mrn`, `driversLicenseNumber`, `memberId` or the full `phone`) or at least two criteria, for example `family` and `birthDate`; otherwise `422 business-rule-violation` (API_STANDARDS §14.2).
      type: object
      additionalProperties: false
      required:
        - criteria
      properties:
        criteria:
          description: Search criteria.
          type: object
          additionalProperties: false
          properties:
            family:
              type: string
              minLength: 2
              maxLength: 100
              description: Family name, at least 2 characters; matches names starting with it.
              x-phi: identifier
            given:
              type: string
              minLength: 1
              maxLength: 100
              description: Given name; matches names starting with it.
              x-phi: identifier
            birthDate:
              $ref: '#/components/schemas/Date'
              description: Exact date of birth.
              x-phi: identifier
            phone:
              $ref: '#/components/schemas/PhoneNumber'
              description: Full phone number, exact match on its digits (E.164). No partial-number search (D13, API_STANDARDS §14.2).
              x-phi: identifier
            mrn:
              type: string
              minLength: 1
              maxLength: 40
              description: Exact MRN.
              x-phi: identifier
            driversLicenseNumber:
              type: string
              minLength: 1
              maxLength: 200
              description: Exact driver's license number.
              x-phi: identifier
            memberId:
              type: string
              minLength: 1
              maxLength: 200
              description: Exact insurance member ID.
              x-phi: identifier
            includeInactive:
              type: boolean
              default: false
              description: Include merged records.
              x-phi: none
          x-phi: identifier
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 25
          description: Page size, at most 50 for patient search.
          x-phi: none
        cursor:
          $ref: '#/components/schemas/Cursor'
          description: Cursor from the previous page.
          x-phi: none
    AdministrativeGender:
      description: Administrative gender, FHIR `AdministrativeGender` codes (US Core Patient `gender`).
      type: string
      enum:
        - male
        - female
        - other
        - unknown
    PatientSummary:
      description: 'Patient search result: minimum necessary (SECURITY_MODEL §8 rule 4).'
      type: object
      required:
        - id
        - name
        - mrn
        - restricted
