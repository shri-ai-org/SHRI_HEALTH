  /patients/{patientId}/problems/{problemId}/entered-in-error:
    parameters: *id010
    post:
      operationId: markProblemEnteredInError
      summary: Mark problem entered in error
      description: 'Marks a wrong entry entered-in-error with a reason, in one transaction with its Provenance (inventory
        #93; D14). It is kept for audit and left out of the chart. RN only for their own entries.'
      tags:
      - history
