# Shri Health API — module `history`
# x-owner: vimal  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Timeline, problems, allergies, family, social and surgical history (`backend/app/modules/history/`)
# Contract batch 2 (inventory B4), 2026-10-24: rows #46, #90-106 and the single GETs for problems (#249) and allergies (#250), from the approved
# plan contracts/docs/BATCH2_PLAN.md and the locked schema (D72). Problems and allergies are edited with If-Match; family, social and surgical
# history are insert-only. Every record carries its source, author and date (FRS FR-PAT-02, FR-PAT-03); nothing is deleted (D14).
paths:
  /patients/{patientId}/timeline:
    parameters: &id001
    - &id009
      name: patientId
      in: path
      required: true
      description: Patient ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: getPatientTimeline
      summary: Get a patient's timeline
      description: 'The patient''s longitudinal record, newest first: encounters, diagnoses, problems, allergies, vitals,
        notes, procedures, and family and social history, each with its source, author and date (inventory #46; FRS FR-PAT-02).
        Medications, results and documents join when their batches exist. Filters use record kinds and days only, never PHI
        (D13).'
      tags:
      - history
      x-owner: vimal
      x-permission: timeline:read
      x-audit: &id002
        action: R
        category: phi-read
        patient: patientId
      x-storage: clinical
      x-release: P0
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - name: types
        in: query
        required: false
        style: form
        explode: true
        description: Only these kinds of record; repeat the parameter for several.
        schema:
          type: array
          maxItems: 12
          items:
            type: string
            enum: &id026
            - encounter
            - diagnosis
            - problem
            - allergy
            - vital
            - note
            - procedure
            - family-history
            - social-history
            - medication
            - result
            - document
      - name: dateFrom
        in: query
        required: false
        description: First day, inclusive.
        schema:
          $ref: ../components/schemas/Date.yaml
      - name: dateTo
        in: query
        required: false
        description: Last day, inclusive.
        schema:
          $ref: ../components/schemas/Date.yaml
      responses:
        '200':
          description: One page of timeline entrys.
          headers:
            X-Request-ID: &id003
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control: &id004
              $ref: ../components/headers/CacheControl.yaml
            RateLimit: &id005
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy: &id006
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
              examples:
                page:
                  summary: One page
                  value:
                    items:
                    - type: note
                      id: 6e7f8a9b-0c1d-4e2f-9a3b-4c5d6e7f8a9b
                      date: '2026-11-03'
                      title: Progress note
                      status: final
                      encounterId: 5d6e7f8a-9b0c-4d1e-8f2a-3b4c5d6e7f8a
                      entrySource: clinician
                      recordedAt: '2026-11-03T15:35:00Z'
                      recordedBy: &id007
                        id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        displayName: Dr. Lowe58
                    - type: problem
                      id: 8e9f0a1b-2c3d-4e4f-9a5b-6c7d8e9f0a1b
                      date: '2019'
                      title: Type 2 diabetes mellitus without complications
                      status: active
                      entrySource: clinician
                      recordedAt: '2026-11-03T15:30:00Z'
                    - type: procedure
                      id: 2c3d4e5f-6a7b-4c8d-9e9f-0a1b2c3d4e5f
                      date: '2011'
                      title: Appendectomy
                      status: completed
                      entrySource: patient-reported
                      recordedAt: '2026-11-03T15:14:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `timeline:read`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such timeline entry in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /patients/{patientId}/problems:
    parameters: *id001
    get:
      operationId: listProblems
      summary: List a patient's problems
      description: 'A patient''s problems, newest first (inventory #90; FRS FR-PAT-03). Entered-in-error entries are left
        out unless asked for.'
      tags:
      - history
      x-owner: vimal
      x-permission: problems:read
      x-audit: *id002
      x-storage: clinical
      x-release: P0
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - &id012
        name: includeEnteredInError
        in: query
        required: false
        description: Include entered-in-error records, marked.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: One page of problemss.
          headers:
            X-Request-ID: *id003
            Cache-Control: *id004
            RateLimit: *id005
            RateLimit-Policy: *id006
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemList'
              examples:
                page:
                  summary: One page
                  value:
                    items:
                    - &id008
                      id: 8e9f0a1b-2c3d-4e4f-9a5b-6c7d8e9f0a1b
                      patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      code: &id011
                        codings:
                        - system: http://hl7.org/fhir/sid/icd-10-cm
                          code: E11.9
                          display: Type 2 diabetes mellitus without complications
                      clinicalStatus: active
                      verificationStatus: confirmed
                      onsetDate: '2019'
                      entrySource: clinician
                      recordedAt: '2026-11-03T15:30:00Z'
                      recordedBy: *id007
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `problems:read`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such problems in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
    post:
      operationId: addProblem
      summary: Add problem
      description: 'Adds problem with its Provenance, in one transaction (inventory #91; FRS FR-PAT-03). The entry records
        who entered it and its source.'
      tags:
      - history
      x-owner: vimal
      x-permission: problems:create
      x-audit:
        action: C
        category: phi-write
        patient: patientId
      x-idempotency: supported
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemCreate'
            examples:
              add:
                summary: Add
                value:
                  code:
                    codings:
                    - system: http://hl7.org/fhir/sid/icd-10-cm
                      code: E11.9
                  onsetDate: '2019'
      responses:
        '201':
          description: Created. The new problem.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id003
            Cache-Control: *id004
            RateLimit: *id005
            RateLimit-Policy: *id006
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                added:
                  summary: Added
                  value: *id008
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `problems:create`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no break-glass
            grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such problem in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `patient-merged`
            (the patient was merged into another record).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: '422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (a rule
            rejects it: a code from a system not allowed here, or a date in the future (field code `out-of-range`)); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).'
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
