components:
  schemas:
    ClinicianRef:
      description: A clinician or staff member, for display.
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Practitioner ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Name as shown on screens (staff, not patient data).
          x-phi: none
    TimelineEntryType:
      description: 'Kind of record on the timeline. An extensible enum (API_STANDARDS §6.5): later batches add kinds, so screens
        show an unknown kind as a generic record. `medication`, `result` and `document` appear once their batches exist.'
      type: string
      maxLength: 40
      x-extensible-enum: *id026
    TimelineEntry:
      description: 'One record on the patient''s timeline (FRS FR-PAT-02): enough to list it and open it through its own endpoint.
        Entered-in-error records are left out.'
      type: object
      required:
      - type
      - id
      - title
      - entrySource
      properties:
        type:
          $ref: '#/components/schemas/TimelineEntryType'
          description: Kind of record.
          x-phi: none
        id:
          $ref: ../components/schemas/Id.yaml
          description: The record's ID, for its own endpoint.
          x-phi: internal-id
        date:
          $ref: ../components/schemas/PartialDate.yaml
          description: When it happened, as far as known.
          x-phi: clinical
        title:
          type: string
          maxLength: 300
          description: Short text to show, e.g. the diagnosis or note title.
          x-phi: clinical
        status:
          type: string
          maxLength: 40
          description: The record's own status code, e.g. `final`, `active`, `finished`.
          x-phi: none
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter it belongs to, if any.
          x-phi: internal-id
        entrySource:
          type: string
          enum:
          - clinician
          - imported
          - patient-reported
          - ai-generated
          - device
          - interface
          description: 'Where the record came from: entered by a clinician, imported, reported by the patient, generated by
            AI and verified, from a device, or from an interface. Read-only.'
          x-phi: none
        recordedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was recorded. Read-only.
          x-phi: none
        recordedBy:
          $ref: '#/components/schemas/ClinicianRef'
          description: Who recorded it, when known. Read-only.
          x-phi: none
    Timeline:
      description: 'A patient''s longitudinal record, newest first (inventory #46; FRS FR-PAT-02).'
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TimelineEntry'
          description: The items on this page.
          x-phi: clinical
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
    Problem:
      description: 'A problem-list entry: a Condition with category `problem-list-item`, separate from encounter diagnoses
        (FRS FR-PAT-03; US Core Condition Problems and Health Concerns).'
      type: object
      required:
      - id
      - patientId
      - code
      - verificationStatus
      - entrySource
      - recordedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Problem ID (the Condition).
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        code:
          $ref: ../components/schemas/CodeableConcept.yaml
          description: 'The problem: ICD-10-CM or SNOMED CT, or text.'
          x-phi: clinical
        clinicalStatus:
          type: string
          enum:
          - active
          - recurrence
          - relapse
          - inactive
          - remission
          - resolved
          description: FHIR clinical status. Absent once entered in error (FHIR con-5).
          x-phi: clinical
        verificationStatus:
          type: string
          enum:
          - unconfirmed
          - provisional
          - differential
          - confirmed
          - refuted
          - entered-in-error
          description: FHIR verification status.
          x-phi: clinical
        onsetDate:
          $ref: ../components/schemas/PartialDate.yaml
          description: When it started, as far as known.
          x-phi: clinical
        abatementDate:
          $ref: ../components/schemas/PartialDate.yaml
          description: When it resolved or went into remission; only with `inactive`, `resolved` or `remission` (FHIR con-4).
          x-phi: clinical
        note:
          type: string
          maxLength: 2000
          description: Free-text note.
          x-phi: clinical
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter it was recorded in, if any.
          x-phi: internal-id
        entrySource:
          type: string
          enum:
          - clinician
          - imported
          - patient-reported
          - ai-generated
          - device
          - interface
