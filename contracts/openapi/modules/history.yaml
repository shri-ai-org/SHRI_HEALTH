      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Body to mark problem entered in error (D14). The reason is stored in the Provenance record, never
                in a log.
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
                  minLength: 1
                  description: Why the record is wrong, e.g. "Recorded on the wrong patient." Required; shown in the audit
                    trail.
                  x-phi: clinical
            examples:
              wrong:
                summary: Wrong patient
                value:
                  reason: Recorded on the wrong patient.
      responses:
        '200':
          description: The problem.
          headers:
