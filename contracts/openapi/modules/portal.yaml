  /portal/me/medications:
    get:
      operationId: listPortalMedications
      summary: List my medications
      description: 'The patient''s medication list (§8.2 E of the batch 1 plan): what the practice prescribed, with where
        it is on its way to the pharmacy, and what the patient reported taking. Active first; entered-in-error entries never
        appear. No prescriber-only notes.'
      tags:
      - portal
      x-owner: thulasi
      x-permission: portal-records:read
      x-audit:
        action: R
        category: phi-read
        patient: session
        actor: patient
      x-storage: clinical
      x-release: P1
      security:
      - portalSessionCookie: []
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      responses:
        '200':
          description: One page.
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMedicationList'
              examples:
                page:
                  summary: A new prescription and a reported medication
                  value:
