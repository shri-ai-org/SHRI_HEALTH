                    - id: 0e1f2a3b-4c5d-4e6f-9a7b-8c9d0e1f2a3b
                      display: Amoxicillin 500 mg capsule
                      dosageText: 1 capsule by mouth three times daily for 10 days
                      status: active
                      source: prescription
                      prescribedAt: '2026-11-20T15:23:00Z'
                      prescriberDisplayName: Dr. Lowe58
                      pharmacyName: Example Pharmacy
                      transmissionStatus: accepted
                    - id: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
                      display: Lisinopril 10 mg tablet
                      dosageText: 1 tablet by mouth once daily
                      status: active
                      source: reported
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid portal session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: '403. `permission-denied` (the session lacks `portal-records:read`: not a patient session, or the account
            is not enrolled).'
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
