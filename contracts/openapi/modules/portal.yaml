          - past
          default: upcoming
      responses:
        '200':
          description: One page.
          headers:
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalAppointmentList'
              examples:
                upcoming:
                  summary: Upcoming
                  value:
                    items:
                    - &id019
                      id: 9b0c1d2e-3f4a-4b5c-8d6e-7f8a9b0c1d2e
                      startAt: '2026-11-05T15:30:00Z'
                      endAt: '2026-11-05T15:50:00Z'
                      timeZone: America/Chicago
                      status: booked
                      facility: &id015
                        id: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                        name: Riverside Family Medicine
                        address: &id022
                          lines:
                          - 100 Example Way
                          city: Springfield
                          state: IL
                          postalCode: '62701'
                          country: US
                      provider: &id016
                        id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        displayName: Dr. Lowe58
                      appointmentType: &id017
                        id: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
                        name: Follow-up visit
                      telehealth: false
                      reasonForVisit: Blood pressure follow-up
                      patientInstruction: Please arrive 15 minutes early.
                      canCancel: true
                      canReschedule: true
                past:
                  summary: Past
                  value:
                    items:
                    - id: 0c1d2e3f-4a5b-4c6d-9e7f-8a9b0c1d2e3f
                      startAt: '2026-10-01T14:00:00Z'
                      endAt: '2026-10-01T14:20:00Z'
                      timeZone: America/Chicago
                      status: fulfilled
                      facility: *id015
                      provider: *id016
                      appointmentType: *id017
                      telehealth: false
                      reasonForVisit: Blood pressure follow-up
                      patientInstruction: Please arrive 15 minutes early.
                      canCancel: false
                      canReschedule: false
                      visitSummaryId: b3c4d5e6-f7a8-4b9c-8d0e-1f2a3b4c5d6e
        '400': *id018
        '401': *id010
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: '403. `permission-denied` (the session lacks `portal-appointments:read`: not a patient session, or
            the account is not enrolled).'
        '422': &id020
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429': *id003
        '500': *id004
    post:
      operationId: bookPortalAppointment
      summary: Book a visit
      description: Books a free time (`GET /portal/me/slots`) under the same rules as staff booking (no double booking, the
        provider's day locked while booking); the length comes from the appointment type. Queues eligibility (D15).
      tags:
      - portal
      x-owner: vimal
      x-permission: portal-appointments:create
      x-audit:
        action: C
        category: phi-write
        patient: session
        actor: patient
      x-idempotency: supported
      x-storage: clinical
      x-events:
      - appointment.booked
      x-release: P1
      security: *id011
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalAppointmentCreate'
            examples:
              book:
                summary: Book
                value:
                  facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                  appointmentTypeId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
                  providerId: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                  startAt: '2026-11-05T15:30:00Z'
                  reasonForVisit: Blood pressure follow-up
      responses:
        '201':
          description: Created. The appointment.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalAppointment'
              examples:
                booked:
                  summary: Booked
                  value: *id019
        '400': *id014
        '401': *id010
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: '403. `permission-denied` (the session lacks `portal-appointments:create`: not a patient session, or
            the account is not enrolled); `csrf-check-failed` (missing or wrong CSRF header or Origin).'
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: '409. `booking-conflict` (the time was just taken: read the free times again); `idempotency-request-in-progress`
