# Shri Health API — module `portal`
# x-owner: vimal (the module); each operation keeps its owning module's x-owner (D83): sign-in and session thulasi,
# patient, scheduling and history data vimal.
# Scope: The patient portal under /api/v1/portal (P1). Batch B8a, 2026-10-26: sign-in, enrollment, profile and change
# requests, appointments and booking, visit summaries, problems, allergies and vitals (D83-D89, ADR-0013). Messages
# follow batch 3 (#58); results, prescriptions, bills and documents follow B5 and B6 (D89).
# The patient comes from the portal session (`portalSessionCookie`), never the request: no path or body names a patient
# (D84). A record ID in a path that isn't the session patient's gives 404. Released records only (D86): drafts,
# entered-in-error records and psychotherapy notes never appear; items a clinician holds are listed as held.
paths:
  /portal/auth/login:
    get:
      operationId: startPortalLogin
      summary: Start patient sign-in
      description: 'Sends the browser to the patient realm (`shri-patients`, authorization code with PKCE `S256`, `state`
        and `nonce`, `prompt=login`; ADR-0013 §1, §5). Never sends `login_hint`, so no email is in a URL (D13). Public: no
        session needed.'
      tags:
      - portal
      x-owner: thulasi
      x-permission: public
      x-audit:
        action: E
        category: security
        actor: patient
      x-storage: admin
      x-release: P1
      security: []
      responses:
        '302':
          description: 302. Redirect to the patient realm; sets the login-state cookie.
          headers:
            Location: &id001
              description: Where the browser is sent next.
              schema:
                type: string
                format: uri
                maxLength: 2000
            Cache-Control: &id002
              $ref: ../components/headers/CacheControl.yaml
        '429': &id003
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500': &id004
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
        '503': &id005
          $ref: ../components/responses/ServiceUnavailable.yaml
          description: 503. `service-unavailable` (the patient realm is unavailable).
  /portal/auth/callback:
    get:
      operationId: completePortalLogin
      summary: Finish patient sign-in
      description: Checks `state` and `nonce`, exchanges the code, keeps the realm's tokens server-side, creates a new portal
        session (`__Host-shri_portal`) and sends the browser to the portal (ADR-0013 §5). An account that has not finished
        its realm setup (password, second factor) cannot reach this. Public.
      tags:
      - portal
      x-owner: thulasi
      x-permission: public
      x-audit:
        action: E
        category: security
        actor: patient
      x-storage: admin
      x-release: P1
      security: []
      responses:
        '302':
          description: 302. Signed in; redirect to the portal. Sets the portal session cookie.
          headers:
            Location: *id001
            Cache-Control: *id002
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (`state`, `nonce` or the code is missing or wrong).
        '429': *id003
        '500': *id004
        '503': *id005
  /portal/auth/session:
    get:
      operationId: getPortalSession
      summary: Get the portal session
      description: The signed-in patient, the CSRF token and the session's expiry times. Reading it never extends the session
        (as for staff, SECURITY_MODEL §2.1).
      tags:
      - portal
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: R
        category: none
        actor: patient
      x-storage: admin
      x-release: P1
      security: &id012
      - portalSessionCookie: []
      responses:
        '200':
          description: The session.
          headers:
            X-Request-ID: &id006
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control: *id002
            RateLimit: &id007
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy: &id008
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                session:
                  summary: Signed in
                  value: &id009
                    patient:
                      displayName: Maria712
                    csrfToken: mock-csrf-token-not-a-secret
                    idleExpiresAt: '2035-01-01T16:15:00Z'
                    expiresAt: '2035-01-01T20:00:00Z'
        '401': &id010
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid portal session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (not a portal session).
        '429': *id003
        '500': *id004
  /portal/auth/refresh:
    post:
      operationId: refreshPortalSession
      summary: Stay signed in
      description: Extends the idle timer (a user action, from "Stay signed in") and returns the session. The 4-hour limit
        cannot be extended.
      tags:
      - portal
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: E
        category: security
        patient: session
        actor: patient
      x-storage: admin
      x-release: P1
      security: &id011
      - portalSessionCookie: []
        csrfHeader: []
      responses:
        '200':
          description: The session.
          headers:
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                session:
                  summary: Extended
                  value: *id009
        '401': *id010
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '429': *id003
        '500': *id004
  /portal/auth/logout:
    post:
      operationId: signOutOfPortal
      summary: Sign out
      description: 'Ends the portal session and the patient realm''s session over the back channel (as #35 for staff).'
      tags:
      - portal
      x-owner: thulasi
      x-permission: authenticated
      x-audit:
        action: E
        category: security
        patient: session
        actor: patient
      x-storage: admin
      x-release: P1
      security: *id011
      responses:
        '204':
          description: 204. Signed out.
          headers:
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
        '401': *id010
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `csrf-check-failed` (missing or wrong CSRF header or Origin).
        '429': *id003
        '500': *id004
  /portal/enrollments:
    post:
      operationId: enrollInPortal
      summary: Enroll with an invitation code
      description: 'Redeems a front-desk invitation code (ADR-0013 §3, D85): with the matching date of birth it creates the
        patient realm account for the email given, links it to the chart once, and the realm sends its "set up your account"
        email (password and second factor are set in the realm, never here, D3). The chart''s existing contacts are told an
        account was set up, without naming the clinic. Every failure gives the same answer, so codes, accounts and charts
        cannot be probed; rate-limited per address and per invitation, and an invitation is revoked after 5 failed tries.
        Public: there is no session yet, so there is no CSRF token either; instead the `Origin` header must be the portal
        host (ADR-0013 §5), which stops another site from posting the form. Implemented in core (ADR-0013 Consequences).'
      tags:
      - portal
      x-owner: thulasi
      x-permission: public
      x-audit:
        action: C
        category: security
        actor: patient
      x-idempotency: supported
      x-storage: admin
      x-release: P1
      security: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
            examples:
              enroll:
                summary: Enroll
                value:
                  invitationCode: K7Q2-9MZD-4TXH
                  birthDate: '1984-07-19'
                  email: maria.ortiz@example.com
      responses:
        '204':
          description: '204. Enrolled: the realm sends its set-up email. Nothing else is returned.'
          headers:
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
        '400': &id014
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `csrf-check-failed` (the `Origin` header is missing or is not the portal host).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: '422. `validation-failed` (a field is missing or malformed); `business-rule-violation` (`errors` names
            `/invitationCode` `not-allowed-value` for every reason the code can''t be used: unknown, expired, used, revoked,
            its chart merged into another or no longer active, or the date of birth doesn''t match); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).'
        '429': *id003
        '500': *id004
        '503': *id005
  /portal/me:
    get:
      operationId: getPortalProfile
      summary: Get my details
      description: The patient's own details from the chart, with pending change requests.
      tags:
      - portal
      x-owner: vimal
      x-permission: portal-profile:read
      x-audit:
        action: R
        category: phi-read
        patient: session
        actor: patient
      x-storage: clinical
      x-release: P1
      security: *id012
      responses:
        '200':
          description: The details.
          headers:
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalProfile'
              examples:
                me:
                  summary: Details
                  value:
                    name:
                      given:
                      - Maria712
                      family: Ortiz187
                    preferredName: Maria712
                    birthDate: '1984-07-19'
                    mrn: TEST-000123
                    phones:
                    - number: '+12175550123'
                      use: mobile
                    email: maria.ortiz@example.com
                    address:
                      lines:
                      - 12 Sample Street
                      city: Springfield
                      state: IL
                      postalCode: '62704'
                      country: US
                    emergencyContact:
                      name: Lucas215 Ortiz187
                      relationship: Spouse
                      phone: '+12175550177'
                    preferredPharmacy:
                      name: Example Pharmacy
                      city: Springfield
                    preferredLanguage: en
                    race:
                      ombCategories:
                      - 2106-3
                    ethnicity:
                      ombCategories:
                      - 2135-2
                    maritalStatus: M
                    pendingChangeRequests:
                    - &id013
                      id: a2b3c4d5-e6f7-4a8b-9c0d-1e2f3a4b5c6d
                      status: pending
                      changes:
                        phones:
                        - number: '+12175550188'
                          use: mobile
                      note: New cell phone.
                      submittedAt: '2026-10-26T16:00:00Z'
        '401': *id010
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: '403. `permission-denied` (the session lacks `portal-profile:read`: not a patient session, or the account
            is not enrolled).'
        '429': *id003
        '500': *id004
  /portal/me/change-requests:
    get:
      operationId: listPortalChangeRequests
      summary: List my change requests
      description: The patient's change requests, newest first.
      tags:
      - portal
      x-owner: vimal
      x-permission: portal-profile:read
      x-audit:
        action: R
        category: phi-read
        patient: session
        actor: patient
      x-storage: admin
      x-release: P1
      security: *id012
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      responses:
        '200':
          description: One page.
          headers:
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalChangeRequestList'
              examples:
                page:
                  summary: One page
                  value:
                    items:
                    - *id013
        '400': &id018
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401': *id010
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: '403. `permission-denied` (the session lacks `portal-profile:read`: not a patient session, or the account
            is not enrolled).'
        '429': *id003
        '500': *id004
    post:
      operationId: requestPortalChange
      summary: Ask to change my details
      description: Sends the front desk a request to change details on the chart; it becomes a `task` in the front-desk role's
        inbox queue at the patient's facility (D77). Nothing on the chart changes until the front desk accepts it; name changes
        are checked against ID.
      tags:
      - portal
      x-owner: vimal
      x-permission: portal-profile:request-change
      x-audit:
        action: C
        category: phi-write
        patient: session
        actor: patient
      x-idempotency: supported
      x-storage: admin
      x-events:
      - inbox.item-assigned
      x-release: P1
      security: *id011
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalChangeRequestCreate'
            examples:
              phone:
                summary: New phone number
                value:
                  changes:
                    phones:
                    - number: '+12175550188'
                      use: mobile
                  note: New cell phone.
              language:
                summary: Preferred language
                value:
                  changes:
                    preferredLanguage: es
      responses:
        '201':
          description: Created. The request, pending.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            X-Request-ID: *id006
            Cache-Control: *id002
            RateLimit: *id007
            RateLimit-Policy: *id008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalChangeRequest'
              examples:
                sent:
                  summary: Sent
                  value: *id013
        '400': *id014
        '401': *id010
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: '403. `permission-denied` (the session lacks `portal-profile:request-change`: not a patient session,
            or the account is not enrolled); `csrf-check-failed` (missing or wrong CSRF header or Origin).'
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a field is invalid); `business-rule-violation` (`errors` names `/changes/genderIdentity`
            or `/changes/sexualOrientation` `not-allowed-value` where the practice does not show these fields, D39); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).
        '429': *id003
        '500': *id004
  /portal/me/appointments:
    get:
      operationId: listPortalAppointments
      summary: List my appointments
      description: The patient's appointments, in facility time (D40).
      tags:
      - portal
      x-owner: vimal
      x-permission: portal-appointments:read
      x-audit:
        action: R
        category: phi-read
        patient: session
        actor: patient
      x-storage: clinical
      x-release: P1
      security: *id012
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
