components:
  schemas:
    PartnerMessage:
      description: 'A partner reply as the partner contracts define it (contracts/partners): the clearinghouse''s 271 (`result`,
        `plan`, `benefits`, `errors`), the pharmacy''s RxStatus (`status`, `rejection`), or the lab or imaging center''s LabOrderStatus
        (`status`, `fillerOrderNumber`, `rejection`) or LabResult (`fillerOrderNumber`, `category`, `report`). Core checks
        this envelope; the owning module validates the whole message against its own partner schema.'
      type: object
      additionalProperties: false
      required:
      - messageType
      - schemaVersion
      - correlationId
      - responseId
      - respondedAt
      properties:
        messageType:
          type: string
          enum:
          - '271'
          - RxStatus
          - LabOrderStatus
          - LabResult
          description: The partner message type.
          x-phi: none
        schemaVersion:
          type: string
          maxLength: 10
          pattern: ^[0-9]+\.[0-9]+$
          description: The partner contract's version.
          x-phi: none
        correlationId:
          $ref: ../components/schemas/Id.yaml
          description: The ID of our request this answers.
          x-phi: internal-id
        responseId:
          type: string
          minLength: 1
          maxLength: 60
          description: The partner's ID for this reply.
          x-phi: internal-id
        respondedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When the partner answered.
          x-phi: none
        result:
          type: string
          enum:
          - active
          - inactive
          - member-not-found
          - error
          description: '271 only: the eligibility answer.'
          x-phi: none
        plan:
          type: object
          maxProperties: 20
          description: '271 only: the plan (the clearinghouse partner schema).'
          x-phi: financial
        benefits:
          type: array
          maxItems: 200
          items:
            type: object
            maxProperties: 20
          description: '271 only: the benefit lines (the clearinghouse partner schema).'
          x-phi: financial
        errors:
          type: array
          maxItems: 20
          items:
            type: object
            maxProperties: 10
          description: '271 only: the payer''s error codes (the clearinghouse partner schema).'
          x-phi: none
        status:
          type: string
          enum:
          - accepted
          - rejected
          - received
          - cancelled
          description: 'RxStatus: the pharmacy''s answer (`accepted`, `rejected`). LabOrderStatus: the center''s answer (`received`,
            `rejected`, `cancelled`).'
          x-phi: none
        rejection:
          type: object
          maxProperties: 10
          description: 'RxStatus and LabOrderStatus only: why it was rejected (the pharmacy or lab partner schema).'
          x-phi: none
        fillerOrderNumber:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,60}$
          maxLength: 60
          description: 'LabOrderStatus and LabResult only: the center''s order number. Never a patient identifier.'
          x-phi: none
        category:
          type: string
          enum:
          - laboratory
          - imaging
          description: 'LabResult only: a lab or imaging report.'
          x-phi: none
        report:
          type: object
          maxProperties: 20
          description: 'LabResult only: the report and its results (the lab partner schema).'
          x-phi: clinical
    SessionUser:
      description: The signed-in user, as the session knows them. Roles use the codes in SECURITY_MODEL §4.3.
      type: object
      required:
      - id
      - displayName
      - roles
      - facilityIds
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: User ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Name for the header (a staff member, not a patient).
          x-phi: none
        roles:
          type: array
          maxItems: 10
          items:
            type: string
            enum:
            - FD
            - MA
            - RN
            - MD
            - APP
            - BIL
            - ADM
            - CO
            - SUP
            - DSP
          description: Role codes (SECURITY_MODEL §4.3; `DSP` is the status board display, D47). The server checks every action;
            roles only decide what screens show.
          x-phi: none
        facilityIds:
          type: array
          maxItems: 50
          items:
            $ref: ../components/schemas/Id.yaml
          description: Facilities the user is assigned to (SECURITY_MODEL §5.1).
          x-phi: internal-id
        practitionerId:
          $ref: ../components/schemas/Id.yaml
          description: The user's own practitioner, the ID that `providerId` takes on the schedule, so a clinician's screens
            can show their own appointments. Present only for a user linked to a practitioner; absent for a user who isn't
            one (for example front desk or billing).
          x-phi: internal-id
    SessionOrganization:
      description: The clinic (tenant) of the session. It comes from the server-side session only, never from token claims
        (D21).
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Organization ID.
          x-phi: internal-id
        name:
          type: string
          maxLength: 200
          description: Practice name.
          x-phi: none
    Session:
      description: Session state for the browser (SECURITY_MODEL §2.1, §2.2). Read after login and after any user request
        that may have extended the session.
      type: object
      required:
      - user
      - organization
      - csrfToken
      - idleExpiresAt
      - expiresAt
      - build
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
          description: The signed-in user.
          x-phi: none
        organization:
          $ref: '#/components/schemas/SessionOrganization'
          description: The clinic.
          x-phi: none
        csrfToken:
          type: string
          maxLength: 128
          description: Send as `X-CSRF-Token` on every POST, PUT and PATCH, including `/auth/refresh` and `/auth/logout`.
            Bound to the session; rotates at every login. Keep it in memory only, never in storage.
          x-phi: none
        idleExpiresAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When the session ends if there is no user activity (15 minutes idle, Q20). Only user-initiated requests
            move it; the event stream, its keep-alives and `/operations` polling do not. Screens time the 13-minute warning
            from this value, not from a browser timer.
          x-phi: none
        expiresAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: The absolute limit, 12 hours after login. It cannot be extended; screens show a notice before it so
            people can save their work.
          x-phi: none
        build:
          $ref: '#/components/schemas/BuildInfo'
          description: The API build serving this session (Q31). Shown to signed-in users only, for support and bug reports;
            never returned by /health or any public operation.
          x-phi: none
    Me:
      description: 'The current user, their clinic and their effective permissions, for building menus (inventory #6). The
        server checks every action regardless.'
      type: object
      required:
      - user
      - organization
      - permissions
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
          description: The signed-in user.
          x-phi: none
        organization:
          $ref: '#/components/schemas/SessionOrganization'
          description: The clinic.
          x-phi: none
        permissions:
          type: array
          maxItems: 300
          items:
            type: string
            maxLength: 80
          description: Effective permission names from the user's roles (`resource:action`, SECURITY_MODEL §4.2).
          x-phi: none
        practiceSettings:
          $ref: '#/components/schemas/MePracticeSettings'
          description: The practice settings screens need (D39), the same values as `GET /practice-settings`, so no extra
            permission is needed to read them.
          x-phi: none
    BreakGlassReasonCode:
      description: Why a restricted chart is opened (SECURITY_MODEL §5.2). `other` needs `reasonText`.
      type: string
      enum:
      - emergency-care
      - continuity-of-care
      - patient-request
      - other
    BreakGlassRequest:
      description: Body to open a restricted chart. `reasonText` is required when `reasonCode` is `other`, optional otherwise
        (D53).
      type: object
      additionalProperties: false
      required:
      - reasonCode
      properties:
        reasonCode:
          $ref: '#/components/schemas/BreakGlassReasonCode'
          description: The reason.
          x-phi: none
        reasonText:
          type: string
          minLength: 1
          maxLength: 500
          description: Free text explaining the reason. Required for `other`. May name people, so it is treated as patient
            data and never logged; it is recorded in the audit event and shown to the privacy officer.
          x-phi: identifier
    BreakGlassGrant:
      description: 'A break-glass grant: this user may open this patient''s chart until `expiresAt`, 4 hours (SECURITY_MODEL
        §5.2, D53). It never widens permissions; it only lifts the restriction. The compliance officer can revoke it.'
      type: object
      required:
      - id
      - patientId
      - userId
      - reasonCode
      - grantedAt
      - expiresAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Grant ID (also in the `break-glass.granted` event).
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        userId:
          $ref: ../components/schemas/Id.yaml
          description: The user it was granted to.
          x-phi: internal-id
        reasonCode:
          $ref: '#/components/schemas/BreakGlassReasonCode'
          description: The reason given.
          x-phi: none
        grantedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was granted.
          x-phi: none
        expiresAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: 'When it ends: 4 hours after `grantedAt`.'
          x-phi: none
    BuildInfo:
      description: 'Which build of the API is running, stamped by CI at image build time (Q31, issue #46). Never typed by
        hand.'
      type: object
      additionalProperties: false
      required:
      - version
      - commit
      properties:
        version:
          type: string
          maxLength: 64
          pattern: ^(dev|[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$
          description: Release version from backend/pyproject.toml, or `dev` for a local build.
          x-phi: none
          examples:
          - 0.1.0
        commit:
          type: string
          maxLength: 12
          pattern: ^(unknown|[0-9a-f]{12})$
          description: First 12 characters of the git commit the image was built from, or `unknown` for a local build.
          x-phi: none
          examples:
          - 7544a31c0d2e
    MePracticeSettings:
      description: Practice settings every signed-in user may read (D39).
      type: object
      required:
      - registration
      properties:
        registration:
          type: object
          required:
          - showSexualOrientationAndGenderIdentity
          description: Registration settings.
          x-phi: none
          properties:
            showSexualOrientationAndGenderIdentity:
              type: boolean
              description: Show the sexual-orientation and gender-identity fields on the registration screen (D39).
              x-phi: none
    RoleCode:
      description: 'A staff role code (SECURITY_MODEL §4.3): `FD` front desk, `MA` medical assistant, `RN` nurse, `MD` physician,
        `APP` advanced practice provider, `BIL` billing, `ADM` practice administrator, `CO` compliance officer, `SUP` support,
        `DSP` status board display (D47).'
      type: string
      enum:
      - FD
      - MA
      - RN
      - MD
      - APP
      - BIL
      - ADM
      - CO
      - SUP
      - DSP
    Role:
      description: A staff role and its permissions, from core's catalog.
      type: object
      required:
      - code
      - name
      - description
      - permissions
      - userCount
      properties:
        code:
          $ref: '#/components/schemas/RoleCode'
