        name:
          type: string
          maxLength: 100
          description: The role's name, as the screens show it ("Front desk").
          x-phi: none
        description:
          type: string
          maxLength: 500
          description: What the role does.
          x-phi: none
        permissions:
          type: array
          maxItems: 500
          description: The role's permissions, sorted (`resource:action`).
          x-phi: none
          items:
            type: string
            maxLength: 100
        userCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The clinic's active users holding the role.
          x-phi: none
    RoleList:
      description: Every staff role, by code.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Role'
          description: The roles on this page.
          x-phi: none
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page (ten roles fit on one page).
          x-phi: none
    User:
