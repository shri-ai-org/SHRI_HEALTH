      description: "A message from the lab or imaging center, for the demo the simulated center (`SIMULATED_PARTNERS=true`, never in production): a LabOrderStatus acknowledging an order (`received` with the center's filler order number, `rejected` or `cancelled`) or a LabResult with the report for one order (contracts/partners/lab). Verified and recorded exactly as `receiveClearinghouseMessage`, then handed to the orders module: an acknowledgement moves the order's tracking status to `received` (or `error` on `rejected`); a result files the `DiagnosticReport` and its results against the order, sets the order `completed` and its tracking status `resulted`, in one transaction. A message for an unknown or cancelled order is refused (`409`) and logged, and nothing is filed. Not for browsers, so it is left out of the generated client."
