                    resourceType: Bundle
                    type: collection
                    timestamp: '2026-11-16T17:40:00Z'
                    truncated: false
                    entry:
                    - fullUrl: urn:uuid:7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      resource:
                        resourceType: Patient
                        id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                        name:
