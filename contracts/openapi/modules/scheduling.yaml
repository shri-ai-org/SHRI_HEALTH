          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `booking-conflict`
            (the slot is taken or overlaps another appointment); `invalid-state-transition` (the appointment is not `booked`
            or `arrived`); `patient-merged` (the patient was merged into another record).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (the same
            booking rules as `POST /appointments`; or a provider, facility or location outside the user's facilities (field
            code `invalid-reference`)); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /appointments/{appointmentId}/undo-check-in:
    parameters:
    - name: appointmentId
      in: path
      required: true
      description: Appointment ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    post:
      operationId: undoCheckIn
      summary: Undo a check-in
      description: 'Reverses a check-in made by mistake (new inventory row #242; D55). Allowed only while the patient has
        not been roomed and the encounter has no clinical data (no vitals, notes or diagnoses). In one transaction: the appointment
        returns to `booked`, the encounter created at check-in becomes `entered-in-error` with the reason and its Provenance
        (D14, D24), and the visit step history keeps the record. The eligibility check already run is kept.'
      tags:
      - scheduling
      x-owner: vimal
      x-permission: appointments:undo-check-in
      x-audit:
        action: E
        category: phi-write
        patient: result
      x-storage: clinical
      x-events:
      - appointment.status-changed
      - encounter.entered-in-error
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoCheckInRequest'
            examples:
              wrong-patient:
                summary: Wrong patient checked in
                value:
                  reason: Checked in the wrong patient of the same name.
      responses:
        '200':
          description: Undone. The appointment, back to `booked`.
          headers:
            X-Request-ID: *id012
            Cache-Control: *id013
            RateLimit: *id014
            RateLimit-Policy: *id015
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                undone:
                  summary: Back to booked
                  value:
                    id: 1e2f3a4b-5c6d-4e7f-9a8b-9c0d1e2f3a4b
                    patient:
                      id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      displayName: Kuhlman72, Ramona980
                    provider:
                      id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                      displayName: Dr. Lowe58
                    facilityId: 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                    appointmentType:
                      id: 0d1e2f3a-4b5c-4d6e-8f7a-8b9c0d1e2f3a
                      code: FOLLOWUP
                      name: Follow-up visit
                    status: booked
                    startAt: '2026-11-03T15:00:00Z'
                    endAt: '2026-11-03T15:20:00Z'
                    durationMinutes: 20
                    timeZone: America/Chicago
                    reasonForVisit: Follow-up on blood pressure
                    sameDayAddOn: false
                    overbook: false
                    createdAt: '2026-11-02T16:05:00Z'
                    updatedAt: '2026-11-03T14:55:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `appointments:undo-check-in`); `csrf-check-failed` (missing
            or wrong CSRF header or Origin).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such appointment in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `invalid-state-transition` (not `checked-in`, already roomed, or the encounter has vitals, notes
            or diagnoses).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
components:
  schemas:
    AppointmentStatus:
      description: Appointment status, FHIR `AppointmentStatus` codes as used by DATA_OWNERSHIP §5.1. State changes go through
        action endpoints only.
      type: string
      enum:
      - booked
      - arrived
      - checked-in
      - fulfilled
      - cancelled
      - noshow
    VisitStatus:
      description: 'Visit step on the status board (FRS FR-SCH-02; `visit_flow_event.step`): `arrived`, `checked-in`, `roomed`,
        `with-provider`, `checked-out`.'
      type: string
      enum:
      - arrived
      - checked-in
      - roomed
      - with-provider
      - checked-out
    SchedulingPatientRef:
      description: 'The patient of an appointment: name only (minimum necessary for front-desk screens, SECURITY_MODEL §8
        rule 2).'
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Patient ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Name formatted by the server for lists.
          x-phi: identifier
        restricted:
          type: boolean
          description: 'True for a restricted chart: the appointment''s clinical text is left out unless the user holds a
            break-glass grant or is on the care team (SECURITY_MODEL §5.2).'
          x-phi: none
    SchedulingProviderRef:
      description: A provider, for display.
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Provider ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Provider name formatted for lists, e.g. "Dr. Lowe58".
          x-phi: none
    AppointmentTypeRef:
      description: An appointment type, for display.
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Appointment type ID.
          x-phi: internal-id
        code:
          type: string
          maxLength: 40
          description: Practice code.
          x-phi: none
        name:
          type: string
          maxLength: 120
          description: Name.
          x-phi: none
    Slot:
      description: A free time computed from the provider's availability rules, minus exceptions and booked appointments.
        Slots are not stored.
      type: object
      required:
      - startAt
      - endAt
      - providerId
      - facilityId
      - overbook
      properties:
        startAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Start (UTC).
          x-phi: none
        endAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: End (UTC).
          x-phi: none
        providerId:
          $ref: ../components/schemas/Id.yaml
          description: Provider.
          x-phi: internal-id
        facilityId:
          $ref: ../components/schemas/Id.yaml
          description: Facility.
          x-phi: internal-id
        locationId:
          $ref: ../components/schemas/Id.yaml
          description: Room or site, when the rule names one.
          x-phi: internal-id
        overbook:
          type: boolean
          description: True when the time is already booked and the appointment type allows overbooking (FRS FR-SCH-01).
          x-phi: none
    SlotList:
      description: One page of free slots, by start time.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Slot'
          description: The items on this page.
          x-phi: none
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
        timeZone:
          type: string
          maxLength: 64
          description: The facility's IANA time zone, for display (D40).
          x-phi: none
    Appointment:
      description: An appointment (FHIR-shaped `Appointment`). For a restricted patient seen without a break-glass grant or
        care-team membership, `reasonForVisit`, `comment`, `patientInstruction` and `cancellation.reasonText` are left out
        (SECURITY_MODEL §5.2).
      type: object
      required:
      - id
      - patient
      - provider
      - facilityId
      - appointmentType
      - status
      - startAt
      - endAt
      - durationMinutes
      - timeZone
      - createdAt
      - updatedAt
      properties:
        id: &id016
          $ref: ../components/schemas/Id.yaml
          description: Appointment ID.
          x-phi: internal-id
        patient: &id017
          $ref: '#/components/schemas/SchedulingPatientRef'
          description: The patient.
          x-phi: identifier
        provider: &id018
          $ref: '#/components/schemas/SchedulingProviderRef'
          description: The provider.
          x-phi: none
        facilityId: &id019
          $ref: ../components/schemas/Id.yaml
          description: Facility.
          x-phi: internal-id
        locationId:
          $ref: ../components/schemas/Id.yaml
          description: Room or site, if set.
          x-phi: internal-id
        appointmentType: &id020
          $ref: '#/components/schemas/AppointmentTypeRef'
          description: Appointment type.
          x-phi: none
        status: &id021
          $ref: '#/components/schemas/AppointmentStatus'
          description: Appointment status.
          x-phi: none
        visitStatus: &id022
          $ref: '#/components/schemas/VisitStatus'
          description: Latest visit step, once the patient has arrived.
          x-phi: none
        startAt: &id023
          $ref: ../components/schemas/Timestamp.yaml
          description: Start (UTC).
          x-phi: identifier
        endAt: &id024
          $ref: ../components/schemas/Timestamp.yaml
          description: End (UTC).
          x-phi: identifier
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 480
          description: Length in minutes.
          x-phi: none
        timeZone:
          type: string
          maxLength: 64
          description: The facility's IANA time zone, for display (D40).
          x-phi: none
        reasonForVisit: &id025
          type: string
          maxLength: 1000
          description: Scheduled reason for the visit, as the patient gave it.
          x-phi: clinical
        sameDayAddOn: &id026
          type: boolean
          description: Booked as a same-day add-on (the U.S. walk-in; FRS FR-SCH-02).
          x-phi: none
        overbook: &id027
          type: boolean
          description: Booked over another appointment, as the appointment type allows.
          x-phi: none
        comment:
          type: string
          maxLength: 2000
          description: Staff note.
          x-phi: clinical
        patientInstruction:
          type: string
          maxLength: 2000
          description: Instructions for the patient, e.g. "Arrive 15 minutes early."
          x-phi: clinical
        cancellation:
          description: Present when cancelled.
          type: object
          required:
          - reasonCode
          - cancelledAt
          properties:
            reasonCode:
              type: string
              maxLength: 64
              description: Reason code.
              x-phi: none
            reasonText:
              type: string
              maxLength: 500
              description: Reason text.
              x-phi: clinical
            cancelledAt:
              $ref: ../components/schemas/Timestamp.yaml
              description: When.
              x-phi: none
          x-phi: clinical
        rescheduledFromId:
          $ref: ../components/schemas/Id.yaml
          description: The appointment this one replaced, when it was rescheduled as a new booking.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter created at check-in.
          x-phi: internal-id
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was booked.
          x-phi: none
        updatedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Last change.
          x-phi: none
        followUp:
          $ref: '#/components/schemas/FollowUpSummary'
          description: The follow-up the clinician asked for in this visit, if any (D98).
          x-phi: clinical
    AppointmentSummary:
      description: An appointment in day and week views. `reasonForVisit` is left out for a restricted patient, as in `Appointment`.
      type: object
      required:
      - id
      - patient
      - provider
      - facilityId
      - appointmentType
      - status
      - startAt
      - endAt
      properties:
        id: *id016
        patient: *id017
        provider: *id018
        facilityId: *id019
        appointmentType: *id020
        status: *id021
        visitStatus: *id022
        startAt: *id023
        endAt: *id024
        reasonForVisit: *id025
        sameDayAddOn: *id026
        overbook: *id027
    AppointmentList:
      description: One page of appointments, by start time.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AppointmentSummary'
          description: The items on this page.
          x-phi: identifier
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
        timeZone:
          type: string
          maxLength: 64
          description: The facility's IANA time zone, when `facilityId` was given (D40).
          x-phi: none
    AppointmentCreate:
      description: Body to book an appointment.
      type: object
      additionalProperties: false
      required:
      - patientId
      - providerId
      - facilityId
      - appointmentTypeId
      - startAt
      properties:
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
