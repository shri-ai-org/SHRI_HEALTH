        comment:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Staff note. Send `null` to clear it.
          x-phi: clinical
        patientInstruction:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Instructions for the patient. Send `null` to clear it.
          x-phi: clinical
