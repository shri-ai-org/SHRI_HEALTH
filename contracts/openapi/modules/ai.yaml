  /ai/suggestions/{suggestionId}/decision:
    parameters:
    - name: suggestionId
      in: path
      required: true
      description: AI suggestion ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    post:
      operationId: decideAiSuggestion
      summary: Accept, edit or reject an AI suggestion
      description: 'Records the clinician''s one decision on one suggestion (inventory #113; FRS §3.4 traceability; D70):
        who, when and what, recorded once (the database refuses a second decision). **A note section** (AI-01): only the note''s
        author decides, while the note is a draft. Text changes only through `PATCH /notes/{noteId}`, never here, so this
        call never changes the note: `accepted` means the section''s text is still the AI text; `edited` means the author
        changed it, and the section''s text at this moment is recorded as the edited content; `rejected` needs a `reason`,
        and the AI text must already be gone from the section (cleared or rewritten), so rejected AI text is never signed.
        **A chart summary** (AI-02): only the user who requested the summary decides, `accepted` or `rejected` (a summary
        is not edited). Not gated by the AI switches: a draft with undecided sections can always be finished and signed after
        AI is turned off.'
