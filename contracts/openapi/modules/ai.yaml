      summary: Get the AI settings
      description: 'The clinic''s AI switches (inventory #114; FRS §3.4 kill switch, §3.10): the clinic-wide switch and one
        switch per feature. A feature works only when both are on. Only this batch''s features are listed (`ambient-documentation`
        for AI-01, `chart-summary` for AI-02); later batches add theirs (D68). A feature never set is off. The `ETag` is what
        `PUT` sends as `If-Match`.'
