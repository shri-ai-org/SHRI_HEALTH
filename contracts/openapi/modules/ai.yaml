# Shri Health API — module `ai`
# x-owner: vimal  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Encounter audio, transcriptions, note drafts, chart summaries, AI decisions, AI settings (`backend/app/modules/ai/`)
# Contract batch 7 (inventory B7), 2026-11-02: rows #107-115, AI-01 and AI-02 only (FRS §3.4). AI-03 and AI-04 are P1 and not
# here (D68). Shapes follow D70: a confidence band (`low`, `medium`, `high`), one accept, edit or reject decision per suggestion,
# source links with `no-source` and `conflicting` markers, and a transcript of timed, speaker-labeled segments. Minalini's
# Stage 3 AI design is not in the repository, so these are the smallest shapes that meet D70 (PR description).
# AI output only ever becomes a draft or a reviewable summary: nothing here signs, prescribes, orders or changes a verified record
# (FRS §3.4). The gateway sends only the fields a task declares, logs metadata only (never patient text), validates the output
# against the versioned prompt's schema, and reads chart data for AI-02 only with a per-task delegated token (SECURITY_MODEL §2.4).
paths:
  /encounters/{encounterId}/audio:
    parameters:
    - name: encounterId
      in: path
      required: true
      description: Encounter ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    post:
      operationId: createEncounterAudio
      summary: Register an encounter recording
      description: 'Registers a recording for AI-01 (inventory #107; FRS §3.4): ambient audio, dictation, or audio recorded
        outside the application and uploaded. The audio never passes through this endpoint: the screen uploads it in chunks
        through the file service (`POST /files/upload-url` with purpose `encounter-audio`, the `PUT`, then `POST /files/{fileId}/complete`
        for each chunk; API_STANDARDS §15), then sends the chunks'' file IDs here in order. Every chunk must be `clean`, of
        purpose `encounter-audio`, uploaded by the same user and not attached to anything else. The patient must have an active
        `ambient-recording` consent with decision `permit` (the database refuses the row otherwise); the server finds it and
        records which one was used. Allowed while the encounter is `arrived`, `triaged`, `in-progress` or `finished`. Returns
        `201` without a `Location`: a recording has no single-read endpoint; its transcript is read through `GET /ai/transcriptions/{transcriptionId}`.
        Refused with `409 feature-disabled` while AI or `ambient-documentation` is off for the clinic.'
      tags:
      - ai
      x-owner: vimal
      x-permission: encounter-audio:create
      x-audit:
        action: C
        category: ai
        patient: result
      x-idempotency: supported
      x-storage: files
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioRecordingCreate'
            examples:
              ambient:
                summary: Ambient recording in two chunks
                value:
                  mode: ambient
                  fileIds:
                  - 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f
                  - 0d1e2f3a-4b5c-4d6e-9f7a-8b9c0d1e2f3a
                  durationSeconds: 912
      responses:
        '201':
          description: Created. The recording, ready to transcribe.
          headers:
            X-Request-ID: &id001
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control: &id002
              $ref: ../components/headers/CacheControl.yaml
            RateLimit: &id003
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy: &id004
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRecording'
              examples:
                registered:
                  summary: Registered
                  value:
                    id: 8b9c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
                    encounterId: 5d6e7f8a-9b0c-4d1e-8f2a-3b4c5d6e7f8a
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    mode: ambient
                    consentId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                    fileIds:
                    - 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f
                    - 0d1e2f3a-4b5c-4d6e-9f7a-8b9c0d1e2f3a
                    durationSeconds: 912
                    status: uploaded
                    createdAt: '2026-11-03T15:31:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `encounter-audio:create`); `csrf-check-failed` (missing or
            wrong CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no
            break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such encounter in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `feature-disabled`
            (AI or `ambient-documentation` is off for the clinic; the problem carries `feature`); `consent-required` (the
            patient has no active `ambient-recording` consent; the problem carries `consentType`); `invalid-state-transition`
            (not allowed in the current state (DATA_OWNERSHIP §5.2); the problem carries `currentState`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `file-not-ready` (a chunk is not
            scanned clean, has another purpose, was uploaded by someone else, is already attached, or is from another clinic;
            the problem carries `fileId`); `business-rule-violation` (the same file twice (field code `conflicting-fields`));
            `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /ai/transcriptions:
    post:
      operationId: createTranscription
      summary: Transcribe a recording
      description: 'Starts speech-to-text for a registered recording (inventory #108; AI-01). Returns `202` and an operation
        of kind `ai.transcription`; its result is the transcription (`GET /ai/transcriptions/{transcriptionId}`). The original
        transcript is kept unchanged; clinician edits belong in the note. A recording is transcribed once: a second request
        while one runs or after it succeeded is `409`. The operation fails with `ai-unavailable` when the speech service is
        down, and can be cancelled while it runs. Refused with `409 feature-disabled` while AI or `ambient-documentation`
        is off for the clinic.'
      tags:
      - ai
      x-owner: vimal
      x-permission: transcriptions:create
      x-audit:
        action: C
        category: ai
        patient: result
      x-idempotency: supported
      x-async: true
      x-storage: admin
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionCreate'
            examples:
              recording:
                summary: Transcribe a recording
                value:
                  audioRecordingId: 8b9c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
      responses:
        '202':
          description: 202. Accepted; runs in the background. Poll `Location` after `Retry-After` seconds, or wait for `operation.completed`
            on the event stream (API_STANDARDS §13).
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            Retry-After:
              $ref: ../components/headers/RetryAfter.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: ../components/schemas/Operation.yaml
              examples:
                queued:
                  summary: Transcription queued
                  value:
                    id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                    kind: ai.transcription
                    status: queued
                    createdAt: '2026-11-03T15:31:05Z'
                    updatedAt: '2026-11-03T15:31:05Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `transcriptions:create`); `csrf-check-failed` (missing or
            wrong CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no
            break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such recording in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `feature-disabled`
            (AI or `ambient-documentation` is off for the clinic; the problem carries `feature`); `invalid-state-transition`
            (the recording is already being transcribed, was transcribed, or was purged; the problem carries `currentState`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `idempotency-key-reused` (the Idempotency-Key
            was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /ai/transcriptions/{transcriptionId}:
    parameters:
    - name: transcriptionId
      in: path
      required: true
      description: Transcription ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: getTranscription
      summary: Get a transcription
      description: 'The transcript of a recording, as timed, speaker-labeled segments (inventory #109; AI-01; D70), so the
        clinician can review the source of a draft. Note-draft source links point at these segments. Still readable when AI
        is switched off. A restricted patient needs break-glass or care-team membership.'
      tags:
      - ai
      x-owner: vimal
      x-permission: transcriptions:read
      x-audit:
        action: R
        category: phi-read
        patient: result
      x-storage: admin
      x-release: P0
      responses:
        '200':
          description: The transcription.
          headers:
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
              examples:
                visit:
                  summary: Start of a visit transcript
                  value:
                    id: 1e2f3a4b-5c6d-4e7f-8a9b-0c1d2e3f4a5b
                    audioRecordingId: 8b9c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
                    encounterId: 5d6e7f8a-9b0c-4d1e-8f2a-3b4c5d6e7f8a
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    language: en-US
                    segments:
                    - sequence: 1
                      startMs: 0
                      endMs: 4200
                      speaker: clinician
                      text: What brings you in today?
                      confidence: high
                    - sequence: 2
                      startMs: 4200
                      endMs: 9800
                      speaker: patient
                      text: My blood pressure readings at home have been high this month.
                      confidence: high
                    - sequence: 3
                      startMs: 9800
                      endMs: 13100
                      speaker: unknown
                      text: About one fifty over ninety most mornings.
                      confidence: medium
                    generatedBy:
                      modelName: faster-whisper-large-v3
                      modelVersion: 1.1.1
                      pipelineVersion: ai-01.2026-11
                    createdAt: '2026-11-03T15:33:40Z'
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `transcriptions:read`); `break-glass-required` (the patient's
            chart is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such transcription in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /ai/note-drafts:
    post:
      operationId: createNoteDraft
      summary: Draft a note from a transcript or from dictated text
      description: 'AI-01 (inventory #110; FRS §3.4; VD-G11): turns a visit into a **draft** note on its encounter, from a
        note template. The visit comes either from a transcription (`transcriptionId`) or as text the clinician dictated or
        typed on the consultation screen (`encounterId` with `dictation`); send exactly one of the two. The dictated text
        is used for this draft only and is not stored: the request record keeps its hash. Returns `202` and an operation of
        kind `ai.note-draft`; its result is the draft note (`GET /notes/{noteId}`), made through the same notes service as
        `POST /encounters/{encounterId}/notes`, with the caller as author. The gateway sends only the visit text, the template''s
        sections and what the caller may read of the patient''s allergies, medications and diagnoses, checks the output against
        the prompt''s schema, and drops anything outside it; a section the visit says nothing about stays empty (unknown stays
        unknown). Each filled section has `entrySource: ai-generated`, `aiDecision: pending` and its `aiSuggestion` (confidence
        band, rationale, and links to the transcript segments it came from; a draft from dictation has no segments, so its
        sections are `no-source`). The note cannot be signed until every AI section is accepted, edited or rejected (`POST
        /ai/suggestions/{suggestionId}/decision`); AI never signs. Allowed while the encounter is `arrived`, `triaged` or
        `in-progress`, which then moves to `in-progress`. The operation fails with `ai-unavailable` (the model is down, declined,
        or the monthly AI budget is used up) or `ai-output-rejected` (the output failed validation), and can be cancelled
        while it runs. Refused with `409 feature-disabled` while AI or `ambient-documentation` is off for the clinic.'
      tags:
      - ai
      x-owner: vimal
      x-permission: note-drafts:create
      x-audit:
        action: C
        category: ai
        patient: result
      x-idempotency: supported
      x-async: true
      x-storage: clinical
      x-events:
      - encounter.status-changed
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteDraftCreate'
            examples:
              progress:
                summary: Progress note from the visit transcript
                value:
                  transcriptionId: 1e2f3a4b-5c6d-4e7f-8a9b-0c1d2e3f4a5b
                  templateId: 1d2e3f4a-5b6c-4d7e-8f8a-9b0c1d2e3f4a
              dictation:
                summary: Progress note from the clinician's dictation
                value:
                  encounterId: 5d6e7f8a-9b0c-4d1e-8f2a-3b4c5d6e7f8a
                  dictation: "Follow-up for high blood pressure. Home readings around 150 over 95 for two weeks. No chest pain, no headache. Taking lisinopril 10 milligrams daily without missing doses. Plan: increase lisinopril to 20 milligrams daily and recheck in two weeks."
                  templateId: 1d2e3f4a-5b6c-4d7e-8f8a-9b0c1d2e3f4a
      responses:
        '202':
          description: 202. Accepted; runs in the background. Poll `Location` after `Retry-After` seconds, or wait for `operation.completed`
            on the event stream (API_STANDARDS §13).
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            Retry-After:
              $ref: ../components/headers/RetryAfter.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: ../components/schemas/Operation.yaml
              examples:
                queued:
                  summary: Draft queued
                  value:
                    id: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
                    kind: ai.note-draft
                    status: queued
                    createdAt: '2026-11-03T15:34:00Z'
                    updatedAt: '2026-11-03T15:34:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `note-drafts:create`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no break-glass
            grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such transcription or encounter in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `feature-disabled`
            (AI or `ambient-documentation` is off for the clinic; the problem carries `feature`); `invalid-state-transition`
            (not allowed in the current state (DATA_OWNERSHIP §5.2); the problem carries `currentState`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (a template
            that is inactive or another user's personal template (field code `invalid-reference`); neither `transcriptionId`
            nor `dictation` (field code `required`); both of them, or `dictation` without `encounterId`, or `encounterId`
            with `transcriptionId` (field code `conflicting-fields`)); `idempotency-key-reused` (the Idempotency-Key was used
            with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /ai/chart-summaries:
    post:
      operationId: createChartSummary
      summary: Summarize a patient's chart
      description: 'AI-02 (inventory #111; FRS §3.4): summarizes prior encounters, diagnoses, medications, allergies, results
        and outstanding issues. Returns `202` and an operation of kind `ai.chart-summary`; its result is the summary (`GET
        /ai/chart-summaries/{chartSummaryId}`). The gateway runs inside the API and reads the chart through each module''s
        own service, within the caller''s request: the same permissions, facility scope and restricted-chart check as the
        caller''s own reads, audited as `ai`; a part the caller may not read is left out and listed in `missing`. The model
        never reads the database. (A delegated token, SECURITY_MODEL §2.4, applies once AI runs as a separate service.) Entered-in-error
        records are left out (D24). Every statement carries its source links or a `no-source` or `conflicting` marker, and
        what could not be found is listed in `missing` (D70). The summary is for reading: it never changes the chart. The
        operation fails with `ai-unavailable` or `ai-output-rejected`, and can be cancelled while it runs. Refused with `409
        feature-disabled` while AI or `chart-summary` is off for the clinic.'
      tags:
      - ai
      x-owner: vimal
      x-permission: chart-summaries:create
      x-audit:
        action: C
        category: ai
        patient: body:/patientId
      x-idempotency: supported
      x-async: true
      x-storage: admin
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartSummaryCreate'
            examples:
              visit:
                summary: Summary for today's visit
                value:
                  patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  encounterId: 5d6e7f8a-9b0c-4d1e-8f2a-3b4c5d6e7f8a
      responses:
        '202':
          description: 202. Accepted; runs in the background. Poll `Location` after `Retry-After` seconds, or wait for `operation.completed`
            on the event stream (API_STANDARDS §13).
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            Retry-After:
              $ref: ../components/headers/RetryAfter.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: ../components/schemas/Operation.yaml
              examples:
                queued:
                  summary: Summary queued
                  value:
                    id: 8c9d0e1f-2a3b-4c4d-8e5f-6a7b8c9d0e1f
                    kind: ai.chart-summary
                    status: queued
                    createdAt: '2026-11-03T15:12:00Z'
                    updatedAt: '2026-11-03T15:12:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `chart-summaries:create`); `csrf-check-failed` (missing or
            wrong CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no
            break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient or encounter in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `feature-disabled`
            (AI or `chart-summary` is off for the clinic; the problem carries `feature`); `patient-merged` (the patient was
            merged into another record).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (the encounter
            belongs to another patient (field code `invalid-reference`)); `idempotency-key-reused` (the Idempotency-Key was
            used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /ai/chart-summaries/{chartSummaryId}:
    parameters:
    - name: chartSummaryId
      in: path
      required: true
      description: Chart summary ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: getChartSummary
      summary: Get a chart summary
      description: 'The result of `POST /ai/chart-summaries` (inventory #112; AI-02; D70): statements by topic, each with
        a confidence band and links to the records behind it, or a `no-source` or `conflicting` marker; what could not be
        found; and the summary''s suggestion, with its decision. Labeled as AI output on every screen (FRS §3.4). Readable
        by **its requester only**, who must still be able to read the chart (a restricted patient needs break-glass or care-team
        membership): the summary was built from the requester''s own view of the chart (facilities and read permissions),
        so a colleague asks for their own. Still readable when AI is switched off.'
