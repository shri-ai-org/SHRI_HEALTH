  schemas:
    ClinicianRef:
      description: A clinician or staff member, for display.
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Practitioner ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Name as shown on screens (staff, not patient data).
          x-phi: none
    AiFeature:
      description: 'An AI feature with its own switch (FRS §3.4): `ambient-documentation` (AI-01: audio, transcript, note
        draft) and `chart-summary` (AI-02). An extensible enum (API_STANDARDS §6.5): the P1 batches add their features (D68),
        so screens show an unknown value as it is.'
      type: string
      maxLength: 64
      x-extensible-enum:
      - ambient-documentation
      - chart-summary
    AiConfidence:
      description: 'The qualitative confidence band every AI output carries (FRS §3.4; D70): `high`, `medium` or `low`. Never
        a number.'
      type: string
      enum:
      - low
      - medium
      - high
    AiDecision:
      description: 'The clinician''s decision on a suggestion (D70): `pending` until decided, then `accepted`, `edited` or
        `rejected`, recorded once.'
      type: string
      enum:
      - pending
      - accepted
      - edited
      - rejected
    AiSourceStatus:
      description: 'How a statement is supported (D70): `sourced` (by the linked records or transcript segments), `no-source`
        (nothing in the chart or transcript supports it, for example a statement that something was not found; it links nothing),
        `conflicting` (the linked sources disagree; at least two are linked).'
      type: string
      enum:
      - sourced
      - no-source
      - conflicting
    AiSourceLink:
      description: 'A link from AI output to what it came from (FRS §3.4; D70): a chart record (FHIR resource type and our
        ID), or a transcript segment (`Transcription` with `segment`). Screens open the record through its own endpoint, with
        its own permission and restricted-chart rules (D37).'
      type: object
      required:
      - resourceType
      - resourceId
      properties:
        resourceType:
          type: string
          pattern: ^[A-Z][A-Za-z]{2,63}$
          maxLength: 64
          description: 'What is linked: a FHIR resource type (`Encounter`, `Condition`, `MedicationRequest`, `AllergyIntolerance`,
            `Observation`, `DiagnosticReport`, `Procedure`, `Composition`), or `Transcription`.'
          x-phi: none
        resourceId:
          $ref: ../components/schemas/Id.yaml
          description: The record's ID, or the transcription's.
          x-phi: internal-id
        segment:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: 'For `Transcription`: the segment''s `sequence`.'
          x-phi: none
        label:
          type: string
          maxLength: 200
          description: What to show for the link, for example "Problem list entry".
          x-phi: clinical
        excerpt:
          type: string
          maxLength: 1000
          description: The words in the source that support the output.
          x-phi: clinical
    AiGeneratedBy:
      description: 'Which model, prompt version and pipeline produced the output (FRS §3.4 AI provenance; versioned prompts,
        VG Step 7). Metadata only.'
      type: object
      required:
      - modelName
      - pipelineVersion
      properties:
        modelName:
          type: string
          maxLength: 120
          description: Model name.
          x-phi: none
        modelVersion:
          type: string
          maxLength: 80
          description: Model version.
          x-phi: none
        promptCode:
          type: string
          maxLength: 80
          description: The versioned prompt used. Absent for speech-to-text.
          x-phi: none
        promptVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The prompt's version. Absent for speech-to-text.
          x-phi: none
        pipelineVersion:
          type: string
          maxLength: 40
          description: Version of the AI pipeline (gateway, validation and post-processing).
          x-phi: none
    AiSuggestion:
      description: 'One piece of AI output a clinician reviews (FRS §3.4; D70): labeled as AI, with a confidence band, a rationale,
        source links and what the model could not determine, and one recorded decision. A suggestion is either one drafted
        note section (AI-01) or one chart summary (AI-02, whose statements and their sources are in the summary). Its content
        never changes after it is made.'
      type: object
      required:
      - id
      - feature
      - targetType
      - targetId
      - patientId
      - confidence
      - rationale
      - decision
      - generatedBy
      - createdAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Suggestion ID.
          x-phi: internal-id
        feature:
          $ref: '#/components/schemas/AiFeature'
          description: The feature that made it.
          x-phi: none
        targetType:
          type: string
          enum:
          - note-section
          - chart-summary
          description: What it is.
          x-phi: none
        targetId:
          $ref: ../components/schemas/Id.yaml
          description: The note section's ID, or the chart summary's.
          x-phi: internal-id
        noteId:
          $ref: ../components/schemas/Id.yaml
          description: 'For `note-section`: the draft note.'
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter, when there is one.
          x-phi: internal-id
        confidence:
          $ref: '#/components/schemas/AiConfidence'
          description: Confidence band.
          x-phi: none
        rationale:
          type: string
          maxLength: 2000
          description: Why the model produced this, in a sentence or two.
          x-phi: clinical
        suggestedText:
          type: string
          maxLength: 50000
          description: 'For `note-section`: the AI text as drafted, kept unchanged so screens can show what the author changed.'
          x-phi: clinical
        sourceStatus:
          $ref: '#/components/schemas/AiSourceStatus'
          description: 'For `note-section`: how the text is supported by the transcript.'
          x-phi: none
        sources:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AiSourceLink'
          description: 'For `note-section`: the transcript segments the text came from.'
          x-phi: clinical
        unknowns:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 500
          description: Facts the model could not determine; left unknown, never invented (FRS §3.4).
          x-phi: clinical
        decision:
          $ref: '#/components/schemas/AiDecision'
          description: The clinician's decision.
          x-phi: none
        decidedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was decided. Absent while `pending`.
          x-phi: none
        decidedBy:
          $ref: '#/components/schemas/ClinicianRef'
          description: Who decided. Absent while `pending`.
          x-phi: none
        rejectionReason:
          type: string
          maxLength: 500
          description: Why it was rejected. Only for `rejected`.
          x-phi: clinical
        generatedBy:
          $ref: '#/components/schemas/AiGeneratedBy'
          description: Model, prompt and pipeline versions.
          x-phi: none
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was made.
          x-phi: none
    AiSuggestionDecision:
      description: 'Body to decide a suggestion (inventory #113). The edited text is never sent here: it is the note section''s
        text, saved through `PATCH /notes/{noteId}`.'
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - accepted
          - edited
          - rejected
          description: 'The decision: `edited` only for a note section.'
          x-phi: none
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why it was rejected. Required for `rejected`; not allowed otherwise.
          x-phi: clinical
    AudioRecordingCreate:
      description: 'Body to register a recording (inventory #107). The chunks were uploaded through the file service, in order.'
      type: object
      additionalProperties: false
      required:
      - mode
      - fileIds
      properties:
        mode:
          type: string
          enum:
          - ambient
          - dictation
          - upload
          description: '`ambient` (the visit conversation), `dictation` (the clinician alone), or `upload` (recorded outside
            the application; same consent and retention rules, FRS AI-01).'
          x-phi: none
        fileIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: ../components/schemas/Id.yaml
          description: The audio chunks, in playing order; each a clean `encounter-audio` file.
          x-phi: internal-id
        durationSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 14400
          description: Total length, as the recorder measured it.
          x-phi: none
    AudioRecording:
      description: A registered recording (inventory #107). The audio itself stays in the file service.
      type: object
      required:
      - id
      - encounterId
      - patientId
      - mode
      - consentId
      - fileIds
      - status
      - createdAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Recording ID.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter.
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        mode:
          type: string
          enum:
          - ambient
          - dictation
          - upload
          description: How it was recorded.
          x-phi: none
        consentId:
          $ref: ../components/schemas/Id.yaml
          description: The patient's `ambient-recording` consent it was recorded under.
          x-phi: internal-id
        fileIds:
          type: array
          maxItems: 200
          items:
            $ref: ../components/schemas/Id.yaml
          description: The audio chunks, in order.
          x-phi: internal-id
        durationSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 14400
          description: Total length.
          x-phi: none
        status:
          type: string
          enum:
          - uploaded
          - transcribing
          - transcribed
          - failed
          - purged
          description: '`uploaded`, `transcribing`, `transcribed`, `failed`, or `purged` (the audio was removed at the end
            of its retention period; the transcript stays).'
          x-phi: none
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was registered.
          x-phi: none
    TranscriptionCreate:
      description: 'Body to transcribe a recording (inventory #108).'
      type: object
      additionalProperties: false
      required:
      - audioRecordingId
      properties:
        audioRecordingId:
          $ref: ../components/schemas/Id.yaml
          description: The recording.
          x-phi: internal-id
        language:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
          maxLength: 20
          default: en-US
          description: Spoken language, a BCP 47 tag.
          x-phi: none
    TranscriptSegment:
      description: 'One stretch of speech (D70): who spoke, when, and what was said.'
      type: object
      required:
      - sequence
      - startMs
      - endMs
      - speaker
      - text
      properties:
        sequence:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: Order in the transcript, from 1; what source links point at.
          x-phi: none
        startMs:
          type: integer
          format: int32
          minimum: 0
          maximum: 14400000
          description: Start, in milliseconds from the start of the recording.
          x-phi: none
        endMs:
          type: integer
          format: int32
          minimum: 0
          maximum: 14400000
          description: End, in milliseconds from the start of the recording.
          x-phi: none
        speaker:
          type: string
          enum:
          - clinician
          - patient
          - other
          - unknown
          description: Who spoke, as far as the speech service could tell; `unknown` when it could not.
          x-phi: none
        text:
          type: string
          maxLength: 5000
          description: What was said.
          x-phi: clinical
        confidence:
          $ref: '#/components/schemas/AiConfidence'
          description: How sure the speech service is of the words, so screens can mark doubtful passages.
          x-phi: none
    Transcription:
      description: 'The transcript of a recording (inventory #109; D70): the original, never edited.'
      type: object
      required:
      - id
      - audioRecordingId
      - encounterId
      - patientId
      - language
      - segments
      - generatedBy
      - createdAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Transcription ID.
          x-phi: internal-id
        audioRecordingId:
          $ref: ../components/schemas/Id.yaml
          description: The recording.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter.
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        language:
          type: string
          maxLength: 20
          description: Spoken language, a BCP 47 tag.
          x-phi: none
        segments:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/TranscriptSegment'
          description: The segments, in order.
          x-phi: clinical
        generatedBy:
          $ref: '#/components/schemas/AiGeneratedBy'
          description: Speech model and pipeline versions.
          x-phi: none
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was made.
          x-phi: none
    NoteDraftCreate:
      description: 'Body to draft a note (inventory #110), from a transcription or from dictated text. Send exactly one: `transcriptionId`,
        or `encounterId` with `dictation`.'
      type: object
      additionalProperties: false
      required:
      - templateId
      properties:
        transcriptionId:
          $ref: ../components/schemas/Id.yaml
          description: The transcription; the draft goes on its encounter. Not with `encounterId` or `dictation`.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The visit the dictation belongs to; the draft goes on it. Required with `dictation`.
          x-phi: internal-id
        dictation:
          type: string
          minLength: 1
          maxLength: 20000
          description: The visit as the clinician dictated or typed it on the consultation screen. Used for this draft only;
            never stored or logged.
          x-phi: clinical
        templateId:
          $ref: ../components/schemas/Id.yaml
          description: A practice or personal note template (`/note-templates`); the model fills its sections.
          x-phi: internal-id
    ChartSummaryCreate:
      description: 'Body to summarize a chart (inventory #111).'
      type: object
      additionalProperties: false
      required:
      - patientId
      properties:
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The visit it is for, when there is one; its reason for visit focuses the summary.
          x-phi: internal-id
    ChartSummaryTopic:
      description: 'A part of the summary (FRS AI-02): prior encounters, diagnoses, medications, allergies, results, outstanding
        issues.'
      type: string
      enum:
      - encounters
      - diagnoses
      - medications
      - allergies
      - results
      - outstanding-issues
    ChartSummaryStatement:
      description: 'One statement in the summary (D70), with its confidence band and its sources, or a `no-source` or `conflicting`
        marker.'
      type: object
      required:
      - sequence
      - text
      - confidence
      - sourceStatus
      - sources
      properties:
        sequence:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Order in the summary, from 1.
          x-phi: none
        text:
          type: string
          maxLength: 2000
          description: The statement.
          x-phi: clinical
        confidence:
          $ref: '#/components/schemas/AiConfidence'
          description: Confidence band.
          x-phi: none
        sourceStatus:
          $ref: '#/components/schemas/AiSourceStatus'
          description: '`sourced`, `no-source` (no links) or `conflicting` (at least two links that disagree).'
          x-phi: none
        sources:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AiSourceLink'
          description: The records behind it. Empty for `no-source`.
          x-phi: clinical
    ChartSummarySection:
      description: The statements on one topic.
      type: object
      required:
      - topic
      - statements
      properties:
        topic:
          $ref: '#/components/schemas/ChartSummaryTopic'
          description: The topic.
          x-phi: none
        statements:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ChartSummaryStatement'
          description: Its statements, in order.
          x-phi: clinical
    ChartSummaryGap:
      description: Something the summary could not find or determine (FRS AI-02; unknown stays unknown).
      type: object
      required:
      - topic
      - description
      properties:
        topic:
          $ref: '#/components/schemas/ChartSummaryTopic'
          description: The topic.
          x-phi: none
        description:
          type: string
          maxLength: 500
          description: What is missing.
          x-phi: clinical
    ChartSummary:
      description: 'An AI chart summary (inventory #112; AI-02; D70). Read-only and never part of the chart.'
      type: object
      required:
      - id
      - patientId
      - sections
      - missing
      - suggestion
      - createdAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Chart summary ID.
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The visit it was made for, when there is one.
          x-phi: internal-id
        sections:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ChartSummarySection'
          description: One per topic that has statements, in the topic order.
          x-phi: clinical
        missing:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ChartSummaryGap'
          description: What could not be found or determined. Empty when nothing is missing.
          x-phi: clinical
        suggestion:
          $ref: '#/components/schemas/AiSuggestion'
          description: 'The summary as a suggestion: overall confidence band, rationale, model and prompt versions, and the
            clinician''s decision.'
          x-phi: clinical
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was made.
          x-phi: none
    AiFeatureSetting:
      description: One feature's switch.
      type: object
      required:
      - feature
      - enabled
      properties:
        feature:
          $ref: '#/components/schemas/AiFeature'
          description: The feature.
          x-phi: none
        enabled:
          type: boolean
          description: On or off for the clinic. Works only while `clinicEnabled` is also on.
          x-phi: none
        reason:
          type: string
          maxLength: 500
          description: Why it was turned off. Present while off, unless it was never set.
          x-phi: none
        updatedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Last change. Absent if never set.
          x-phi: none
    AiSettings:
      description: 'The clinic''s AI switches (inventory #114): the clinic-wide kill switch and one switch per feature (FRS
        §3.4). Settings, not patient data.'
      type: object
      required:
      - clinicEnabled
      - features
      properties:
        clinicEnabled:
          type: boolean
          description: The clinic-wide switch. Off turns every AI feature off at once.
          x-phi: none
        features:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AiFeatureSetting'
          description: One per feature.
          x-phi: none
    AiFeatureSettingUpdate:
      description: One feature's new setting.
      type: object
      additionalProperties: false
      required:
      - feature
      - enabled
      properties:
        feature:
          type: string
          enum:
          - ambient-documentation
          - chart-summary
          description: The feature.
          x-phi: none
        enabled:
          type: boolean
          description: On or off.
          x-phi: none
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why it is turned off. Required when `enabled` is false; not allowed otherwise.
          x-phi: none
    AiSettingsUpdate:
      description: 'Body to change the AI settings (inventory #115). Features left out keep their setting.'
      type: object
      additionalProperties: false
      required:
      - clinicEnabled
      properties:
        clinicEnabled:
          type: boolean
          description: The clinic-wide switch.
          x-phi: none
        features:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AiFeatureSettingUpdate'
          description: The features to set, each at most once.
          x-phi: none
    ChartQuestionPageType:
      description: The page the AI bubble is on; it picks the suggested questions and frames the answer.
      type: string
      enum:
      - consultation
      - prescribing
      - check-out
      - chart
      - front-desk
    ChartQuestionCreate:
      description: A question about one patient's chart, from a page.
      type: object
      additionalProperties: false
      required:
      - question
      - pageType
      - patientId
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
          description: The question, in plain words. Never logged.
          x-phi: clinical
        pageType:
          $ref: "#/components/schemas/ChartQuestionPageType"
          description: The page it is asked from.
          x-phi: none
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The visit, when the page is about one.
          x-phi: internal-id
    ChartAnswerStatement:
      description: One statement of an answer, with the records it rests on (at least one).
      type: object
      required:
      - sequence
      - text
      - sources
      properties:
        sequence:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Order in the answer, from 1.
          x-phi: none
        text:
          type: string
          maxLength: 2000
          description: The statement.
          x-phi: clinical
        sources:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AiSourceLink"
          description: The records behind it.
          x-phi: clinical
    ChartAnswer:
      description: An AI answer to a chart question. Read-only, never part of the chart; readable by its requester only.
      type: object
      required:
      - id
      - patientId
      - pageType
      - question
      - statements
      - insufficientEvidence
      - aiGenerated
      - generatedBy
      - createdAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Chart answer ID.
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The visit, when there was one.
          x-phi: internal-id
        pageType:
          $ref: "#/components/schemas/ChartQuestionPageType"
          description: The page it was asked from.
          x-phi: none
        question:
          type: string
          maxLength: 1000
          description: The question as asked.
          x-phi: clinical
        statements:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChartAnswerStatement"
          description: The answer, in order. Empty when the chart does not answer the question.
          x-phi: clinical
        insufficientEvidence:
          type: boolean
          description: True when the records do not fully answer the question; the screen says "not in the chart".
          x-phi: none
        aiGenerated:
          type: boolean
          const: true
          description: "Always true: label the answer as AI output."
          x-phi: none
        generatedBy:
          $ref: "#/components/schemas/AiGeneratedBy"
          description: Model, prompt and pipeline versions.
          x-phi: none
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was made.
          x-phi: none
    SuggestedQuestionList:
      description: Suggested questions for a page (a fixed rule table).
      type: object
      required:
      - pageType
      - questions
      properties:
        pageType:
          $ref: "#/components/schemas/ChartQuestionPageType"
          description: The page.
          x-phi: none
        questions:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
          description: The questions, in order.
          x-phi: none
