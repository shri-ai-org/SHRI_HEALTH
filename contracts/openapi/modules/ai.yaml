            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: ../components/schemas/Operation.yaml
              examples:
                queued:
                  summary: Answer queued
                  value:
                    id: 9d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                    kind: ai.chart-answer
                    status: queued
                    createdAt: 2026-11-10T15:12:00Z
                    updatedAt: 2026-11-10T15:12:00Z
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
