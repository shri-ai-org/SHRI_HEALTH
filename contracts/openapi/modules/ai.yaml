    put:
      operationId: replaceAiSettings
      summary: Change the AI settings
      description: 'Sets the clinic-wide switch and the features listed (inventory #115; FRS §3.4); a feature left out keeps
        its setting. Turning a feature off needs a `reason`. `If-Match` makes a second admin tab get `412` instead of overwriting.
        Switching off applies from the next AI request: running operations finish, and drafts and summaries already made stay
        readable and decidable, so every non-AI workflow keeps working. Audited as `admin`.'
