  /ai/chart-questions:
    post:
      operationId: createChartQuestion
      summary: Ask a question about a patient's chart
      description: 'Chart question and answer (FRS §3.4; the screens'' AI bubble): a question in plain words, with the page
        it is asked from. Returns `202` and an operation of kind `ai.chart-answer`; its result is the answer (`GET /ai/chart-answers/{chartAnswerId}`).
        The gateway reads the chart within the caller''s own request, through each module''s service, with the same permissions,
        facility scope and restricted-chart check as the caller''s own reads, audited as `ai`. A part the caller may not read
        is never read. **The front desk gets scheduling answers only**: for a role without clinical read permissions, only
        the patient''s appointments are read, never clinical data. The model answers only from the records it was given: every
        statement cites at least one of them, a statement that cites none is dropped, and when the chart does not answer the
        question the answer says so (`insufficientEvidence`). The answer is AI output, never part of the chart, and readable
        by its requester only. The question and the answer are never logged. Governed by the `chart-summary` switch: refused
        with `409 feature-disabled` while AI or `chart-summary` is off for the clinic. The operation fails with `ai-unavailable`
        (the model is down, declined, or the monthly AI budget is used up) or `ai-output-rejected`.'
