      - expiresAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Invitation ID.
          x-phi: internal-id
        status:
          type: string
          enum:
          - active
          - used
          - expired
          - revoked
          description: Where it is.
          x-phi: none
        issuedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was issued.
          x-phi: none
        expiresAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it stops working (72 hours after issue).
          x-phi: none
    PortalInvitation:
      description: 'A new invitation with its code. The code is in this response only: it is stored as an HMAC, never logged,
        and can''t be read again. Print it or read it out at the desk; never email or text it (ADR-0013 §3).'
      type: object
      required:
      - id
      - code
      - issuedAt
      - expiresAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Invitation ID.
          x-phi: internal-id
        code:
          type: string
          maxLength: 14
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$
          description: 'The invitation code: 12 Crockford base32 characters in three groups.'
          x-phi: identifier
        issuedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was issued.
          x-phi: none
        expiresAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it stops working (72 hours, single use).
          x-phi: none
    PortalAccountStatus:
      description: 'The patient''s portal account as the front desk sees it: never a password, factor or code. `none`: no
        account and no active invitation; `invited`: an invitation is active; `pending-setup`: enrolled, but the patient hasn''t
        finished the realm''s set-up (verify email, password, second factor); `active`; `disabled`: ADM disabled it (D92),
        and `enable` reopens it; `suspended`: the chart was merged into another (ADR-0013) while the account was `active`
        or `pending-setup`; its sessions ended and nobody can sign in. Undoing the merge restores exactly the earlier state,
        unless ADM disabled the account meanwhile (then it stays `disabled`). `enable` and `reset-factors` refuse it.'
      type: object
      required:
      - patientId
      - status
      properties:
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: Patient ID.
          x-phi: internal-id
        status:
          type: string
          enum:
          - none
          - invited
          - pending-setup
          - active
          - disabled
          - suspended
          description: Account state.
          x-phi: none
        email:
          $ref: ../components/schemas/EmailAddress.yaml
          description: 'The sign-in email, once enrolled (ADR-0013 §4: the front desk can tell a patient which email they
            used).'
          x-phi: identifier
        invitation:
          $ref: '#/components/schemas/PortalInvitationSummary'
          description: The active invitation, if any.
          x-phi: none
        enrolledAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When the patient enrolled.
          x-phi: none
        factorsResetAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When the second factors were last reset by staff.
          x-phi: none
        disabledAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When the account was disabled; present only while `disabled`.
          x-phi: none
    PortalFactorResetRequest:
