# Shri Health API — module `patients`
# x-owner: vimal  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Patients, identifiers, related persons, coverage, card images, consents, preferred pharmacy, restricted charts, duplicates and merges (`backend/app/modules/patients/`)
# Stage 4 batch 1. Shapes follow ENDPOINT_INVENTORY rows #28-49 (the timeline, #46, is batch B4).
# Aligned with the locked schema (D72). Decided fields whose columns are not in the schema files yet are Anand's
# migration item A45 (NOTE_FOR_ANAND); they stay in the contract. No date gates any change.
# No SSN anywhere (D43).
# Batch 1 follow-up (2026-10-24, D49-D62): preferred pharmacy on the patient (D50), preferred and previous names (D57),
# the license image as a document (D56), POST /patients/summaries (D54) and GET /patient-merges (D51).
paths:
  /patients/search:
    post:
      operationId: searchPatients
      summary: Search patients
      description: 'Finds patients by name, date of birth, phone or identifier (inventory #28). Criteria go in the body, never
        in the URL (D13, ADR-0005). Phone is an exact match on the full number. Restricted patients appear with summary fields
        only and `restricted: true`. At most 50 per page.'
      tags:
      - patients
      x-owner: vimal
      x-permission: patients:search
      x-audit:
        action: R
        category: phi-read
        patient: result
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSearchRequest'
            examples:
              name-and-birth-date:
                summary: Family name and date of birth
                value:
                  criteria:
                    family: Kuhlman72
                    birthDate: '1984-07-19'
                  limit: 25
              phone:
                summary: Exact phone number
                value:
                  criteria:
                    phone: '+16175550123'
      responses:
        '200':
          description: One page of matching patients.
          headers:
            X-Request-ID: &id001
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control: &id002
              $ref: ../components/headers/CacheControl.yaml
            RateLimit: &id003
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy: &id004
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummaryList'
              examples:
                one-match:
                  summary: One match
                  value:
                    items:
                    - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      name:
                        given:
                        - Ramona980
                        family: Kuhlman72
                      birthDate: '1984-07-19'
                      gender: female
                      mrn: TEST-000123
                      phoneLast4: '0123'
                      restricted: false
                      active: true
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON); `invalid-cursor` (the cursor is expired
            or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `patients:search`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: '422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (fewer
            criteria than the minimum: one exact identifier or at least two criteria).'
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /patients:
    post:
      operationId: registerPatient
      summary: Register a patient
      description: 'Registers a patient (inventory #29). The server assigns the MRN (D41). A duplicate check runs first: similar
        name with the same date of birth or phone gives `409 possible-duplicate` with candidate IDs only; resend with `duplicateCheck:
        override` and a reason to proceed. Patient, names, contact points and identifiers commit in one transaction with the
        audit event (ADR-0011).'
      tags:
      - patients
      x-owner: vimal
      x-permission: patients:create
      x-audit:
        action: C
        category: phi-write
        patient: result
      x-idempotency: supported
      x-storage: clinical
      x-events:
      - patient.created
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
            examples:
              from-license-scan:
                summary: Registration after a driver's license scan
                value:
                  name:
                    given:
                    - Ramona980
                    family: Kuhlman72
                  birthDate: '1984-07-19'
                  gender: female
                  birthSex: F
                  preferredLanguage: en
                  phones:
                  - number: '+16175550123'
                    use: mobile
                    textMessages: true
                  emails:
                  - address: ramona980.kuhlman72@example.com
                    use: home
                  address:
                    lines:
                    - 100 Test Lane
                    city: Springfield
                    state: IL
                    postalCode: '62701'
                    country: US
                  identifiers:
                  - type: DL
                    system: urn:oid:2.16.840.1.113883.4.3.17
                    value: TEST-DL-4471
                    assigner: IL
      responses:
        '201':
          description: Created. The new patient.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                registered:
                  summary: Registered patient
                  value: &id005
                    id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    mrn: TEST-000123
                    name:
                      given:
                      - Ramona980
                      family: Kuhlman72
                    birthDate: '1984-07-19'
                    gender: female
                    birthSex: F
                    race:
                      ombCategories:
                      - 2106-3
                    ethnicity:
                      ombCategories:
                      - 2186-5
                    preferredLanguage: en
                    phones:
                    - number: '+16175550123'
                      use: mobile
                      textMessages: true
                    emails:
                    - address: ramona980.kuhlman72@example.com
                      use: home
                    address:
                      lines:
                      - 100 Test Lane
                      city: Springfield
                      state: IL
                      postalCode: '62701'
                      country: US
                    identifiers:
                    - id: 8f9a0b1c-2d3e-4f4a-8b5c-6d7e8f9a0b1c
                      type: MR
                      value: TEST-000123
                      use: official
                      createdAt: '2026-11-03T14:30:00Z'
                    restricted: false
                    active: true
                    createdAt: '2026-11-03T14:30:00Z'
                    updatedAt: '2026-11-03T14:30:00Z'
                    preferredName: Mona980
                    preferredPharmacy:
                      id: 1c2d3e4f-5a6b-4c7d-9e8f-9a0b1c2d3e4f
                      name: Test Pharmacy 12
                      address:
                        line: 300 Test Road
                        city: Springfield
                        state: IL
                        postalCode: '62703'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `patients:create`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `possible-duplicate`
            (matching patients exist).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (for example
            a birth date in the future, an MRN sent as an identifier, or `override` without a reason); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /patients/{patientId}:
    parameters: &id006
    - &id011
      name: patientId
      in: path
      required: true
      description: Patient ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: getPatient
      summary: Get a patient
      description: 'Returns demographics and identifiers (inventory #30). A restricted chart gives `403 break-glass-required`
        unless the user holds a break-glass grant or is on the patient''s care team (D37). A merged record is returned with
        `active: false` and `mergedIntoId`.'
      tags:
      - patients
      x-owner: vimal
      x-permission: patients:read
      x-audit:
        action: R
        category: phi-read
        patient: patientId
      x-storage: clinical
      x-release: P0
      responses:
        '200':
          description: The patient.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                patient:
                  summary: A patient
                  value: *id005
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `patients:read`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
    patch:
      operationId: updatePatient
      summary: Update a patient
      description: 'Edits demographics with JSON Merge Patch (inventory #31). Needs the current `ETag` in `If-Match`. A merged
        patient gives `409 patient-merged`.'
      tags:
      - patients
      x-owner: vimal
      x-permission: patients:update
      x-audit:
        action: U
        category: phi-write
        patient: patientId
      x-concurrency: if-match-required
      x-storage: clinical
      x-events:
      - patient.updated
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IfMatch.yaml
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatientPatch'
            examples:
              new-phone:
                summary: Replace the phone numbers
                value:
                  phones:
                  - number: '+16175550188'
                    use: mobile
      responses:
        '200':
          description: The patient.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                updated:
                  summary: Updated patient
                  value: *id005
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `patients:update`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no break-glass
            grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `patient-merged` (the patient was merged into another record).
        '412':
          $ref: ../components/responses/PreconditionFailed.yaml
          description: 412. `precondition-failed` (`If-Match` does not match the current version).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (a rule
            rejects the request).
        '428':
          $ref: ../components/responses/PreconditionRequired.yaml
          description: 428. `precondition-required` (`If-Match` is missing).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
