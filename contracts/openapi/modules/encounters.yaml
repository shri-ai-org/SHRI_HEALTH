    parameters: *id007
    post:
      operationId: createAfterVisitSummary
      summary: Generate the after-visit summary
      description: 'Generates the patient''s after-visit summary as a PDF from a **signed** note (inventory #86; FRS FR-ENC-06):
        diagnoses, medications, orders, the note''s patient instructions section (LOINC 69730-0) and follow-up. Returns `202`
        and an operation of kind `encounter.after-visit-summary`; the result is a document (a DocumentReference with origin
        `generated`, its PDF stored through the file service). Generating it again makes a new version. Release to the patient
        portal is P1.'
