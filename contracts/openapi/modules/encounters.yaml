components:
  schemas:
    ClinicianRef:
      description: A clinician or staff member, for display.
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Practitioner ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Name as shown on screens (staff, not patient data).
          x-phi: none
    EncounterStatus:
      description: 'Encounter status, FHIR codes (DATA_OWNERSHIP §5.2): `arrived` at check-in, `triaged` once roomed, `in-progress`
        with the provider or after the first note, `finished` when closed, `cancelled` when the patient left without being
        seen, `entered-in-error`. Changes only through actions, never PATCH.'
      type: string
      enum:
      - arrived
      - triaged
      - in-progress
      - finished
      - cancelled
      - entered-in-error
    EncounterParticipant:
      description: 'A clinician on the encounter, with their role: `rendering` (performs the visit), `supervising` (co-signs
        for an NP or PA), `attending` or `referring`.'
      type: object
      additionalProperties: false
      required:
      - role
      - practitionerId
      properties:
        role:
          type: string
          enum:
          - rendering
          - supervising
          - attending
          - referring
          description: Role on this encounter (FHIR participant type PPRF, SPRF, ATND, REF).
          x-phi: none
        practitionerId:
          $ref: ../components/schemas/Id.yaml
          description: Practitioner ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Name, for display. Read-only.
          x-phi: none
    EncounterDiagnosis:
      description: 'A diagnosis on this encounter: a Condition with category `encounter-diagnosis`, ranked 1 to 12 for the
        claim (FRS FR-ENC-02; DATA_OWNERSHIP §2.5). Entered-in-error diagnoses are kept for audit but left out of the chart,
        problem list, decision support, AI summaries, claims and patient views (D24).'
      type: object
      required:
      - id
      - encounterId
      - code
      - verificationStatus
      - entrySource
      - recordedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Diagnosis ID (the Condition).
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter.
          x-phi: internal-id
        rank:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          maximum: 12
          description: Order on the claim, 1 first. `null` once removed or entered in error.
          x-phi: none
        code:
          $ref: ../components/schemas/Coding.yaml
          description: ICD-10-CM code (`http://hl7.org/fhir/sid/icd-10-cm`), required for billing.
          x-phi: clinical
        additionalCodings:
          type: array
          maxItems: 5
          items:
            $ref: ../components/schemas/Coding.yaml
          description: Other codings for the same diagnosis, e.g. SNOMED CT.
          x-phi: clinical
        verificationStatus:
          type: string
          enum:
          - confirmed
          - provisional
          - differential
          - entered-in-error
          description: FHIR verification status. `entered-in-error` after removal or correction.
          x-phi: clinical
        onsetDate:
          $ref: ../components/schemas/PartialDate.yaml
          description: When it started, as far as known.
          x-phi: clinical
        aiSuggestionId:
          $ref: ../components/schemas/Id.yaml
          description: The AI suggestion it came from, when AI suggested it and a clinician accepted it (FRS FR-ENC-02). Read-only.
          x-phi: internal-id
        entrySource:
          type: string
          enum:
          - clinician
          - imported
          - patient-reported
          - ai-generated
          - device
          - interface
          description: 'Where the record came from: entered by a clinician, imported, reported by the patient, generated by
            AI and verified, from a device, or from an interface. Read-only.'
          x-phi: none
        recordedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was recorded. Read-only.
          x-phi: none
        recordedBy:
          $ref: '#/components/schemas/ClinicianRef'
          description: Who recorded it, when known. Read-only.
          x-phi: none
    VitalType:
      description: 'Vital sign, US Core vital-sign profiles (LOINC): `blood-pressure` 85354-9 (systolic 8480-6, diastolic
        8462-4), `heart-rate` 8867-4, `respiratory-rate` 9279-1, `body-temperature` 8310-5, `body-height` 8302-2, `body-weight`
        29463-7, `bmi` 39156-5, `oxygen-saturation` 59408-5, `head-circumference` 9843-4.'
      type: string
      enum:
      - blood-pressure
      - heart-rate
      - respiratory-rate
      - body-temperature
      - body-height
      - body-weight
      - bmi
      - oxygen-saturation
      - head-circumference
    BloodPressure:
      description: Systolic and diastolic, one observation with two components (US Core Blood Pressure).
      type: object
      additionalProperties: false
      required:
      - systolic
      - diastolic
      properties:
        systolic:
          $ref: ../components/schemas/Quantity.yaml
          description: Systolic, `mm[Hg]`.
          x-phi: clinical
        diastolic:
          $ref: ../components/schemas/Quantity.yaml
          description: Diastolic, `mm[Hg]`.
          x-phi: clinical
    Vital:
      description: 'One vital sign: an Observation with category `vital-signs` (FRS FR-ENC-03; DATA_OWNERSHIP §2.1). Insert-only:
        a correction is entered-in-error plus a new vital. Units are UCUM, accepted and stored **as entered** (D69): `body-weight`
        `kg`, `g` or `[lb_av]`; `body-height` and `head-circumference` `cm` or `[in_i]`; `body-temperature` `Cel` or `[degF]`;
        `blood-pressure` `mm[Hg]`; `heart-rate` and `respiratory-rate` `/min`; `oxygen-saturation` `%`; `bmi` `kg/m2`. Any
        other unit is `422`. Nothing is converted on save; screens convert for display.'
      type: object
      required:
      - id
      - patientId
      - type
      - effectiveAt
      - status
      - entrySource
      - recordedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Vital ID (the Observation).
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient.
          x-phi: internal-id
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter it was taken in.
          x-phi: internal-id
        type:
          $ref: '#/components/schemas/VitalType'
          description: Which vital sign.
          x-phi: none
        value:
          $ref: ../components/schemas/Quantity.yaml
          description: The value as entered. Absent for `blood-pressure`, which uses `bloodPressure`.
