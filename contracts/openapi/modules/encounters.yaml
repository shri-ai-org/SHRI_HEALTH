  /encounters/{encounterId}/close:
    parameters: *id007
    post:
      operationId: closeEncounter
      summary: Close an encounter
      description: 'Moves an `in-progress` encounter to `finished` (inventory #66; DATA_OWNERSHIP §5.2). It needs at least
        one signed note, no open drafts, and at least one diagnosis for a billable type (the proposal waiting for the clinical
        advisors, DECISIONS Q22). A pending co-signature does not block closing; billing holds the claim (A29). A finished
        encounter is never reopened; late information goes in addenda. Raises `encounter.closed`, from which billing builds
        the superbill.'
      tags:
      - encounters
      x-owner: vimal
      x-permission: encounters:close
      x-audit:
        action: E
        category: phi-write
        patient: result
      x-storage: clinical
      x-events:
      - encounter.closed
      - encounter.status-changed
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      responses:
        '200':
          description: The encounter.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
