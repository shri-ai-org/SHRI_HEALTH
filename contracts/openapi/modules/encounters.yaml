# Shri Health API — module `encounters`
# x-owner: vimal  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Encounters, vitals, diagnoses, code search, notes, favorites, after-visit summary, co-signature rules (`backend/app/modules/encounters/`)
# Contract batch 2 (inventory B4), 2026-10-24: rows #62-89 and the single GET for co-sign rules (#251), from the approved plan
# contracts/docs/BATCH2_PLAN.md and the locked schema (D72). Clinical records are FHIR-shaped tables (ADR-0011); every action writes
# its Provenance in the same transaction (D8); nothing is deleted (D14); signed notes are frozen (409 record-locked).
paths:
  /encounters:
    post:
      operationId: createEncounter
      summary: Open an unscheduled encounter
      description: 'Opens a telephone or documentation-only encounter, which starts `in-progress` (inventory #62; D16). Scheduled
        visits start at check-in instead, through the same encounter service. The caller becomes the rendering clinician by
        default. Raises `encounter.opened`.'
      tags:
      - encounters
      x-owner: vimal
      x-permission: encounters:create
      x-audit:
        action: C
        category: phi-write
        patient: body:/patientId
      x-idempotency: supported
      x-storage: clinical
      x-events:
      - encounter.opened
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncounterCreate'
            examples:
              telephone:
                summary: A telephone encounter
                value:
                  patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  unscheduledType: telephone
                  facilityId: 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                  reasons:
                  - text: Question about a refill
      responses:
        '201':
          description: Created. The new encounter.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: &id001
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control: &id002
              $ref: ../components/headers/CacheControl.yaml
            RateLimit: &id003
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy: &id004
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'
              examples:
                opened:
                  summary: Opened
                  value:
                    id: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    status: in-progress
                    class: VR
                    types: &id014
                    - text: Telephone
                    reasons: &id015
                    - text: Question about a refill
                    facilityId: 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                    timeZone: America/Chicago
                    startedAt: '2026-11-04T14:10:00Z'
                    participants: &id016
                    - role: rendering
                      practitionerId: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                      displayName: Dr. Lowe58
                    diagnoses: &id017 []
                    vitals: &id018 []
                    notes: &id019 []
                    createdAt: '2026-11-04T14:10:00Z'
                    updatedAt: '2026-11-04T14:10:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `encounters:create`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds no break-glass
            grant and is not on the care team (D37)).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `patient-merged`
            (the patient was merged into another record).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (the facility
            is not one of the user's facilities, or a participant is not active (field code `invalid-reference`)); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
