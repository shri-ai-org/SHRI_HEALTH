      - encounters
      x-owner: vimal
      x-permission: after-visit-summaries:create
      x-audit:
        action: E
        category: export
        patient: result
      x-idempotency: supported
      x-async: true
      x-storage: files
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfterVisitSummaryRequest'
            examples:
              latest:
                summary: From the latest signed note
                value: {}
      responses:
        '202':
          description: 202. Accepted; runs in the background. Poll `Location` after `Retry-After` seconds, or wait for `operation.completed`
            on the event stream (API_STANDARDS §13).
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            Retry-After:
              $ref: ../components/headers/RetryAfter.yaml
            X-Request-ID: *id001
            Cache-Control: *id002
            RateLimit: *id003
            RateLimit-Policy: *id004
          content:
            application/json:
              schema:
                $ref: ../components/schemas/Operation.yaml
              examples:
                queued:
                  summary: Queued
                  value:
                    id: 6c7d8e9f-0a1b-4c2d-9e3f-4a5b6c7d8e9f
                    kind: encounter.after-visit-summary
                    status: queued
                    createdAt: '2026-11-03T15:41:00Z'
                    updatedAt: '2026-11-03T15:41:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `after-visit-summaries:create`); `csrf-check-failed` (missing
            or wrong CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the user holds
            no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such after-visit summary in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `invalid-state-transition`
            (the encounter is entered in error).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (the encounter
            has no signed note, or `noteId` is not a signed note on it (field code `invalid-reference`)); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
