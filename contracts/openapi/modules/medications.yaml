    post:
      operationId: checkPrescriptionSafety
      summary: Check a draft for allergy and duplicate alerts
      description: 'Runs the safety check on a draft (inventory #123; D97): an `allergy` alert for an active allergy to an
        RxNorm ingredient of the drug, a `duplicate-medication` alert for an active medication with the same ingredient. The
        alerts are stored on the draft. Both alerts are fixed rules in the medications service, each with its tests; no AI
        model produces, ranks or suppresses an alert (D99). It doesn''t change the draft''s version or `ETag`, so an open
        editor keeps its `If-Match`.'
      tags:
      - medications
      x-owner: thulasi
      x-permission: prescriptions:safety-check
      x-audit:
        action: E
