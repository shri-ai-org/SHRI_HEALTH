  /prescriptions/{prescriptionId}/sign-and-send:
    parameters:
    - name: prescriptionId
      in: path
      required: true
      description: Prescription ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    post:
      operationId: signAndSendPrescription
      summary: Sign a prescription and send it to the pharmacy
      description: 'Signs exactly the version read (`If-Match`), locks it, writes its Provenance, adds it to the medication
        list and queues NewRx for the pharmacy through the outbox, all in one transaction (inventory #125; D8, D25, D97).
        Refused while the latest safety check is missing or older than the draft, or a `high` alert has no override. Transmission
        then moves through `sent` to `accepted` or `rejected` (here a simulated pharmacy). Sending always goes through the
        outbox (`enqueue(db, "erx", "NewRx", …)`), never straight from the request: for the demo the outbox delivers to the
        simulated pharmacy, and its answer comes back through `/hooks/erx` (D99).'
      tags:
      - medications
      x-owner: thulasi
      x-permission: prescriptions:sign-and-send
      x-audit:
        action: E
        category: sign
        patient: result
      x-idempotency: required
      x-concurrency: if-match-required
      x-events:
      - prescription.signed
      - prescription.transmission-updated
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
      - $ref: ../components/parameters/IfMatch.yaml
      responses:
        '200':
          description: The prescription, signed and queued.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
              examples:
                signed:
                  summary: Signed and queued
                  value:
                    id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    encounterId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    status: active
                    medication:
                      codings:
                      - system: http://www.nlm.nih.gov/research/umls/rxnorm
                        code: '308191'
                        display: amoxicillin 500 MG Oral Capsule
                      text: Amoxicillin 500 mg capsule
                    dosageText: 1 capsule by mouth three times daily for 10 days
                    quantity:
                      value: 30
                      unit: capsule
                    daysSupply: 10
                    refills: 0
                    substitutionAllowed: true
                    pharmacyId: 9d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                    transmission:
                      status: queued
                      updatedAt: '2026-11-20T15:23:00Z'
                    alerts:
                    - id: 8c9d0e1f-2a3b-4c4d-8e5f-6a7b8c9d0e1f
                      kind: allergy
                      severity: high
                      message: Active allergy to penicillin; amoxicillin is a penicillin.
                      allergyId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      overrideRequired: true
                      override:
                        reason: Tolerated amoxicillin in 2024 without reaction.
                        overriddenBy: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        overriddenAt: '2026-11-20T15:22:00Z'
                    createdAt: '2026-11-20T15:20:00Z'
                    updatedAt: '2026-11-20T15:23:00Z'
                    prescriberId: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                    signedAt: '2026-11-20T15:23:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `idempotency-key-missing` (the Idempotency-Key header is required).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `prescriptions:sign-and-send`); `break-glass-required` (the
            patient's chart is restricted and the user holds no break-glass grant and is not on the care team (D37)); `csrf-check-failed`
            (missing or wrong CSRF header or Origin).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such prescription in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `invalid-state-transition` (not a draft; the problem carries `currentState`); `idempotency-request-in-progress`
            (a request with this Idempotency-Key is still running).
        '412':
          $ref: ../components/responses/PreconditionFailed.yaml
          description: 412. `precondition-failed` (the record changed since it was read; the response carries the current
            `ETag`).
        '422':
          description: '422. `business-rule-violation`, with one entry in `errors` per refusal, each a JSON Pointer into the
            prescription (as read with `GET`): `required` at `/dosageText`, `/quantity` or `/pharmacyId` (needed to sign);
            `safety-check-stale` at `/alerts` (no safety check has run on this version of the draft, or the draft changed
            since: run `POST …/safety-check` again; `safetyCheckedAt` is then absent); `override-required` at `/alerts/{i}`
            (the `high` alert at that index of `alerts` has no override yet: override it with `POST /alerts/{alertId}/override`).
            `idempotency-key-reused` (the Idempotency-Key was used with a different body).'
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/problem+json:
              schema:
                $ref: ../components/schemas/Problem.yaml
              examples:
                missing-fields:
                  summary: Fields required to sign are missing
                  value:
                    type: tag:company-domain.invalid,2026:problem/business-rule-violation
                    title: Business rule violation
                    status: 422
                    detail: 2 fields break a rule.
                    instance: /api/v1/prescriptions/6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d/sign-and-send
                    code: business-rule-violation
                    requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
                    errors:
                    - in: body
                      pointer: /dosageText
                      code: required
                    - in: body
                      pointer: /pharmacyId
                      code: required
                safety-check-stale:
                  summary: Run the safety check again
                  value:
                    type: tag:company-domain.invalid,2026:problem/business-rule-violation
                    title: Business rule violation
                    status: 422
                    detail: 1 field breaks a rule.
                    instance: /api/v1/prescriptions/6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d/sign-and-send
                    code: business-rule-violation
                    requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
                    errors:
                    - in: body
                      pointer: /alerts
                      code: safety-check-stale
                override-required:
                  summary: An alert needs an override
                  value:
                    type: tag:company-domain.invalid,2026:problem/business-rule-violation
                    title: Business rule violation
                    status: 422
                    detail: 1 field breaks a rule.
                    instance: /api/v1/prescriptions/6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d/sign-and-send
                    code: business-rule-violation
                    requestId: 0b7e4b0c-3f4e-4d3a-9d0e-0c1b5e2f9a11
                    errors:
                    - in: body
                      pointer: /alerts/0
                      code: override-required
                idempotency-key-reused:
                  $ref: ../components/examples/ProblemIdempotencyKeyReused.yaml
        '428':
          $ref: ../components/responses/PreconditionRequired.yaml
          description: 428. `precondition-required` (the `If-Match` header is missing).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
components:
  schemas:
    PharmacyDirectoryAddress:
      description: A pharmacy's address from the directory.
      type: object
      properties:
        line:
          type: string
          maxLength: 200
          description: Street address.
          x-phi: none
        city:
          type: string
          maxLength: 100
          description: City.
          x-phi: none
        state:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
          description: State.
          x-phi: none
        postalCode:
          type: string
          pattern: ^\d{5}(-\d{4})?$
          maxLength: 10
          description: ZIP code.
          x-phi: none
    Pharmacy:
      description: A pharmacy in the platform directory, synced from the e-prescribing vendor (`pharmacy`). Reference data,
        not patient data.
      type: object
      required:
      - id
      - ncpdpId
      - name
      - mailOrder
      - active
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Pharmacy ID.
          x-phi: internal-id
        ncpdpId:
          type: string
          pattern: ^\d{7}$
          maxLength: 7
          description: NCPDP ID.
          x-phi: none
        npi:
          type: string
          pattern: ^\d{10}$
          maxLength: 10
          description: NPI, if known.
          x-phi: none
        name:
          type: string
          maxLength: 200
          description: Name.
          x-phi: none
        phone:
          $ref: ../components/schemas/PhoneNumber.yaml
          description: Phone.
          x-phi: none
        fax:
          $ref: ../components/schemas/PhoneNumber.yaml
          description: Fax.
          x-phi: none
        address:
          $ref: '#/components/schemas/PharmacyDirectoryAddress'
          description: Address.
          x-phi: none
        mailOrder:
          type: boolean
          description: A mail-order pharmacy.
          x-phi: none
        active:
          type: boolean
          description: False when the pharmacy no longer accepts prescriptions.
          x-phi: none
    PharmacyList:
      description: One page of pharmacies, by name.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Pharmacy'
          description: The items on this page.
          x-phi: none
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
    MedicationListStatus:
      description: 'Status on the medication list: `active`, `completed`, `stopped`, `entered-in-error` (never shown on screens).'
      type: string
      enum:
      - active
      - completed
      - stopped
      - entered-in-error
    Medication:
      description: 'An entry on the patient''s medication list: a `MedicationRequest` with `intent` and `reported` (D28).
        A prescription written here appears with `source: prescription`; a medication the patient already takes, recorded
        at rooming, with `source: reported`.'
      type: object
      required:
      - id
      - patientId
      - medication
      - status
      - source
      - recordedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Medication ID.
          x-phi: internal-id
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: Patient ID.
          x-phi: internal-id
        medication:
          $ref: ../components/schemas/CodeableConcept.yaml
          description: 'The drug: RxNorm, or text when no code fits.'
          x-phi: clinical
        dosageText:
          type: string
          maxLength: 500
          description: How it is taken, as written ("1 tablet by mouth once daily").
          x-phi: clinical
        status:
          $ref: '#/components/schemas/MedicationListStatus'
          description: Status.
          x-phi: clinical
        source:
          type: string
          enum:
          - prescription
          - reported
          description: '`prescription` (written here; `prescriptionId` set) or `reported` (the patient takes it already).'
          x-phi: none
        prescriptionId:
          $ref: ../components/schemas/Id.yaml
          description: "The prescription that put it on the list, when `source` is `prescription`. It equals `id`: the list entry is that prescription's `MedicationRequest` (D28)."
          x-phi: internal-id
        note:
          type: string
          maxLength: 1000
          description: A note.
          x-phi: clinical
        recordedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was recorded.
          x-phi: none
        recordedBy:
          $ref: ../components/schemas/Id.yaml
          description: Who recorded it.
          x-phi: none
    MedicationList:
      description: The patient's medication list, active first.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Medication'
          description: The items on this page.
          x-phi: clinical
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
