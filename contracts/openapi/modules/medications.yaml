    - name: prescriptionId
      in: path
      required: true
      description: Prescription ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: getPrescription
      summary: Get a prescription
      description: 'One prescription with its alerts and transmission status (inventory #121).'
      tags:
      - medications
      x-owner: thulasi
      x-permission: prescriptions:read
      x-audit:
        action: R
        category: phi-read
        patient: result
      x-storage: clinical
      x-release: P0
      security:
