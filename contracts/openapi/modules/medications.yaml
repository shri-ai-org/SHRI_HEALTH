      operationId: markPrescriptionEnteredInError
      summary: Mark a draft prescription wrong
      description: 'A draft written by mistake (inventory #227): entered-in-error with a reason and its Provenance; nothing
        is deleted (D14). A signed prescription is cancelled instead (later).'
      tags:
      - medications
      x-owner: thulasi
      x-permission: prescriptions:entered-in-error
      x-audit:
