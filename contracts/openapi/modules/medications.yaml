        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `record-locked` (the prescription is signed).
        '412':
          $ref: ../components/responses/PreconditionFailed.yaml
          description: 412. `precondition-failed` (the record changed since it was read; the response carries the current
