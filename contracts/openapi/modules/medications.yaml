# Shri Health API — module `medications`
# x-owner: thulasi  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Medications, prescriptions, safety checks, refill requests, pharmacies (`backend/app/modules/medications/`)
#
# Stage 3 leaves this file empty on purpose: no endpoints yet.
# Stage 4 adds each path item under `paths:` and references it from ../shri-health.yaml, for example:
#
#   # in shri-health.yaml
#   paths:
#     /patients/search:
#       $ref: modules/patients.yaml#/paths/~1patients~1search
#
# Module-specific schemas go under `components.schemas` here; shared ones stay in ../components/.
# Batch 1 follow-up (2026-10-24, D50): `GET /pharmacies` (#130) moves into batch 1 so the front desk can record a preferred pharmacy at
# registration. The rest of the medications module follows in batch 5. Thulasi approves this operation.
paths:
  /pharmacies:
    get:
      operationId: listPharmacies
      summary: Search the pharmacy directory
      description: 'Searches the pharmacy directory by name or ZIP code (inventory #130; D50). Reference data about pharmacies,
        not patients, so the query string is allowed and nothing is audited. The front desk uses it to set a patient''s preferred
        pharmacy (`PUT /patients/{patientId}/preferred-pharmacy`); prescribers use it when sending a prescription.'
      tags:
      - medications
      x-owner: thulasi
      x-permission: pharmacies:read
      x-audit:
        action: R
        category: none
      x-storage: admin
      x-release: P0
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - name: q
        in: query
        required: false
        description: Pharmacies whose name contains this text.
        schema:
          type: string
          minLength: 2
          maxLength: 200
      - name: postalCode
        in: query
        required: false
        description: Pharmacies in this ZIP code (the pharmacy's, not a patient's).
        schema:
          type: string
          pattern: ^\d{5}$
          maxLength: 5
      - name: mailOrder
        in: query
        required: false
        description: Only mail-order (true) or local (false) pharmacies.
        schema:
          type: boolean
      responses:
        '200':
          description: One page of pharmacys.
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyList'
              examples:
                one:
                  summary: One pharmacy
                  value:
                    items:
                    - id: 1c2d3e4f-5a6b-4c7d-9e8f-9a0b1c2d3e4f
                      ncpdpId: '0000012'
                      name: Test Pharmacy 12
                      phone: '+12175550130'
                      fax: '+12175550131'
                      address:
                        line: 300 Test Road
                        city: Springfield
                        state: IL
                        postalCode: '62703'
                      mailOrder: false
                      active: true
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `pharmacies:read`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /patients/{patientId}/medications:
    parameters:
    - name: patientId
      in: path
      required: true
      description: Patient ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: listMedications
      summary: List a patient's medications
      description: 'The medication list (inventory #116; D28): what the patient takes, prescribed here or reported, active
        first. Entered-in-error entries are left out.'
      tags:
      - medications
      x-owner: thulasi
      x-permission: medications:read
      x-audit:
        action: R
        category: phi-read
        patient: patientId
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - name: status
        in: query
        required: false
        description: Only this status.
        schema:
          type: string
          enum:
          - active
          - completed
          - stopped
      responses:
        '200':
          description: One page.
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationList'
              examples:
                page:
                  summary: One page
                  value:
                    items:
                    - id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                      patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      medication:
                        codings:
                        - system: http://www.nlm.nih.gov/research/umls/rxnorm
                          code: '308191'
                          display: amoxicillin 500 MG Oral Capsule
                        text: Amoxicillin 500 mg capsule
                      dosageText: 1 capsule by mouth three times daily for 10 days
                      status: active
                      source: prescription
                      prescriptionId: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                      recordedAt: '2026-11-20T15:23:00Z'
                      recordedBy: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                    - &a2
                      id: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
                      patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      medication: &a1
                        codings:
                        - system: http://www.nlm.nih.gov/research/umls/rxnorm
                          code: '314076'
                          display: lisinopril 10 MG Oral Tablet
                        text: Lisinopril 10 mg tablet
                      dosageText: 1 tablet by mouth once daily
                      status: active
                      source: reported
                      recordedAt: '2026-11-20T15:05:00Z'
                      recordedBy: d0000000-0000-4000-8000-000000000002
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401': &a3
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `medications:read`); `break-glass-required` (the patient's
            chart is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429': &a4
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500': &a5
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
    post:
      operationId: recordMedication
      summary: Record a current medication
      description: 'Adds a medication the patient already takes (inventory #117), e.g. at rooming. Recorded as reported (D28).'
      tags:
      - medications
      x-owner: thulasi
      x-permission: medications:create
      x-audit:
        action: C
        category: phi-write
        patient: patientId
      x-idempotency: supported
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationCreate'
            examples:
              lisinopril:
                summary: Lisinopril, as the patient takes it
                value:
                  medication: *a1
                  dosageText: 1 tablet by mouth once daily
      responses:
        '201':
          description: Created. The list entry.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
              examples:
                recorded:
                  summary: Recorded
                  value: *a2
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401': *a3
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `medications:create`); `break-glass-required` (the patient's
            chart is restricted and the user holds no break-glass grant and is not on the care team (D37)); `csrf-check-failed`
            (missing or wrong CSRF header or Origin).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `patient-merged` (the patient was merged into another record); `idempotency-request-in-progress`
            (a request with this Idempotency-Key is still running).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a field is invalid); `idempotency-key-reused` (the Idempotency-Key was used
            with a different body).
        '429': *a4
        '500': *a5
  /prescriptions:
    post:
      operationId: createPrescription
      summary: Start a prescription
      description: 'Starts a draft (inventory #120). Drug search is `GET /codes?system=rxnorm`, over RxNorm Current Prescribable
        Content (D97).'
      tags:
      - medications
      x-owner: thulasi
      x-permission: prescriptions:create
      x-audit:
        action: C
        category: phi-write
        patient: body:/patientId
      x-idempotency: supported
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreate'
            examples:
              amoxicillin:
                summary: Amoxicillin for 10 days
                value:
                  patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  encounterId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                  medication: &a6
                    codings:
                    - system: http://www.nlm.nih.gov/research/umls/rxnorm
                      code: '308191'
                      display: amoxicillin 500 MG Oral Capsule
                    text: Amoxicillin 500 mg capsule
                  dosageText: 1 capsule by mouth three times daily for 10 days
                  quantity: &a7
                    value: 30
                    unit: capsule
                  daysSupply: 10
                  refills: 0
                  substitutionAllowed: true
                  pharmacyId: 9d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
      responses:
        '201':
          description: Created. The draft.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            Location:
              $ref: ../components/headers/Location.yaml
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
              examples:
                draft:
                  summary: A draft
                  value:
                    id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    encounterId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    status: draft
                    medication: *a6
                    dosageText: 1 capsule by mouth three times daily for 10 days
                    quantity: *a7
                    daysSupply: 10
                    refills: 0
                    substitutionAllowed: true
                    pharmacyId: 9d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                    transmission:
                      status: not-sent
                    alerts: []
                    createdAt: '2026-11-20T15:20:00Z'
                    updatedAt: '2026-11-20T15:21:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `prescriptions:create`); `break-glass-required` (the patient's
            chart is restricted and the user holds no break-glass grant and is not on the care team (D37)); `csrf-check-failed`
            (missing or wrong CSRF header or Origin).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient, encounter or pharmacy in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `patient-merged` (the patient was merged into another record); `idempotency-request-in-progress`
            (a request with this Idempotency-Key is still running).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a field is invalid); `business-rule-violation` (the encounter is not this
            patient's, or is closed); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /prescriptions/{prescriptionId}:
