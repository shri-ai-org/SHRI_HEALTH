                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    encounterId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    status: draft
                    medication: *a8
                    dosageText: 1 capsule by mouth three times daily for 10 days
                    quantity:
                      value: 21
                      unit: capsule
                    daysSupply: 7
                    refills: 0
                    substitutionAllowed: true
                    pharmacyId: 9d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                    transmission: *a11
                    alerts: []
                    createdAt: '2026-11-20T15:20:00Z'
                    updatedAt: '2026-11-20T15:21:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
