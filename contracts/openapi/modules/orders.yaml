# Shri Health API — module `orders`
# x-owner: thulasi  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Lab compendium, orders, results, unmatched results (`backend/app/modules/orders/`)
#
# The first two operations are the doctor's reads of a patient's lab results and imaging reports
# (the record's Test results and Imaging reports tabs; demo, 13 Nov). Then the compendium, orders and
# outbound referrals (Thulasi's spec on #85, 2026-11-17); results come back through `/hooks/lab` (platform.yaml).
paths:
  /patients/{patientId}/lab-results:
    parameters:
    - name: patientId
      in: path
      required: true
      description: Patient ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: listLabResults
      summary: List a patient's lab results
      description: 'A patient''s lab reports (FHIR `DiagnosticReport`, category `LAB`), newest first by collection time, each
        with its analytes (`Observation`, category `laboratory`). Only final, amended, corrected and appended reports are
        shown (final, amended and corrected analytes); never preliminary, cancelled or entered-in-error (D24). Restricted
        charts need a break-glass grant or care-team membership (D37).'
      tags:
      - orders
      x-owner: thulasi
      x-permission: results:read
      x-audit:
        action: R
        category: phi-read
        patient: patientId
      x-storage: clinical
      x-release: P0
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      responses:
        '200':
          description: One page of lab results.
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabResultList'
              examples:
                page:
                  summary: One page
                  value:
                    items:
                    - id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                      patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                      code:
                        codings:
                        - system: http://loinc.org
                          code: 4548-4
                          display: Hemoglobin A1c/Hemoglobin.total in Blood
                      status: final
                      collectedAt: '2026-10-27T16:10:00Z'
                      issuedAt: '2026-10-27T21:40:00Z'
                      performer: Example Reference Laboratory (synthetic)
                      observations:
                      - id: 6f7a8b9c-0d1e-4f2a-8b3c-4d5e6f7a8b9c
                        code:
                          codings:
                          - system: http://loinc.org
                            code: 4548-4
                            display: Hemoglobin A1c/Hemoglobin.total in Blood
                        status: final
                        value:
                          value: 7.2
                          unit: '%'
                        referenceRange:
                          low:
                            value: 4
                            unit: '%'
                          high:
                            value: 5.6
                            unit: '%'
                        interpretation: H
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `results:read`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /patients/{patientId}/imaging-reports:
    parameters:
    - name: patientId
      in: path
      required: true
      description: Patient ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: listImagingReports
      summary: List a patient's imaging reports
      description: 'A patient''s imaging reports (FHIR `DiagnosticReport`, category `RAD`), newest first by study time: the
        radiologist''s impression and the full report as text, and up to three illustrative images (`images`). The images
        are illustrative, not diagnostic, and labelled so on screen; each is read through `createDownloadUrl` (file purpose
        `imaging`, D105). Only final, amended, corrected and appended reports are shown, with their images; never preliminary,
        cancelled or entered-in-error (D24). Restricted charts need a break-glass grant or care-team membership (D37).'
      tags:
      - orders
      x-owner: thulasi
      x-permission: results:read
      x-audit:
        action: R
        category: phi-read
        patient: patientId
      x-storage: clinical
      x-release: P0
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      responses:
        '200':
          description: One page of imaging reports.
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingReportList'
              examples:
                page:
                  summary: One page
                  value:
                    items:
                    - id: 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                      patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                      code:
                        codings:
                        - system: http://loinc.org
                          code: 36643-5
                          display: XR Chest 2 Views
                      status: final
                      studiedAt: '2026-09-15T17:20:00Z'
                      issuedAt: '2026-09-15T19:05:00Z'
                      performer: Example Radiology Group (synthetic)
                      impression: No acute cardiopulmonary abnormality.
                      text: 'Technique: PA and lateral views of the chest. Findings: The lungs are clear. The heart is normal
                        in size. Impression: No acute cardiopulmonary abnormality.'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `results:read`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /lab-compendium:
    get:
      operationId: listOrderableTests
      summary: Search what can be ordered
      description: 'The tests and imaging studies the clinic''s lab and imaging centers offer (inventory #132): reference
        data, not patient data, so the query string is allowed and nothing is audited. `q` matches the start of a word in
        the name, or the code. Ordered by name.'
      tags:
      - orders
      x-owner: thulasi
      x-permission: lab-compendium:read
      x-audit:
        action: R
        category: none
      x-storage: admin
      x-release: P0
      security:
      - sessionCookie: []
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - name: q
        in: query
        required: false
        description: Tests whose name has a word starting with this text, or whose code starts with it. Ignores case.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: category
        in: query
        required: false
        description: Only lab tests or only imaging studies.
        schema:
          $ref: '#/components/schemas/OrderCategory'
      responses:
        '200':
          description: One page of orderable tests.
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderableTestList'
              examples:
                a1c:
                  summary: Searching "a1c"
                  value:
                    items:
                    - id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                      code:
                        codings:
                        - system: http://loinc.org
                          code: 4548-4
                          display: Hemoglobin A1c/Hemoglobin.total in Blood
                      name: Hemoglobin A1c
                      category: laboratory
                      providerName: Example Reference Laboratory (synthetic)
                      specimenType: Whole blood
                      requiresFasting: false
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `lab-compendium:read`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /orders:
    get:
      operationId: listOrders
      summary: List a patient's orders
      description: 'A patient''s lab and imaging orders, drafts included, newest first (inventory #135), with each order''s
        tracking status for the screen''s chips. Entered-in-error orders are left out. Restricted charts need a break-glass
        grant or care-team membership (D37).'
      tags:
      - orders
      x-owner: thulasi
      x-permission: orders:read
      x-audit:
        action: R
        category: phi-read
        patient: result
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - name: patientId
        in: query
        required: true
        description: The patient (an opaque ID, D13).
        schema:
          $ref: ../components/schemas/Id.yaml
      - name: encounterId
        in: query
        required: false
        description: Only the orders of this visit.
        schema:
          $ref: ../components/schemas/Id.yaml
      - name: status
        in: query
        required: false
        description: Only orders with this tracking status.
        schema:
          $ref: '#/components/schemas/OrderTrackingStatus'
      responses:
        '200':
          description: One page of orders.
          headers:
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
              examples:
                page:
                  summary: A sent lab order and a resulted imaging order
                  value:
                    items:
                    - id: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
                      patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                      category: laboratory
                      code:
                        codings:
                        - system: http://loinc.org
                          code: 4548-4
                          display: Hemoglobin A1c/Hemoglobin.total in Blood
                      display: Hemoglobin A1c
                      priority: routine
                      status: active
                      trackingStatus: received
                      orderedAt: '2026-11-20T15:24:00Z'
                      orderedBy:
                        id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        displayName: Dr. Lowe58
                      performerName: Example Reference Laboratory (synthetic)
                      reason: Follow-up of type 2 diabetes.
                      trackingUpdatedAt: '2026-11-20T15:25:00Z'
                    - id: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8c
                      patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                      category: imaging
                      code:
                        codings:
                        - system: http://loinc.org
                          code: 36643-5
                          display: XR Chest 2 Views
                      display: Chest X-ray, two views
                      priority: routine
                      status: completed
                      trackingStatus: resulted
                      orderedAt: '2026-11-20T15:24:00Z'
                      orderedBy:
                        id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        displayName: Dr. Lowe58
                      performerName: Example Radiology Group (synthetic)
                      resultId: 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                      trackingUpdatedAt: '2026-11-20T15:27:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `orders:read`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
    post:
      operationId: createOrder
      summary: Start a lab or imaging order
      description: 'Starts a draft order (inventory #134): a `ServiceRequest`, intent `order`, category `laboratory` or `imaging`
        from the test. The test comes from `GET /lab-compendium`. If the same test is already active for the patient from
        the last 7 days, the server answers `409 duplicate-order` (`errors` names `/testId`); the clinician may send the request
        again with `duplicateOverrideReason`. The draft is signed and sent with `POST /orders/{orderId}/sign-and-send`.'
      tags:
      - orders
      x-owner: thulasi
      x-permission: orders:create
      x-audit:
        action: C
        category: phi-write
        patient: body:/patientId
      x-idempotency: required
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            examples:
              a1c:
                summary: An HbA1c
                value:
                  patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                  testId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                  priority: routine
                  reason: Follow-up of type 2 diabetes.
              override:
                summary: The same test again, with a reason
                value:
                  patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                  testId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                  priority: routine
                  duplicateOverrideReason: The earlier specimen was hemolyzed.
      responses:
        '201':
          description: Created. The draft.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            Location:
              $ref: ../components/headers/Location.yaml
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                draft:
                  summary: A draft
                  value:
                    id: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                    category: laboratory
                    code:
                      codings:
                      - system: http://loinc.org
                        code: 4548-4
                        display: Hemoglobin A1c/Hemoglobin.total in Blood
                    display: Hemoglobin A1c
                    priority: routine
                    status: draft
                    trackingStatus: draft
                    performerName: Example Reference Laboratory (synthetic)
                    reason: Follow-up of type 2 diabetes.
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON); `idempotency-key-missing` (the Idempotency-Key
            header is required).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `orders:create`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)); `csrf-check-failed`
            (missing or wrong CSRF header or Origin).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient, encounter or test in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: '409. `duplicate-order` (the same test is already active for the patient from the last 7 days; `errors`
            names `/testId` with `duplicate-order`; send again with `duplicateOverrideReason` to go ahead); `patient-merged`
            (the patient was merged into another record); `idempotency-request-in-progress` (a request with this Idempotency-Key
            is still running).'
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a field is invalid); `business-rule-violation` (the encounter is not this
            patient's, or is closed); `idempotency-key-reused` (the Idempotency-Key was used with a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /orders/{orderId}:
    parameters:
    - name: orderId
      in: path
      required: true
      description: Order ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: getOrder
      summary: Get an order
      description: 'One order with its tracking status (inventory #136). Its `ETag` is the `If-Match` for signing, cancelling
        or marking it entered-in-error.'
      tags:
      - orders
      x-owner: thulasi
      x-permission: orders:read
      x-audit:
        action: R
        category: phi-read
        patient: result
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
      responses:
        '200':
          description: The order.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID:
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control:
              $ref: ../components/headers/CacheControl.yaml
            RateLimit:
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy:
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                sent:
                  summary: Signed and sent
                  value:
                    id: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
                    patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    encounterId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                    category: laboratory
                    code:
                      codings:
                      - system: http://loinc.org
                        code: 4548-4
                        display: Hemoglobin A1c/Hemoglobin.total in Blood
                    display: Hemoglobin A1c
                    priority: routine
                    status: active
                    trackingStatus: sent
                    orderedAt: '2026-11-20T15:24:00Z'
                    orderedBy:
                      id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                      displayName: Dr. Lowe58
                    performerName: Example Reference Laboratory (synthetic)
                    reason: Follow-up of type 2 diabetes.
                    trackingUpdatedAt: '2026-11-20T15:24:30Z'
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `orders:read`); `break-glass-required` (the patient's chart
            is restricted and the user holds no break-glass grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such order in this clinic or the user's facilities).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /orders/{orderId}/sign-and-send:
    parameters:
    - name: orderId
      in: path
      required: true
      description: Order ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    post:
      operationId: signAndSendOrder
      summary: Sign an order and send it to the lab or imaging center
      description: 'Signs exactly the version read (`If-Match`): in one transaction the order becomes `active` with its signer
        and time, its Provenance is written, and it is queued for its lab or imaging center through the outbox (inventory
        #138; D8, D25: `enqueue(db, "lab", "ORM^O01", …)`, the LabOrder shape in contracts/partners/lab). Tracking then moves
        `ordered` → `sent` → `received` → `resulted`, reported back through `/hooks/lab`; for the demo the outbox delivers
        to the simulated lab and imaging center.'
