          description: 400. `malformed-request` (the body is not parseable JSON); `idempotency-key-missing` (the Idempotency-Key
            header is required).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `orders:sign-and-send`); `break-glass-required` (the patient's
            chart is restricted and the user holds no break-glass grant and is not on the care team (D37)); `csrf-check-failed`
            (missing or wrong CSRF header or Origin).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such referral in this clinic or the user's facilities).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `invalid-state-transition` (that move is not allowed from the current status; the problem carries
            `currentState`); `idempotency-request-in-progress` (a request with this Idempotency-Key is still running).
        '412':
          $ref: ../components/responses/PreconditionFailed.yaml
          description: 412. `precondition-failed` (the record changed since it was read; the response carries the current
            `ETag`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a field is invalid; `note` is `required` to cancel); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).
        '428':
          $ref: ../components/responses/PreconditionRequired.yaml
          description: 428. `precondition-required` (the `If-Match` header is missing).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
components:
