# Shri Health API — module `practice-setup`
# x-owner: anand  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Facilities, locations, providers, appointment types, provider schedules, fee schedules, the payer directory and practice payers, lab accounts, note templates (`backend/app/modules/practice_setup/`)
# Stage 4 batch 1. Shapes follow ENDPOINT_INVENTORY rows #151-186 and #230-231. x-owner Anand: he approves these operations.
# Practice configuration, not patient data: every field is `x-phi: none` unless marked otherwise.
# Every editable resource has a version for its `ETag` (ADR-0008): `version` on the admin tables (A41) or FHIR
# `meta_version_id` on locations, providers and schedules. Aligned with the locked schema (D72).
# Payers have two layers (decided by Vimal, 2026-10-23): a read-only platform payer directory (`/payers`) and the practice's
# own payer setup (`/practice-payers`). Lab providers follow the same pattern (D48): read-only `/lab-providers`, set up by onboarding or
# the platform; lab accounts stay practice-level (`/lab-accounts`).
# Batch 1 follow-up (2026-10-24): practice consent requirements (D59); provider schedule writes by FD and ADM under
# `provider-schedules:create|update` (D66).
paths:
  /facilities:
    get:
      operationId: listFacilitys
      summary: List facilities
      description: Lists the practice's facilities.
      tags:
      - practice-setup
      x-owner: anand
      x-permission: practice-setup:read
      x-audit:
        action: R
        category: admin
      x-storage: clinical
      x-release: P0
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - name: active
        in: query
        required: false
        description: Only active (true) or inactive (false) ones.
        schema:
          type: boolean
      responses:
        '200':
          description: One page of facilitys.
          headers:
            X-Request-ID: &id002
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control: &id003
              $ref: ../components/headers/CacheControl.yaml
            RateLimit: &id004
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy: &id005
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityList'
              examples:
                one:
                  summary: One facility
                  value:
                    items:
                    - &id006
                      id: 8b9c0d1e-2f3a-4b4c-8d5e-6f7a8b9c0d1e
                      code: MAIN
                      name: Test Clinic Main Street
                      timeZone: America/Chicago
                      address: &id001
                        lines:
                        - 200 Test Avenue
                        city: Springfield
                        state: IL
                        postalCode: '62702'
                        country: US
                      phone: '+12175550110'
                      npi: '1234567893'
                      placeOfServiceCode: '11'
                      billingLocation: true
                      active: true
                      createdAt: '2026-10-26T13:00:00Z'
                      updatedAt: '2026-10-26T13:00:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `practice-setup:read`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
    post:
      operationId: createFacility
      summary: Create a facility
      description: Creates a facility.
      tags:
      - practice-setup
      x-owner: anand
      x-permission: practice-setup:create
      x-audit:
        action: C
        category: admin
      x-idempotency: supported
      x-storage: clinical
      x-release: P0
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreate'
            examples:
              create:
                summary: New facility
                value:
                  code: MAIN
                  name: Test Clinic Main Street
                  timeZone: America/Chicago
                  address: *id001
                  phone: '+12175550110'
                  npi: '1234567893'
      responses:
        '201':
          description: Created. The new facility.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id002
            Cache-Control: *id003
            RateLimit: *id004
            RateLimit-Policy: *id005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
              examples:
                created:
                  summary: Created
                  value: *id006
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401':
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `practice-setup:create`); `csrf-check-failed` (missing or
            wrong CSRF header or Origin).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (the code
            is already used, or the NPI fails its check digit); `idempotency-key-reused` (the Idempotency-Key was used with
            a different body).
        '429':
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500':
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
