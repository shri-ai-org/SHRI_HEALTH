components:
  schemas:
    SetupCoding:
      description: A code from a code system (practice configuration, not patient data).
      type: object
      additionalProperties: false
      required:
      - system
      - code
      properties:
        system:
          type: string
          format: uri
          maxLength: 300
          description: Code system URI.
          x-phi: none
        code:
          type: string
          maxLength: 64
          description: Code.
          x-phi: none
        display:
          type: string
          maxLength: 500
          description: Display text.
          x-phi: none
    Facility:
      description: A practice site (the admin `facility` row and its FHIR-shaped site `Location`).
      type: object
      required:
      - id
      - code
      - name
      - timeZone
      - address
      - active
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Facility ID.
          x-phi: internal-id
        code: &id031
          type: string
          minLength: 1
          maxLength: 40
          description: Short code, unique in the practice.
          x-phi: none
        name: &id032
          type: string
          minLength: 1
          maxLength: 200
          description: Name.
          x-phi: none
        timeZone: &id033
          type: string
          maxLength: 64
          pattern: ^[A-Za-z]+(/[A-Za-z0-9_+-]+)+$
          description: IANA time zone, e.g. `America/Chicago`. Appointments display in this zone (D40). Required by the API;
            `facility.timezone` is still nullable in the schema, so NOT NULL is migration item A45.
          x-phi: none
        address: &id034
          $ref: ../components/schemas/Address.yaml
          description: Street address.
          x-phi: none
        phone: &id035
          $ref: ../components/schemas/PhoneNumber.yaml
          description: Main phone.
          x-phi: none
        npi: &id036
          type: string
          pattern: ^\d{10}$
          maxLength: 10
          description: Facility (type 2) NPI; checked with the NPI check digit.
          x-phi: none
        cliaNumber: &id037
          type: string
          pattern: ^\d{2}D\d{7}$
          maxLength: 10
          description: CLIA number, for in-office testing.
          x-phi: none
        placeOfServiceCode: &id038
          type: string
          pattern: ^\d{2}$
          maxLength: 2
          default: '11'
          description: CMS place-of-service code; `11` office.
          x-phi: none
        billingLocation: &id039
          type: boolean
          default: true
          description: Appears as a billing location on claims.
          x-phi: none
        active: &id040
          type: boolean
          description: False hides it from new work; nothing is ever deleted.
          x-phi: none
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Created.
          x-phi: none
        updatedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Last change.
          x-phi: none
    FacilityCreate:
      description: Body to create a facilitie.
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - timeZone
      - address
      properties:
        code: *id031
        name: *id032
        timeZone: *id033
        address: *id034
        phone: *id035
        npi: *id036
        cliaNumber: *id037
        placeOfServiceCode: *id038
        billingLocation: *id039
    FacilityPatch:
      description: 'JSON Merge Patch. Fields left out stay unchanged; arrays are replaced whole. Not editable: `code`.'
      type: object
      additionalProperties: false
      properties:
        name: *id032
        timeZone: *id033
        address: *id034
        phone: *id035
        npi: *id036
        cliaNumber: *id037
        placeOfServiceCode: *id038
        billingLocation: *id039
        active: *id040
    FacilityList:
      description: One page of facilities.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Facility'
          description: The items on this page.
          x-phi: none
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
    Location:
      description: A place inside a facility, such as an exam room used for rooming (FHIR-shaped `Location`, part of the facility's
        site).
      type: object
      required:
      - id
      - facilityId
      - name
      - physicalType
      - active
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Location ID.
          x-phi: internal-id
        facilityId: &id041
          $ref: ../components/schemas/Id.yaml
          description: The facility it belongs to.
          x-phi: internal-id
        name: &id042
          type: string
          minLength: 1
          maxLength: 200
          description: Name, e.g. "Exam room 2".
          x-phi: none
        description: &id043
          type: string
          maxLength: 500
          description: Description.
          x-phi: none
        physicalType: &id044
          type: string
          enum:
          - bu
          - wi
          - lvl
          - ro
          description: 'FHIR location-physical-type: `bu` building, `wi` wing, `lvl` level, `ro` room.'
          x-phi: none
        active: *id040
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Created.
          x-phi: none
        updatedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Last change.
          x-phi: none
    LocationCreate:
      description: Body to create a location.
      type: object
      additionalProperties: false
      required:
      - facilityId
      - name
      - physicalType
      properties:
        facilityId: *id041
        name: *id042
        description: *id043
        physicalType: *id044
    LocationPatch:
      description: 'JSON Merge Patch. Fields left out stay unchanged; arrays are replaced whole. Not editable: `facilityId`.'
      type: object
      additionalProperties: false
      properties:
        name: *id042
        description: *id043
        physicalType: *id044
        active: *id040
    LocationList:
      description: One page of locations.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Location'
          description: The items on this page.
          x-phi: none
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
    ProviderQualification:
      description: A degree or state license (`practitioner_qualification`).
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/SetupCoding'
          description: Degree or license type, e.g. HL7 v2-0360 `MD`, `DO`, `NP`, `PA`.
          x-phi: none
        licenseNumber:
          type: string
          maxLength: 200
          description: State license number.
          x-phi: none
        state:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
          description: Issuing state.
          x-phi: none
        issuer:
          type: string
          maxLength: 300
          description: Issuing board.
          x-phi: none
        startDate:
          $ref: ../components/schemas/Date.yaml
          description: Valid from.
          x-phi: none
        endDate:
          $ref: ../components/schemas/Date.yaml
          description: Valid until.
          x-phi: none
    Provider:
      description: 'A clinician who sees patients (FHIR-shaped `Practitioner` with a `PractitionerRole` per facility). DEA
        numbers are never exposed: they are references to OpenBao.'
      type: object
      required:
      - id
      - name
      - npi
      - facilityIds
      - active
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Provider ID.
          x-phi: internal-id
        name: &id045
          $ref: ../components/schemas/HumanName.yaml
          description: Name (a staff member, not a patient).
          x-phi: none
        npi: &id046
          type: string
          pattern: ^\d{10}$
