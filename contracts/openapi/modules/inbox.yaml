                    assignee: &id026
                      type: user
                      id: 3d4e5f6a-7b8c-4d9e-8f0a-2b3c4d5e6f7a
                      displayName: Sam Okafor (RN)
                    facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                    overdue: false
                    escalationLevel: 0
                    restricted: false
                    patient: *id001
                    createdBy: *id013
                    createdAt: '2026-11-03T16:10:00Z'
                    updatedAt: '2026-11-03T16:12:00Z'
                    completedAt: '2026-11-03T16:12:00Z'
                    completedBy: *id013
        '400': *id023
        '401': *id006
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `inbox:update`); `csrf-check-failed` (missing or wrong CSRF
