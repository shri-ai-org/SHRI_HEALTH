    patch:
      operationId: updateInboxItem
      summary: Update an inbox item
      description: 'Takes an item from a queue (set `assignee` to yourself), reassigns it, changes its status between `open`,
        `in-progress` and `on-hold`, or changes its priority or due time, with `If-Match` (inventory #215; DATA_OWNERSHIP
        §5.9). A new assignee gets `inbox.item-assigned`. ADM may reassign items at their facilities (Q5).'
      tags:
      - inbox
      x-owner: anand
      x-permission: inbox:update
      x-audit:
        action: U
        category: phi-write
        patient: result
      x-storage: admin
      x-events:
      - inbox.item-assigned
      x-release: P0
      security: &id018
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - $ref: ../components/parameters/IfMatch.yaml
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/InboxItemPatch'
            examples:
              take:
                summary: Take from the queue
                value:
                  assignee:
                    type: user
                    id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
              start:
                summary: Start work
                value:
                  status: in-progress
      responses:
        '200':
          description: The item, with its thread.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id002
            Cache-Control: *id003
            RateLimit: *id004
            RateLimit-Policy: *id005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
              examples:
                taken:
                  summary: Taken
                  value: *id015
        '400': &id023
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `malformed-request` (the body is not parseable JSON).
        '401': *id006
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `inbox:update`); `csrf-check-failed` (missing or wrong CSRF
            header or Origin); only the assignee, the creator (priority and due time) or ADM (reassignment) may change an
            item.
        '404': *id016
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `invalid-state-transition` (the item is completed or cancelled; the problem carries `currentState`).
        '412':
          $ref: ../components/responses/PreconditionFailed.yaml
          description: 412. `precondition-failed` (`If-Match` does not match the current version, for example because a colleague
            took the item from the queue first).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: '422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (`errors`
            names it: `/assignee` `invalid-reference` (the assignee does not work at the item''s facility or may not see this
            kind of item), `/status` `not-allowed-value` (only the assignee changes the status), `/dueAt` `out-of-range` (in
            the past)).'
        '428':
          $ref: ../components/responses/PreconditionRequired.yaml
          description: 428. `precondition-required` (`If-Match` is missing).
        '429': *id007
        '500': *id008
  /inbox/{inboxItemId}/complete:
    parameters: *id017
    post:
      operationId: completeInboxItem
      summary: Complete an inbox item
      description: 'Marks the item done (inventory #216). Kinds that wait for an action are completed by that action, not
        here (Q4): `cosign` by co-signing, `cosign-returned` by the addendum, `unsigned-note` by signing, `fax-indexing` by
        filing, `result-review` by acknowledging, `refill-request` by responding, `unmatched-result` by matching or rejecting.
        Raises `inbox.item-completed`.'
      tags:
      - inbox
      x-owner: anand
      x-permission: inbox:complete
      x-audit:
        action: E
        category: phi-write
        patient: result
      x-storage: admin
      x-events:
      - inbox.item-completed
      x-release: P0
      security: *id018
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxCompleteRequest'
            examples:
              done:
                summary: Done
                value:
                  comment: Moved to Thursday 10:30.
      responses:
        '200':
          description: The item, completed, with its thread.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id002
            Cache-Control: *id003
            RateLimit: *id004
            RateLimit-Policy: *id005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
              examples:
                completed:
                  summary: Completed
                  value:
                    id: 0a1b2c3d-4e5f-4a6b-9c7d-8e9f0a1b2c3d
                    itemType: task
                    status: completed
                    priority: routine
                    title: Please move this follow-up to next week
                    body: Patient asked for a later follow-up; any day after Tuesday.
                    assignee: *id019
                    facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                    dueAt: '2026-11-05T22:00:00Z'
                    overdue: false
                    escalationLevel: 0
                    restricted: false
                    patient: *id001
                    subject: *id010
                    createdBy: *id011
                    createdAt: '2026-11-03T15:40:00Z'
                    updatedAt: '2026-11-04T14:20:00Z'
                    thread:
                    - *id020
                    - *id021
                    - event: status-change
                      at: '2026-11-04T14:20:00Z'
                      by: *id022
                      fromStatus: open
                      toStatus: completed
                      comment: Moved to Thursday 10:30.
                    completedAt: '2026-11-04T14:20:00Z'
                    completedBy: *id022
        '400': *id023
        '401': *id006
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `inbox:complete`); `csrf-check-failed` (missing or wrong CSRF
            header or Origin); only the assignee may complete an item.
        '404': *id016
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `invalid-state-transition` (already completed or cancelled; the problem carries `currentState`).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (this
            kind is completed by its action (Q4); `errors` names `/itemType` `not-allowed-value`, and `detail` names the action).
        '429': *id007
        '500': *id008
  /inbox/{inboxItemId}/cancel:
