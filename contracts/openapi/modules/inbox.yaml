                      event: created
                      at: '2026-11-03T15:40:00Z'
                      by: *id011
                      assignee: *id012
                    - &id021
                      event: assigned
                      at: '2026-11-04T14:05:00Z'
                      by: &id022
                        id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
