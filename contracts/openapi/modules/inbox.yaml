# Shri Health API — module `inbox`
# x-owner: anand  (implements these operations and approves their contract; Vimal approves standards conformance)
# Scope: Inbox items and messages (`backend/app/modules/inbox/`)
# Contract batch 3 (the inbox part of inventory B3), 2026-10-26: rows #214-217 and the new rows #252-255, from the approved
# plan contracts/docs/BATCH3_PLAN.md (Q1-Q13 as recommended; D77-D81) and the locked schema (D72: admin.work_item and
# admin.work_item_event). One inbox for results, refills, notes to sign or co-sign, faxes to file, messages and tasks
# (FRS FR-ENC-05). Items are created by POST /messages or by the inbox service from events; nothing is deleted (D14).
paths:
  /inbox:
    get:
      operationId: listInboxItems
      summary: List inbox items
      description: 'The user''s inbox (inventory #214; FRS FR-ENC-05): by default their own items and their roles'' queues
        at their facilities, open, in progress or on hold. Only kinds the user may read are listed, and items about a restricted
        chart the user may not open come without the patient (BATCH3_PLAN §5; D37). Filters take kinds, statuses and IDs only,
        never PHI (D13). Audited with the patient IDs returned.'
      tags:
      - inbox
      x-owner: anand
      x-permission: inbox:read
      x-audit: &id009
        action: R
        category: phi-read
        patient: result
      x-storage: admin
      x-release: P0
      parameters:
      - $ref: ../components/parameters/Limit.yaml
      - $ref: ../components/parameters/Cursor.yaml
      - name: view
        in: query
        required: false
        description: '`assigned` (default: mine and my roles'' queues), `mine`, `queue` (my roles only), `sent` (items I created),
          `facility` (ADM: everything assigned at my facilities, to reassign it; Q5).'
        schema:
          type: string
          enum:
          - assigned
          - mine
          - queue
          - sent
          - facility
          default: assigned
      - name: itemType
        in: query
        required: false
        style: form
        explode: true
        description: Only these kinds; repeat the parameter for several.
        schema:
          type: array
          maxItems: 15
          items:
            type: string
            maxLength: 40
      - name: status
        in: query
        required: false
        style: form
        explode: true
        description: 'Only these statuses; repeat for several. Default: `open`, `in-progress`, `on-hold`.'
        schema:
          type: array
          maxItems: 5
          items:
            type: string
            enum: &id027
            - open
            - in-progress
            - on-hold
            - completed
            - cancelled
      - name: priority
        in: query
        required: false
        style: form
        explode: true
        description: Only these priorities; repeat for several.
        schema:
          type: array
          maxItems: 4
          items:
            type: string
            enum: &id028
            - routine
            - urgent
            - asap
            - stat
      - name: patientId
        in: query
        required: false
        description: Only items about this patient (an opaque ID).
        schema:
          $ref: ../components/schemas/Id.yaml
      - name: facilityId
        in: query
        required: false
        description: Only this facility (one of the user's).
        schema:
          $ref: ../components/schemas/Id.yaml
      - name: dueBefore
        in: query
        required: false
        description: Only items due before this time.
        schema:
          $ref: ../components/schemas/Timestamp.yaml
      responses:
        '200':
          description: One page of inbox items.
          headers:
            X-Request-ID: &id002
              $ref: ../components/headers/XRequestId.yaml
            Cache-Control: &id003
              $ref: ../components/headers/CacheControl.yaml
            RateLimit: &id004
              $ref: ../components/headers/RateLimit.yaml
            RateLimit-Policy: &id005
              $ref: ../components/headers/RateLimitPolicy.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItemList'
              examples:
                page:
                  summary: One page
                  value:
                    items:
                    - &id025
                      id: 0a1b2c3d-4e5f-4a6b-9c7d-8e9f0a1b2c3d
                      itemType: task
                      status: open
                      priority: routine
                      title: Please move this follow-up to next week
                      body: Patient asked for a later follow-up; any day after Tuesday.
                      assignee: &id012
                        type: role
                        id: 4e5f6a7b-8c9d-4e0f-9a1b-3c4d5e6f7a8b
                        displayName: Front desk
                      facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                      dueAt: '2026-11-05T22:00:00Z'
                      overdue: false
                      escalationLevel: 0
                      restricted: false
                      patient: &id001
                        id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                        name:
                          given:
                          - Maria712
                          family: Ortiz187
                        birthDate: '1984-07-19'
                      subject: &id010
                        type: appointment
                        id: 9b0c1d2e-3f4a-4b5c-8d6e-7f8a9b0c1d2e
                      createdBy: &id011
                        id: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                        displayName: Jordan Reyes (MA)
                      createdAt: '2026-11-03T15:40:00Z'
                      updatedAt: '2026-11-03T15:40:00Z'
                    - id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                      itemType: cosign
                      status: open
                      priority: routine
                      title: Note to co-sign
                      assignee:
                        type: user
                        id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        displayName: Dr. Lowe58
                      facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                      dueAt: '2026-11-06T15:35:00Z'
                      overdue: false
                      escalationLevel: 0
                      restricted: false
                      patient: *id001
                      subject:
                        type: note
                        id: 6e7f8a9b-0c1d-4e2f-9a3b-4c5d6e7f8a9b
                      encounterId: 5d6e7f8a-9b0c-4d1e-8f2a-3b4c5d6e7f8a
                      createdAt: '2026-11-03T15:35:00Z'
                      updatedAt: '2026-11-03T15:35:00Z'
                    - id: c3d4e5f6-a7b8-4c9d-8e0f-2a3b4c5d6e7f
                      itemType: result-review
                      status: open
                      priority: urgent
                      title: Result to review
                      assignee:
                        type: user
                        id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        displayName: Dr. Lowe58
                      facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                      overdue: false
                      escalationLevel: 0
                      restricted: true
                      subject:
                        type: result
                        id: d4e5f6a7-b8c9-4d0e-9f1a-3b4c5d6e7f8a
                      createdAt: '2026-11-03T16:02:00Z'
                      updatedAt: '2026-11-03T16:02:00Z'
        '400':
          $ref: ../components/responses/BadRequest.yaml
          description: 400. `invalid-cursor` (the cursor is expired or tampered with).
        '401': &id006
          $ref: ../components/responses/Unauthorized.yaml
          description: 401. `unauthenticated` (no valid session); `session-expired` (the session ended).
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `inbox:read`).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (a `facilityId` the user is not assigned to).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (`view=facility`
            without the ADM role; `errors` names `/view` `not-allowed-value`).
        '429': &id007
          $ref: ../components/responses/TooManyRequests.yaml
          description: 429. `rate-limited` (too many requests).
        '500': &id008
          $ref: ../components/responses/InternalError.yaml
          description: 500. `internal-error` (unexpected error).
  /inbox/summary:
    get:
      operationId: getInboxSummary
      summary: Get inbox counts
      description: 'Badge counts for the user''s `assigned` view, by kind and status (new inventory row #255; Q10). Counts
        only, no patient data, so it is not audited (SECURITY_MODEL §6 `none`).'
      tags:
      - inbox
      x-owner: anand
      x-permission: inbox:read
      x-audit:
        action: R
        category: none
      x-storage: admin
      x-release: P0
      responses:
        '200':
          description: The counts.
          headers:
            X-Request-ID: *id002
            Cache-Control: *id003
            RateLimit: *id004
            RateLimit-Policy: *id005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxSummary'
              examples:
                counts:
                  summary: Counts
                  value:
                    total: 7
                    overdue: 1
                    byType:
                    - itemType: result-review
                      open: 3
                      inProgress: 0
                      onHold: 0
                      overdue: 1
                    - itemType: cosign
                      open: 2
                      inProgress: 0
                      onHold: 0
                      overdue: 0
                    - itemType: message
                      open: 1
                      inProgress: 1
                      onHold: 0
                      overdue: 0
        '401': *id006
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `inbox:read`).
        '429': *id007
        '500': *id008
  /inbox/{inboxItemId}:
    parameters: &id017
    - name: inboxItemId
      in: path
      required: true
      description: Inbox item ID.
      schema:
        $ref: ../components/schemas/Id.yaml
    get:
      operationId: getInboxItem
      summary: Get one inbox item
      description: 'One item with its thread and the `ETag` that `PATCH` needs (new inventory row #252; list items carry no
        ETag, API_STANDARDS §11).'
      tags:
      - inbox
      x-owner: anand
      x-permission: inbox:read
      x-audit: *id009
      x-storage: admin
      x-release: P0
      responses:
        '200':
          description: The item, with its thread.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id002
            Cache-Control: *id003
            RateLimit: *id004
            RateLimit-Policy: *id005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
              examples:
                task:
