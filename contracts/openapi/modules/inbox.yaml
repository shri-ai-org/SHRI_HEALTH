        '404': *id016
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `invalid-state-transition` (already completed or cancelled).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (only
            messages and tasks can be cancelled; `errors` names `/itemType` `not-allowed-value`).
        '429': *id007
        '500': *id008
  /inbox/{inboxItemId}/replies:
    parameters: *id017
    post:
      operationId: replyToInboxItem
      summary: Reply on an inbox item
      description: 'Adds a reply to the item''s thread (new inventory row #254; D38: the inbox holds message threads). By
        default it hands the item to the other party (`assignBack`), who gets `inbox.item-assigned`. Anyone who can see the
        item may reply; replies are insert-only.'
      tags:
      - inbox
      x-owner: anand
      x-permission: messages:create
      x-audit:
        action: C
        category: phi-write
        patient: result
      x-idempotency: supported
      x-storage: admin
      x-events:
      - inbox.item-assigned
      x-release: P0
      security: *id018
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxReplyRequest'
            examples:
              reply:
                summary: Reply
                value:
                  text: 'Rechecked: 128/82 seated, left arm.'
      responses:
        '200':
          description: The item, with the reply in its thread.
          headers:
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id002
            Cache-Control: *id003
            RateLimit: *id004
            RateLimit-Policy: *id005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
              examples:
                replied:
                  summary: Replied and handed back
                  value: *id024
        '400': *id023
        '401': *id006
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `messages:create`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin).
        '404': *id016
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `invalid-state-transition` (the item is completed or cancelled); `idempotency-request-in-progress`
            (a request with this Idempotency-Key is still running).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: 422. `validation-failed` (a body field or a parameter is invalid); `idempotency-key-reused` (the Idempotency-Key
            was used with a different body).
        '429': *id007
        '500': *id008
  /messages:
    post:
      operationId: createMessage
      summary: Send a message or create a task
      description: 'Creates a `message` or a `task` for one user or one role at a facility (inventory #217; Q1, Q2; Minalini''s
        item). Clinicians ask for appointment changes this way (D67): a task linked to the appointment, for the front-desk
        role. The sender must be able to open the patient and the linked record (D80); a recipient who cannot sees the link
        but not the record. Raises `inbox.item-assigned`; notifications outside the app say only "You have a new item in Shri
        Health" (D81).'
      tags:
      - inbox
      x-owner: anand
      x-permission: messages:create
      x-audit:
        action: C
        category: phi-write
        patient: body:/patientId
      x-idempotency: supported
      x-storage: admin
      x-events:
      - inbox.item-assigned
      x-release: P0
      security: *id018
      parameters:
      - $ref: ../components/parameters/IdempotencyKeyOptional.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
            examples:
              appointmentChange:
                summary: 'Task: ask the front desk to move an appointment (D67)'
                value:
                  kind: task
                  assignee:
                    type: role
                    id: 4e5f6a7b-8c9d-4e0f-9a1b-3c4d5e6f7a8b
                  facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                  title: Please move this follow-up to next week
                  body: Patient asked for a later follow-up; any day after Tuesday.
                  dueAt: '2026-11-05T22:00:00Z'
                  patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  subject: *id010
              message:
                summary: Message to a nurse about a patient
                value:
                  kind: message
                  assignee:
                    type: user
                    id: 3d4e5f6a-7b8c-4d9e-8f0a-2b3c4d5e6f7a
                  facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                  title: Recheck blood pressure today
                  body: Please recheck the blood pressure before discharge and let me know.
                  priority: urgent
                  patientId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      responses:
        '201':
          description: Created. The new item.
          headers:
            Location:
              $ref: ../components/headers/Location.yaml
            ETag:
              $ref: ../components/headers/ETag.yaml
            X-Request-ID: *id002
            Cache-Control: *id003
            RateLimit: *id004
            RateLimit-Policy: *id005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItem'
              examples:
                task:
                  summary: Task created
                  value: *id025
                message:
                  summary: Message sent
                  value:
                    id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    itemType: message
                    status: open
                    priority: urgent
                    title: Recheck blood pressure today
                    body: Please recheck the blood pressure before discharge and let me know.
                    assignee: *id026
                    facilityId: 5f6a7b8c-9d0e-4f1a-8b2c-4d5e6f7a8b9c
                    overdue: false
                    escalationLevel: 0
                    restricted: false
                    patient: *id001
                    createdBy: *id013
                    createdAt: '2026-11-03T16:10:00Z'
                    updatedAt: '2026-11-03T16:10:00Z'
        '400': *id023
        '401': *id006
        '403':
          $ref: ../components/responses/Forbidden.yaml
          description: 403. `permission-denied` (the role lacks `messages:create`); `csrf-check-failed` (missing or wrong
            CSRF header or Origin); `break-glass-required` (the patient's chart is restricted and the sender holds no break-glass
            grant and is not on the care team (D37)).
        '404':
          $ref: ../components/responses/NotFound.yaml
          description: 404. `not-found` (no such patient, linked record, facility, user or role that the sender can see; the
            sender must be able to open the linked record (D80)).
        '409':
          $ref: ../components/responses/Conflict.yaml
          description: 409. `idempotency-request-in-progress` (a request with this Idempotency-Key is still running); `patient-merged`
            (the patient was merged into another record).
        '422':
          $ref: ../components/responses/UnprocessableContent.yaml
          description: '422. `validation-failed` (a body field or a parameter is invalid); `business-rule-violation` (`errors`
            names it: `/facilityId` `not-allowed-value` (not one of the sender''s facilities), `/assignee` `invalid-reference`
            (the user does not work at that facility), `/subject` `conflicting-fields` (the record belongs to another patient),
            `/dueAt` `not-allowed-value` (a due time on a message) or `out-of-range` (in the past)); `idempotency-key-reused`
            (the Idempotency-Key was used with a different body).'
        '429': *id007
        '500': *id008
components:
  schemas:
    InboxItemType:
      description: 'Kind of inbox item (BATCH3_PLAN §3). An extensible enum (API_STANDARDS §6.5): later batches add kinds,
        so screens show an unknown kind as a generic item. `message` and `task` come from `POST /messages`; every other kind
        is created and, except where noted, completed by the inbox service from an event: `cosign` and `cosign-returned` (notes),
        `unsigned-note` (a draft note at check-out), `fax-indexing` (an incoming fax; filing completes it), `document-review`
        (a filed document routed to a clinician), `result-review` (B5; within 60 seconds, FR-ORD-02), `refill-request` and
        `prescription-failure` (B5), `unmatched-result` (B5), `break-glass-review` (for the compliance officer, A36), `eligibility`,
        `claim-rejection` and `rooming`.'
      type: string
      maxLength: 40
      x-extensible-enum:
      - message
      - task
      - cosign
      - cosign-returned
      - unsigned-note
      - fax-indexing
      - document-review
      - result-review
      - refill-request
      - prescription-failure
      - unmatched-result
      - break-glass-review
      - eligibility
      - claim-rejection
      - rooming
    InboxItemStatus:
      description: Where the item is (DATA_OWNERSHIP §5.9). `open` (waiting; in a role queue or with one person), `in-progress`,
        `on-hold` (waiting on someone else), `completed`, `cancelled` (a message or task closed with a reason). Who has it
        is `assignee`, not the status.
      type: string
      enum: *id027
    InboxPriority:
      description: 'Priority, FHIR request priority (Q3): `routine`, `urgent`, `asap`, `stat`. Lists sort `stat` first.'
      type: string
      enum: *id028
    StaffRef:
      description: A staff member, for display.
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: User ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: Name as shown on screens (staff, not patient data).
          x-phi: none
    InboxAssignee:
      description: 'Who has the item: one user, or one role (a shared queue at the item''s facility). Never both (`ck_work_item_one_assignee`).'
      type: object
      required:
      - type
      - id
      - displayName
      properties:
        type:
          type: string
          enum:
          - user
          - role
          description: '`user` or `role`.'
          x-phi: none
        id:
          $ref: ../components/schemas/Id.yaml
          description: User or role ID.
          x-phi: internal-id
        displayName:
          type: string
          maxLength: 200
          description: User name or role name, for display.
          x-phi: none
    InboxAssigneeInput:
      description: 'Who should have the item: a user or a role. The server checks that the assignee works at the item''s facility
        and may see the item (BATCH3_PLAN §5); otherwise `422`.'
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - user
          - role
          description: '`user` or `role`.'
          x-phi: none
        id:
          $ref: ../components/schemas/Id.yaml
          description: User or role ID.
          x-phi: internal-id
    InboxSubject:
      description: The record the item is about, at most one (`ck_work_item_one_subject`). The link is always shown; opening
        it goes through the record's own endpoint, with its own permission and the restricted-chart rules (D37, D80).
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          maxLength: 40
          x-extensible-enum:
          - result
          - note
          - document
          - prescription
          - order
          - appointment
          - unmatched-result
          - claim
          - fax
          description: Kind of record (an extensible enum).
          x-phi: none
        id:
          $ref: ../components/schemas/Id.yaml
          description: Record ID.
          x-phi: internal-id
    InboxPatient:
      description: The patient, minimum necessary for the list (name and date of birth). Absent when the item has no patient,
        or when the patient's chart is restricted and the user has no break-glass grant and is not on the care team (D37);
        `restricted` on the item says which.
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Patient ID.
          x-phi: internal-id
        name:
          $ref: ../components/schemas/HumanName.yaml
          description: Official name.
          x-phi: identifier
        birthDate:
          $ref: ../components/schemas/Date.yaml
          description: Date of birth.
          x-phi: identifier
    InboxThreadEvent:
      description: 'One step in the item''s history (`work_item_event`), oldest first: created, assigned (including reassignment
        and taking it from a queue), status change, comment (a reply), escalated. Insert-only.'
      type: object
      required:
      - event
      - at
      properties:
        event:
          type: string
          enum:
          - created
          - assigned
          - status-change
          - comment
          - escalated
          description: What happened.
          x-phi: none
        at:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it happened.
          x-phi: none
        by:
          $ref: '#/components/schemas/StaffRef'
          description: Who did it. Absent for the system (events, escalation).
          x-phi: none
        fromStatus:
          $ref: '#/components/schemas/InboxItemStatus'
          description: Status before (status-change).
          x-phi: none
        toStatus:
          $ref: '#/components/schemas/InboxItemStatus'
          description: Status after (status-change).
          x-phi: none
        assignee:
          $ref: '#/components/schemas/InboxAssignee'
          description: The new assignee (assigned, escalated).
          x-phi: none
        escalationLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 9
          description: The level reached (escalated).
          x-phi: none
        comment:
          type: string
          maxLength: 4000
          description: The reply, completion comment or cancel reason. May contain PHI.
          x-phi: clinical
    InboxItem:
      description: One inbox item (`work_item`; BATCH3_PLAN §3). Visible only to users at its facility who are its assignee,
        hold its role, or sent it, and who hold the read permission for its kind (§5).
      type: object
      required:
      - id
      - itemType
      - status
      - priority
      - title
      - assignee
      - facilityId
      - overdue
      - escalationLevel
      - restricted
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: ../components/schemas/Id.yaml
          description: Inbox item ID.
          x-phi: internal-id
        itemType:
          $ref: '#/components/schemas/InboxItemType'
          description: Kind of item.
          x-phi: none
        status:
          $ref: '#/components/schemas/InboxItemStatus'
          description: Where the item is.
          x-phi: none
        priority:
          $ref: '#/components/schemas/InboxPriority'
          description: Priority.
          x-phi: none
        title:
          type: string
          maxLength: 200
          description: Short title. System items name the kind of work ("Result to review"), never a patient; a sender's free
            text may contain anything (D81).
          x-phi: clinical
        body:
          type: string
          maxLength: 4000
          description: Message or task text. Messages and tasks only. May contain PHI (D81).
          x-phi: clinical
        assignee:
          $ref: '#/components/schemas/InboxAssignee'
          description: Who has it.
          x-phi: none
        facilityId:
          $ref: ../components/schemas/Id.yaml
          description: Facility the item belongs to; only users assigned to it see the item.
          x-phi: internal-id
        dueAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Due time (UTC; shown in facility time, D40). Absent for no due time.
          x-phi: none
        overdue:
          type: boolean
          description: True when `dueAt` has passed and the item is not closed. Computed.
          x-phi: none
        escalationLevel:
          type: integer
          format: int32
          minimum: 0
          maximum: 9
          description: How many times it has been escalated (Q6; critical results D78). Read-only.
          x-phi: none
        escalatedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was last escalated. Read-only.
          x-phi: none
        restricted:
          type: boolean
          description: 'True when the item is about a restricted chart the user may not open (no grant, not on the care team;
            D37): `patient` is left out.'
          x-phi: none
        patient:
          $ref: '#/components/schemas/InboxPatient'
          description: The patient, when there is one and the user may see it.
          x-phi: identifier
        subject:
          $ref: '#/components/schemas/InboxSubject'
          description: The linked record, if any (D80).
          x-phi: none
        encounterId:
          $ref: ../components/schemas/Id.yaml
          description: The encounter, if any.
          x-phi: internal-id
        corrected:
          type: boolean
          description: 'For `result-review`: the result was corrected after it was first reviewed (B5).'
          x-phi: none
        createdBy:
          $ref: '#/components/schemas/StaffRef'
          description: The sender. Absent for items the system created.
          x-phi: none
        createdAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was created.
          x-phi: none
        updatedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it last changed.
          x-phi: none
        completedAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: When it was completed or cancelled.
          x-phi: none
        completedBy:
          $ref: '#/components/schemas/StaffRef'
          description: Who completed or cancelled it. Absent when the system completed it (by the action it was waiting for).
          x-phi: none
        thread:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/InboxThreadEvent'
          description: The item's history and replies, oldest first. Only in the single GET and the action responses, not
            in lists.
          x-phi: clinical
    InboxItemList:
      description: One page of inbox items, highest priority first, then overdue, then by due time, then oldest.
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/InboxItem'
          description: The items on this page.
          x-phi: clinical
        nextCursor:
          $ref: ../components/schemas/Cursor.yaml
          description: Cursor for the next page. Absent on the last page.
          x-phi: none
    InboxTypeCount:
      description: Counts for one kind of item.
      type: object
      required:
      - itemType
      - open
      - inProgress
      - onHold
      - overdue
      properties:
        itemType:
          $ref: '#/components/schemas/InboxItemType'
          description: Kind of item.
          x-phi: none
        open:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Open items.
          x-phi: none
        inProgress:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Items in progress.
          x-phi: none
        onHold:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Items on hold.
          x-phi: none
        overdue:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Of those, overdue.
          x-phi: none
    InboxSummary:
      description: Badge counts for the user's `assigned` view (their own items and their roles' queues), counts only, no
        patient data (Q10).
      type: object
      required:
      - total
      - overdue
      - byType
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Items not yet completed or cancelled.
          x-phi: none
        overdue:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Of those, overdue.
          x-phi: none
        byType:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/InboxTypeCount'
          description: Counts per kind; kinds with no items are left out.
          x-phi: none
    MessageCreate:
      description: Body to send a message or create a task (#217; Q1; Minalini's item). The sender must work at `facilityId`,
        and must be able to open `patientId` and the linked `subject` (D80); a user assignee must work there too.
      type: object
      additionalProperties: false
      required:
      - kind
      - assignee
      - facilityId
      - title
      properties:
        kind:
          type: string
          enum:
          - message
          - task
          description: '`message`, or `task` (a message with an optional due time). Clinicians ask for appointment changes
            with a task linked to the appointment and assigned to the front-desk role (D67).'
          x-phi: none
        assignee:
          $ref: '#/components/schemas/InboxAssigneeInput'
          description: One user or one role (Q2).
          x-phi: none
        facilityId:
          $ref: ../components/schemas/Id.yaml
          description: Facility the item belongs to.
          x-phi: internal-id
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Short title. May contain PHI; notifications outside the app never show it (D81).
          x-phi: clinical
        body:
          type: string
          maxLength: 4000
          description: Text. May contain PHI.
          x-phi: clinical
        priority:
          $ref: '#/components/schemas/InboxPriority'
          description: Priority. Default `routine`.
          x-phi: none
        dueAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: Due time, tasks only.
          x-phi: none
        patientId:
          $ref: ../components/schemas/Id.yaml
          description: The patient, if any.
          x-phi: internal-id
        subject:
          $ref: '#/components/schemas/InboxSubject'
          description: A linked record, if any; its patient must be `patientId`.
          x-phi: none
    InboxItemPatch:
      description: Fields to change (JSON merge patch, with `If-Match`). `status` takes only `open`, `in-progress` and `on-hold`;
        completing and cancelling are actions. To take an item from a queue, set `assignee` to yourself.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        assignee:
          $ref: '#/components/schemas/InboxAssigneeInput'
          description: New assignee (take, or reassign; ADM for items at their facilities, Q5).
          x-phi: none
        status:
          type: string
          enum:
          - open
          - in-progress
          - on-hold
          description: New status (assignee only).
          x-phi: none
        priority:
          $ref: '#/components/schemas/InboxPriority'
          description: New priority (assignee or creator).
          x-phi: none
        dueAt:
          $ref: ../components/schemas/Timestamp.yaml
          description: New due time (assignee or creator).
          x-phi: none
    InboxCompleteRequest:
      description: Body to complete an item. Optional.
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 2000
          description: What was done. May contain PHI.
          x-phi: clinical
    InboxCancelRequest:
      description: Body to cancel a message or task.
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why it is cancelled, e.g. "Sent to the wrong person." Kept in the thread.
          x-phi: clinical
    InboxReplyRequest:
      description: Body to reply on an item (a thread, D38).
      type: object
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The reply. May contain PHI.
          x-phi: clinical
        assignBack:
          type: boolean
          default: true
          description: Hand the item to the other party (the sender when the assignee replies, the assignee when the sender
            replies). Default true.
          x-phi: none
