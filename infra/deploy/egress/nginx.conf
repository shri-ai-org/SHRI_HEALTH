# The API's only way out (Vimal, 10 Nov: outbound HTTPS to api.anthropic.com only).
#
# The API and the worker sit on the `backend` network, which has no route to the internet. On
# that network this container answers for the name api.anthropic.com (a network alias), so the
# API's HTTPS connection comes here. Nginx reads only the name the client asks for (TLS SNI) and
# passes the still-encrypted connection to the real api.anthropic.com; it never decrypts, so the
# client checks Anthropic's real certificate end to end. Any other name is refused.
#
# The real address is looked up through a public resolver, not Docker's: on `backend` Docker would
# answer api.anthropic.com with this container's own address.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    log_format egress '$time_iso8601 from=$remote_addr name=$ssl_preread_server_name '
                      'to=$upstream_addr status=$status sent=$bytes_sent received=$bytes_received';
    access_log /dev/stdout egress;

    resolver 1.1.1.1 9.9.9.9 ipv6=off valid=300s;
    resolver_timeout 5s;

    map $ssl_preread_server_name $destination {
        api.anthropic.com  api.anthropic.com:443;
        default            127.0.0.1:9;  # nothing listens there: any other name is refused
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $destination;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;  # long model replies
    }
}
