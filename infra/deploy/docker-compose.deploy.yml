# The test-server overlay: the development stack (infra/compose/docker-compose.yml) made fit for
# one Linux host with Docker (an EC2 instance, a VM, or a laptop for the demo fallback). Run it
# only through infra/deploy/deploy.sh, which supplies the settings below from an env file kept
# outside the repository (mode 600) and computes SHRI_PUBLIC_URL and SHRI_RELEASE.
#
# What changes from development:
# - OpenBao: a real server (integrated storage, sealed at start), initialised and unsealed by deploy.sh.
# - Keycloak: production mode, its own database and role in the same PostgreSQL.
# - API and worker: ENVIRONMENT staging, real staff sign-in; patient sign-in off for now (the X-Dev-*
#   stand-ins are refused outside development and test), images tagged with the commit.
# - The simulated payer and pharmacy: only when SHRI_DEMO=true, never in production.
# - Nginx: one public HTTPS port, the hostname and certificate from the settings; the internal
#   S3 port is not published.
#
# Paths are written "../deploy/…": the same folder whether compose resolves them from
# infra/compose or from here. Synthetic data only, on every host this runs on.

services:
  keycloak-db:
    mem_limit: 128m
    # One shot: Keycloak's own database and role (production mode needs a real database).
    build: ../compose/postgres  # the same image as postgres (built, never pulled)
    image: shri-health/postgres:18.6-pgvector0.8.2
    entrypoint: ["sh", "/init/keycloak-db.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-shri_health}
      PGUSER: ${POSTGRES_USER:-shri}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in the deploy env file}
    volumes:
      - ../deploy/postgres:/init:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    mem_limit: 1536m
    networks: [default, backend]  # the API reaches it on backend (egress below)
    command: !override ["start", "--import-realm"]
    # The admin console and admin API are never on the public host (Nginx refuses /kc/admin/):
    # only on this host's loopback, reached over an SSH tunnel (README) and by deploy.sh.
    ports:
      - "127.0.0.1:${SHRI_KC_ADMIN_PORT:-8081}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # TLS ends at Nginx; Keycloak is reached over the internal network only.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${SHRI_PUBLIC_URL:?run through deploy.sh}/kc
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${SHRI_KC_ADMIN_PORT:-8081}/kc
      # The realms' redirect URIs follow the host (placeholders in realms/*.json).
      SHRI_WEB_REDIRECT_URI: ${SHRI_PUBLIC_URL}/api/v1/auth/callback
      SHRI_WEB_POST_LOGOUT_URI: ${SHRI_PUBLIC_URL}/
      SHRI_PORTAL_REDIRECT_URI: ${SHRI_PUBLIC_URL}/api/v1/portal/auth/callback
      SHRI_PORTAL_POST_LOGOUT_URI: ${SHRI_PUBLIC_URL}/portal/
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_completed_successfully

  openbao:
    mem_limit: 256m
    networks: [default, backend]  # the API reaches it on backend (egress below)
    # A real server: integrated storage in a volume, sealed at every start until deploy.sh
    # unseals it. Its files live outside /openbao/config, which the image's entrypoint takes over.
    command: !override ["server", "-config=/etc/shri-openbao/openbao.hcl"]
    environment: !reset {}
    volumes:
      - ../deploy/openbao:/etc/shri-openbao:ro
      - ../compose/openbao:/init:ro
      - openbao:/openbao/file
    restart: unless-stopped
    healthcheck:
      # 0 only when initialised and unsealed.
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20

  openbao-init:
    # The development one-shot is replaced by deploy.sh (openbao/init-unseal.sh).
    profiles: ["development-only"]

  seaweedfs:
    mem_limit: 512m
    networks: [default, backend]  # the API reaches it on backend (egress below)
    ports: !reset []
    restart: unless-stopped

  clamav:
    # Its daily signature reload holds two copies at once (ConcurrentDatabaseReload), so about
    # twice its 1 GiB at rest for a moment (Vimal on #275).
    mem_limit: 4g
    networks: [default, backend]  # the API reaches it on backend (egress below)
    restart: unless-stopped

  postgres:
    mem_limit: 1g
    networks: [default, backend]  # the API reaches it on backend (egress below)
    restart: unless-stopped

  api:
    mem_limit: 1g
    # No route to the internet: backend only. Its one way out is the egress proxy below, and only
    # to api.anthropic.com (Vimal, 10 Nov). Nginx reaches it on backend, from a fixed address.
    networks: [backend]
    image: shri-health/api:${SHRI_RELEASE:?run through deploy.sh}
    build:
      args:
        BUILD_VERSION: ${SHRI_BUILD_VERSION:-dev}
        BUILD_COMMIT: ${SHRI_RELEASE}
    environment:
      ENVIRONMENT: ${SHRI_ENVIRONMENT:-staging}
      FORWARDED_ALLOW_IPS: ${SHRI_NET_B:-172.31.251}.10  # Nginx's address on backend
      # Under a shared host's path (SHRI_PUBLIC_URL=https://shri-ai.org/dep): the cookies' path
      # (core/cookies.py) and where sign-in lands. "/" and "/" at a host of its own.
      COOKIE_PATH: ${SHRI_COOKIE_PATH:-/}
      AFTER_LOGIN_PATH: ${SHRI_BASE_PATH:-}/
      PORTAL_AFTER_LOGIN_PATH: ${SHRI_BASE_PATH:-}/portal/
      AUTH_MODE: keycloak
      PATIENT_AUTH_MODE: keycloak
      # Real patient sign-in is OFF unless SHRI_PATIENT_SIGN_IN=true, which deploy.sh allows only
      # with SHRI_DEMO=true (fictional patients): it sets these to the patient realm's secrets,
      # and otherwise to "", so the portal's sign-in and enrolment routes answer 503. The
      # development sign-in (X-Dev-*) is refused outside development and test, and Nginx strips
      # its headers.
      PORTAL_CLIENT_SECRET: ${SHRI_API_PORTAL_CLIENT_SECRET:-}
      PORTAL_ADMIN_CLIENT_SECRET: ${SHRI_API_PORTAL_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_PUBLIC_URL: ${SHRI_PUBLIC_URL}/kc
      KEYCLOAK_REDIRECT_URI: ${SHRI_PUBLIC_URL}/api/v1/auth/callback
      ALLOWED_ORIGINS: '["${SHRI_PUBLIC_URL}"]'
      PORTAL_REDIRECT_URI: ${SHRI_PUBLIC_URL}/api/v1/portal/auth/callback
      PORTAL_ORIGIN: ${SHRI_PUBLIC_URL}
      HOOK_SECRET_CLEARINGHOUSE: ${HOOK_SECRET_CLEARINGHOUSE:?}
      HOOK_SECRET_ERX: ${HOOK_SECRET_ERX:?}
      # The file service uses the object store only when these are set (files/s3.py, until it
      # reads core's settings); outside development and test it refuses the folder (503).
      SHRI_S3_ENDPOINT: http://seaweedfs:8333
      SHRI_S3_ACCESS_KEY_ID: shri-api
      SHRI_S3_SECRET_ACCESS_KEY: ${FILE_STORE_SECRET_ACCESS_KEY:?}
      SHRI_S3_BUCKET_CLEAN: shri-clean
      SHRI_S3_BUCKET_QUARANTINE: shri-quarantine
    restart: unless-stopped
    depends_on: !override
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      keycloak:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started

  integration-worker:
    mem_limit: 512m
    # Backend only, like the API: the simulated partners need no internet. Real partners will be
    # added to the egress proxy's list when they are chosen (Q11-Q17).
    networks: [backend]
    image: shri-health/api:${SHRI_RELEASE}
    environment:
      ENVIRONMENT: ${SHRI_ENVIRONMENT:-staging}
      # The simulated payer and pharmacy (D95): demo hosts only; settings refuse it in production.
      SIMULATED_PARTNERS: ${SHRI_DEMO:-false}
      SIMULATED_PARTNER_CALLBACK_URL: http://api:8000
      HOOK_SECRET_CLEARINGHOUSE: ${HOOK_SECRET_CLEARINGHOUSE:?}
      HOOK_SECRET_ERX: ${HOOK_SECRET_ERX:?}
    restart: unless-stopped

  nginx:
    mem_limit: 256m
    networks:
      default:
        ipv4_address: ${SHRI_NET_A:-172.31.250}.10
      backend:
        ipv4_address: ${SHRI_NET_B:-172.31.251}.10  # the API trusts only this address (FORWARDED_ALLOW_IPS)
    # The screens, built from this commit into the edge's image (nginx/Dockerfile).
    image: shri-health/web:${SHRI_RELEASE:?run through deploy.sh}
    build:
      context: ../../frontend
      dockerfile: ../infra/deploy/nginx/Dockerfile
      args:
        SHRI_BASE_PATH: ${SHRI_BASE_PATH:-}
        # The screens' build stamp (deploy.sh, from the checkout it deploys).
        SHRI_BUILD_COMMIT: ${SHRI_BUILD_COMMIT:-}
        SHRI_BUILD_DAY_VERSION: ${SHRI_BUILD_DAY_VERSION:-0}
        # The AI features the screens show, fixed at build time: "on" only with
        # SHRI_DEMO_AI_SCREENS=true on a demo host (deploy.sh), "off" otherwise.
        VITE_FEATURE_AI_NOTE_DRAFT: ${SHRI_WEB_AI:-off}
        VITE_FEATURE_AI_CHART_SUMMARY: ${SHRI_WEB_AI:-off}
        VITE_FEATURE_AI_ASSISTANT: ${SHRI_WEB_AI:-off}
        VITE_FEATURE_AI_MORNING_BRIEF: ${SHRI_WEB_AI:-off}
        VITE_FEATURE_AI_DIFFERENTIAL: ${SHRI_WEB_AI:-off}
    # SHRI_BIND is 127.0.0.1 behind a shared host's Nginx (deploy.sh sets it from SHRI_PUBLIC_URL),
    # so only that host reaches us; 0.0.0.0 on a host of our own.
    ports: !override
      - "${SHRI_BIND:-0.0.0.0}:${SHRI_HTTPS_PORT:-443}:443"
    environment:
      SHRI_HOSTNAME: ${SHRI_HOSTNAME:?}
      SHRI_HTTPS_PORT: ${SHRI_HTTPS_PORT:-443}
      SHRI_PUBLIC_PORT: ${SHRI_PUBLIC_PORT:-443}
      SHRI_HSTS: ${SHRI_HSTS:-max-age=31536000; includeSubDomains}
      SHRI_REAL_IP: ${SHRI_REAL_IP:-}
    volumes: !override
      - ../deploy/nginx:/etc/nginx/templates:ro
      - ${TLS_CERT_FILE:?}:/etc/nginx/certs/server.crt:ro
      - ${TLS_KEY_FILE:?}:/etc/nginx/certs/server.key:ro
    restart: unless-stopped

  egress:
    mem_limit: 64m
    # The API's only way out: api.anthropic.com over HTTPS, by name, never decrypted
    # (egress/nginx.conf). The same pinned Nginx image as the development edge.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ../deploy/egress/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    networks:
      default: {}
      backend:
        aliases: [api.anthropic.com]
    restart: unless-stopped

  code-loader:
    mem_limit: 1g
    # deploy.sh's code load (load_codes) downloads the ICD-10-CM and RxNorm releases, so it runs
    # here, with internet, rather than as the API, which has none. Run only by deploy.sh.
    image: shri-health/api:${SHRI_RELEASE:?run through deploy.sh}
    profiles: ["tools"]
    networks: [default]

volumes:
  openbao:

networks:
  # SHRI_NET_A: another /24 for the default network where this one is taken (a shared host).
  default:
    ipam:
      config: !override
        - subnet: ${SHRI_NET_A:-172.31.250}.0/24
  # Internal: no route to the internet. The API and the worker are on it alone.
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${SHRI_NET_B:-172.31.251}.0/24
