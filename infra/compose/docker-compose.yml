# Local development stack: API, PostgreSQL, Keycloak, OpenBao (dev server, Transit only), Nginx
# (HTTPS on https://localhost:8443).
#
#   cp infra/compose/example.env infra/compose/.env     # then fill in the passwords
#   infra/nginx/make-dev-cert.sh                        # once: self-signed certificate
#   docker compose -f infra/compose/docker-compose.yml up --build
#
# Synthetic data only. Never point this stack at real patient data.

name: shri-health

services:
  postgres:
    # PostgreSQL 18.6 + pgvector 0.8.2, initialised like production on Amazon RDS (ADR-0012):
    # data checksums, SCRAM-SHA-256, C.UTF-8 collation, UTC. POSTGRES_USER stands in for the
    # RDS master role; the service roles (D23) are created by postgres/initdb/ on first start.
    build: ./postgres
    image: shri-health/postgres:18.6-pgvector0.8.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shri_health}
      POSTGRES_USER: ${POSTGRES_USER:-shri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      SHRI_MIGRATOR_PASSWORD: ${SHRI_MIGRATOR_PASSWORD:?set SHRI_MIGRATOR_PASSWORD in infra/compose/.env}
      SHRI_APP_PASSWORD: ${SHRI_APP_PASSWORD:?set SHRI_APP_PASSWORD in infra/compose/.env}
      SHRI_FHIR_READER_PASSWORD: ${SHRI_FHIR_READER_PASSWORD:?set SHRI_FHIR_READER_PASSWORD in infra/compose/.env}
      SHRI_INTEGRATION_PASSWORD: ${SHRI_INTEGRATION_PASSWORD:?set SHRI_INTEGRATION_PASSWORD in infra/compose/.env}
      SHRI_REPORTING_PASSWORD: ${SHRI_REPORTING_PASSWORD:?set SHRI_REPORTING_PASSWORD in infra/compose/.env}
      SHRI_MAINTENANCE_PASSWORD: ${SHRI_MAINTENANCE_PASSWORD:?set SHRI_MAINTENANCE_PASSWORD in infra/compose/.env}
      SHRI_PORTAL_PASSWORD: ${SHRI_PORTAL_PASSWORD:?set SHRI_PORTAL_PASSWORD in infra/compose/.env}
      SHRI_PUBLIC_PASSWORD: ${SHRI_PUBLIC_PASSWORD:?set SHRI_PUBLIC_PASSWORD in infra/compose/.env}
    volumes:
      # PostgreSQL 18 images keep data in a versioned folder under /var/lib/postgresql.
      - pgdata18:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    # Our own image (D75, issue #55): Keycloak's Apache-2.0 release on Debian with Temurin 21,
    # everything pinned and checksum-verified (infra/keycloak/Dockerfile).
    build: ../keycloak
    image: shri-health/keycloak:local
    # Imports the staff realm (infra/keycloak/realms/shri-staff.json) at startup; existing realms
    # are kept. The client secret comes from .env, never from the realm file.
    command: ["start-dev", "--import-realm"]
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/compose/.env}
      KC_HTTP_RELATIVE_PATH: /kc
      # Keycloak 26.8 binds start-dev to localhost only; Nginx reaches it over the compose network.
      KC_HTTP_HOST: 0.0.0.0
      SHRI_WEB_CLIENT_SECRET: ${SHRI_WEB_CLIENT_SECRET:?set SHRI_WEB_CLIENT_SECRET in infra/compose/.env}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://localhost:8443/kc
      KC_HEALTH_ENABLED: "true"

  openbao:
    # A DEVELOPMENT server only (in memory, unsealed, a root token): never for the test server or
    # production, which get a real OpenBao. The API uses its Transit engine to encrypt fields
    # (core/crypto.py). Its data is lost when it stops: ciphertext written before a restart can't
    # be decrypted afterwards, so stored idempotent responses and sessions from before are lost too.
    # MPL-2.0 (D75), pinned by digest (.github/licences/allowed.json "images").
    image: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    command: ["server", "-dev", "-dev-no-store-token", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:?set OPENBAO_DEV_ROOT_TOKEN in infra/compose/.env}
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20

  openbao-init:
    # One shot: the Transit key, and the API's narrow token (encrypt and decrypt with that key only).
    image: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    entrypoint: ["sh", "/init/transit-init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:?set OPENBAO_DEV_ROOT_TOKEN in infra/compose/.env}
      OPENBAO_API_TOKEN: ${OPENBAO_API_TOKEN:?set OPENBAO_API_TOKEN in infra/compose/.env}
    volumes:
      - ./openbao:/init:ro
    restart: "no"
    depends_on:
      openbao:
        condition: service_healthy

  api:
    build:
      context: ../../backend
      # The contract's operations map, the one file the image takes from contracts/ (Dockerfile).
      additional_contexts:
        contracts: ../../contracts/openapi/dist
    environment:
      ENVIRONMENT: development
      # dev_header: X-Dev-User. Set keycloak for real staff sign-in through the realm below.
      AUTH_MODE: dev_header
      # Staff sign-in (core/session.py). The issuer is the public URL (KC_HOSTNAME); the API
      # reaches Keycloak over the compose network. Same client secret as the realm's.
      KEYCLOAK_PUBLIC_URL: https://localhost:8443/kc
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/kc
      KEYCLOAK_CLIENT_SECRET: ${SHRI_WEB_CLIENT_SECRET:?set SHRI_WEB_CLIENT_SECRET in infra/compose/.env}
      KEYCLOAK_REDIRECT_URI: https://localhost:8443/api/v1/auth/callback
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in infra/compose/.env}
      ALLOWED_ORIGINS: '["https://localhost:8443"]'
      # The patient portal's development sign-in (X-Dev-Patient, X-Dev-Patient-Clinic); refused
      # outside development and test.
      PATIENT_AUTH_MODE: dev_header
      # Trust X-Forwarded-For/-Proto only from Nginx's fixed address below, so clients cannot
      # fake their IP in logs, rate limits or audit records.
      FORWARDED_ALLOW_IPS: 172.31.250.10
      # The API connects as shri_app, which cannot bypass row-level security (D23). It never gets
      # the migrator's login; migrations run separately as shri_migrator.
      DATABASE_URL: postgresql+asyncpg://shri_app:${SHRI_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-shri_health}
      FHIR_DATABASE_URL: postgresql+asyncpg://shri_fhir_reader:${SHRI_FHIR_READER_PASSWORD}@postgres:5432/${POSTGRES_DB:-shri_health}
      # The public pre-registration form (D96): its own role, shri_public, which can only run the
      # form's database function. The portal is served from this same host in development.
      PUBLIC_DATABASE_URL: postgresql+asyncpg://shri_public:${SHRI_PUBLIC_PASSWORD}@postgres:5432/${POSTGRES_DB:-shri_health}
      PORTAL_ORIGIN: https://localhost:8443
      PUBLIC_FORM_SECRET: ${PUBLIC_FORM_SECRET:?set PUBLIC_FORM_SECRET in infra/compose/.env}
      # Field encryption through OpenBao Transit, with the narrow token only (never the root).
      OPENBAO_TRANSIT_ADDR: http://openbao:8200
      OPENBAO_TRANSIT_TOKEN: ${OPENBAO_API_TOKEN:?set OPENBAO_API_TOKEN in infra/compose/.env}
    depends_on:
      postgres:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully

  # The outbox worker (T29, D25): sends what the API queued for partners, with retries and the
  # dead-letter queue. The API's image, run as shri_integration, never with the API's login.
  integration-worker:
    build:
      context: ../../backend
      additional_contexts:
        contracts: ../../contracts/openapi/dist
    command: ["python", "-m", "app.integration.worker"]
    environment:
      ENVIRONMENT: development
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://shri_integration:${SHRI_INTEGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB:-shri_health}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    networks:
      default:
        ipv4_address: 172.31.250.10  # the only proxy the API trusts (FORWARDED_ALLOW_IPS)
    depends_on:
      - api
      - keycloak

volumes:
  pgdata18:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
