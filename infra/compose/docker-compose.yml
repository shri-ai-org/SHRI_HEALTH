# Local development stack: API, PostgreSQL, Keycloak, Nginx (HTTPS on https://localhost:8443).
#
#   cp infra/compose/example.env infra/compose/.env     # then fill in the passwords
#   infra/nginx/make-dev-cert.sh                        # once: self-signed certificate
#   docker compose -f infra/compose/docker-compose.yml up --build
#
# Synthetic data only. Never point this stack at real patient data.

name: shri-health

services:
  postgres:
    # Placeholder until Anand's image and config land in infra/postgres/.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shri_health}
      POSTGRES_USER: ${POSTGRES_USER:-shri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/compose/.env}
      KC_HTTP_RELATIVE_PATH: /kc
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://localhost:8443/kc
      KC_HEALTH_ENABLED: "true"

  api:
    build:
      context: ../../backend
    environment:
      ENVIRONMENT: development
      AUTH_MODE: dev_header
      # Stand-in: connects as the database owner, which bypasses row-level security.
      # Switch to the non-owner API role once infra/postgres creates it.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shri}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shri_health}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - keycloak

volumes:
  pgdata:
