# Local development edge: HTTPS with a self-signed certificate (infra/nginx/make-dev-cert.sh).
#   /api/    -> FastAPI
#   /health  -> FastAPI (public liveness check)
#   /hooks/  -> FastAPI (partner callbacks, signature-checked by the API)
#   /kc/     -> Keycloak
# /ready is deliberately not exposed: it is for internal checks only.
# Same-origin only: no CORS headers are added, so other origins cannot call the API.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 25m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        # Development only: a short HSTS without includeSubDomains, so browsers don't force HTTPS on
        # every http://localhost port for a year. Staging and production use
        # "max-age=31536000; includeSubDomains".
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # All proxy headers live here, at server level. nginx only inherits proxy_set_header into a
        # location that sets none of its own, so never add proxy_set_header inside a location:
        # it would silently drop Host and X-Forwarded-* for that location.
        proxy_http_version 1.1;
        proxy_set_header Host              $host:8443;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host:8443;
        proxy_set_header X-Forwarded-Port  8443;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        location /api/ {
            proxy_pass http://api:8000;
            # Server-Sent Events (/api/v1/events/stream) must not be buffered.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        location = /health {
            proxy_pass http://api:8000;
        }

        location /hooks/ {
            proxy_pass http://api:8000;
        }

        location /kc/ {
            proxy_pass http://keycloak:8080;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        location / {
            # Frontend is served here once it exists.
            return 404;
        }
    }
}
