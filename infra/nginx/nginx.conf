# Local development edge: HTTPS with a self-signed certificate (infra/nginx/make-dev-cert.sh).
#   /api/    -> FastAPI
#   /api/v1/portal/practices/ -> FastAPI, the public forms (D96): rate-limited per IP here too
#   /health  -> FastAPI (public liveness check)
#   /hooks/  -> FastAPI (partner callbacks, signature-checked by the API)
#   /kc/     -> Keycloak
# /ready is deliberately not exposed: it is for internal checks only.
# Same-origin only: no CORS headers are added, so other origins cannot call the API.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 25m;

    access_log /dev/stdout;
    # The same as nginx's default "combined" format, but with the path only ($uri), never the
    # query string: for routes whose query carries a credential (the download token, D105, T53).
    log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    error_log /dev/stderr warn;

    # Public forms (D96, pre-registration): per client IP, shared by every nginx worker, so it holds
    # whatever the API's own per-process counters do (core/public_form.py).
    limit_req_zone $binary_remote_addr zone=public_forms:10m rate=10r/m;
    limit_req_status 429;  # answered as Problem Details (API_STANDARDS §9) by @public_form_rate_limited

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        # Development only: a short HSTS without includeSubDomains, so browsers don't force HTTPS on
        # every http://localhost port for a year. Staging and production use
        # "max-age=31536000; includeSubDomains".
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # All proxy headers live here, at server level. nginx only inherits proxy_set_header into a
        # location that sets none of its own, so never add proxy_set_header inside a location:
        # it would silently drop Host and X-Forwarded-* for that location.
        proxy_http_version 1.1;
        proxy_set_header Host              $host:8443;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host:8443;
        proxy_set_header X-Forwarded-Port  8443;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        location /api/ {
            proxy_pass http://api:8000;
            # Server-Sent Events (/api/v1/events/stream) must not be buffered.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        # Decrypting downloads (D105): the link's one-minute token is in the query string, so this
        # route's access log has the path only. error_log stays at crit here, because nginx's
        # error lines quote the whole request line. The API sends no-store and no-referrer.
        location ~ ^/api/v1/files/[^/]+/content$ {
            access_log /dev/stdout no_query;
            error_log /dev/stderr crit;
            proxy_pass http://api:8000;
        }

        # The public forms: no account, no session. A small body, the per-IP limit, and a 429 in the
        # API's Problem Details shape. Request bodies are never logged (nginx doesn't log them).
        location ^~ /api/v1/portal/practices/ {
            limit_req zone=public_forms burst=5 nodelay;
            client_max_body_size 64k;
            error_page 429 = @public_form_rate_limited;
            proxy_pass http://api:8000;
        }

        # The bot-check challenge the form fetches first (#136): public too, so the same per-IP
        # limit; the API adds its own budget for it.
        location = /api/v1/portal/bot-challenge {
            limit_req zone=public_forms burst=5 nodelay;
            error_page 429 = @public_form_rate_limited;
            proxy_pass http://api:8000;
        }

        location @public_form_rate_limited {
            default_type application/problem+json;
            return 429 '{"type":"tag:company-domain.invalid,2026:problem/rate-limited","title":"Too many requests","status":429,"code":"rate-limited"}';
        }

        location = /health {
            proxy_pass http://api:8000;
        }

        location /hooks/ {
            proxy_pass http://api:8000;
        }

        location /kc/ {
            proxy_pass http://keycloak:8080;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        location / {
            # Frontend is served here once it exists.
            return 404;
        }
    }
}
